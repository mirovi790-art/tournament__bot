    <div class="bottom-panel"><div class="bottom-frame">
      <div class="bottom-title">Раунд завершён</div>

/* ============ WHEEL КЭШ ============ */
function _buildWheelHalo(size){
  const cv = document.createElement("canvas"); cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d");
  const cx = size/2, cy = size/2, r = size/2 - 30;
  const grad = ctx.createRadialGradient(cx,cy,r*0.55,cx,cy,r+30);
  grad.addColorStop(0,"rgba(220,20,60,0)");
  grad.addColorStop(0.65,"rgba(255,140,0,0.22)");
  grad.addColorStop(1,"rgba(255,180,60,0)");
  ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx,cy,r+30,0,Math.PI*2); ctx.fill();
  return cv;
}
function _buildWheelSectors(players, size){
  const cv = document.createElement("canvas"); cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d");
  const cx = size/2, cy = size/2, r = size/2 - 30;
  const n = Math.max(players.length, 1);
  const palette = [
    {fill:["#ffb04d","#cc6600"]},{fill:["#e6192b","#7a0008"]},
    {fill:["#ffcc00","#a06a00"]},{fill:["#ff6b00","#8b3000"]},
    {fill:["#c41030","#5a0010"]},
  ];
  for(let i = 0; i < n; i++){
    const a0 = (i/n)*Math.PI*2 - Math.PI/2;
    const a1 = ((i+1)/n)*Math.PI*2 - Math.PI/2;
    const col = palette[i % palette.length];
    const grad = ctx.createRadialGradient(cx, cy, r*0.15, cx, cy, r);
    grad.addColorStop(0, col.fill[0]); grad.addColorStop(1, col.fill[1]);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx + r*Math.cos(a0), cy + r*Math.sin(a0)); ctx.stroke();
    const mid = (a0+a1)/2;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(mid);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 8; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 22px 'Segoe UI',sans-serif";
    const label = players[i] ? players[i].name : "";
    const txt = label.length > 18 ? label.slice(0,18)+"…" : label;
    ctx.fillText(txt, r - 18, 0); ctx.restore();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(mid);
    const dotX = r - 22 - ctx.measureText(txt).width - 8;
    ctx.beginPath(); ctx.arc(dotX, 0, 5, 0, Math.PI*2);
    ctx.fillStyle = "#4ade80"; ctx.shadowColor = "#22c55e"; ctx.shadowBlur = 8; ctx.fill();
    ctx.restore();
  }
  const innerR = r - 4;
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,innerR,0,Math.PI*2);
  const ringGrad = ctx.createLinearGradient(0,0,size,size);
  ringGrad.addColorStop(0,"#ffcc00"); ringGrad.addColorStop(0.5,"#d4a017"); ringGrad.addColorStop(1,"#ffcc00");
  ctx.strokeStyle = ringGrad; ctx.lineWidth = 4; ctx.shadowColor = "#ffb040"; ctx.shadowBlur = 18; ctx.stroke(); ctx.restore();
  return cv;
}
function _buildWheelOuterRing(size){
  const cv = document.createElement("canvas"); cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d");
  const cx = size/2, cy = size/2, r = size/2 - 20;
  ctx.save();
  const outerGrad = ctx.createLinearGradient(0,0,size,size);
  outerGrad.addColorStop(0,"#ffe680"); outerGrad.addColorStop(0.3,"#c89020");
  outerGrad.addColorStop(0.5,"#ffcc00"); outerGrad.addColorStop(0.7,"#a07010");
  outerGrad.addColorStop(1,"#ffcc00");
  ctx.beginPath(); ctx.arc(cx,cy,r-4,0,Math.PI*2);
  ctx.strokeStyle = outerGrad; ctx.lineWidth = 12;
  ctx.shadowColor = "rgba(255,180,60,.8)"; ctx.shadowBlur = 30; ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r-11,0,Math.PI*2);
  ctx.strokeStyle = "rgba(20,15,5,.9)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  for(let i = 0; i < 24; i++){
    const a = (i/24)*Math.PI*2;
    const x = cx + (r-4) * Math.cos(a);
    const y = cy + (r-4) * Math.sin(a);
    ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2);
    ctx.fillStyle = "rgba(60,40,10,.8)"; ctx.fill();
  }
  return cv;
}
function _buildWheelHub(size){
  const cv = document.createElement("canvas"); cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d");
  const cx = size/2, cy = size/2;
  const hubR = 62;
  ctx.save();
  const glowGrad = ctx.createRadialGradient(cx,cy,hubR*0.6,cx,cy,hubR+20);
  glowGrad.addColorStop(0,"rgba(255,180,60,.6)"); glowGrad.addColorStop(1,"rgba(255,140,0,0)");
  ctx.beginPath(); ctx.arc(cx,cy,hubR+20,0,Math.PI*2);
  ctx.fillStyle = glowGrad; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,hubR,0,Math.PI*2);
  const ringGrad = ctx.createRadialGradient(cx,cy,hubR*0.7,cx,cy,hubR);
  ringGrad.addColorStop(0,"#ffe680"); ringGrad.addColorStop(0.5,"#d4a017"); ringGrad.addColorStop(1,"#8b6508");
  ctx.fillStyle = ringGrad; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,hubR-6,0,Math.PI*2);
  const hubGrad = ctx.createRadialGradient(cx,cy,hubR*0.1,cx,cy,hubR-6);
  hubGrad.addColorStop(0,"#2a1f10"); hubGrad.addColorStop(1,"#0a0a0a");
  ctx.fillStyle = hubGrad; ctx.shadowColor = "rgba(255,180,60,.6)"; ctx.shadowBlur = 20; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "44px sans-serif"; ctx.shadowColor = "#ffcc00"; ctx.shadowBlur = 18;
  ctx.fillText("🎡", cx, cy); ctx.restore();
  return cv;
}
function _getWheelCache(players, key, size){
  if(WCACHE.key === key && WCACHE.size === size && WCACHE.sectors && WCACHE.halo && WCACHE.outer && WCACHE.hub) return WCACHE;
  WCACHE = {
    key, size,
    halo:_buildWheelHalo(size),
    sectors:_buildWheelSectors(players,size),
    outer:_buildWheelOuterRing(size),
    hub:_buildWheelHub(size)
  };
  return WCACHE;
}
function _drawBracketWheelFrame(canvas, players, match_id){
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const W = canvas.width, H = canvas.height, cx = W/2, cy = H/2;
  const key = match_id + "|" + players.map(p => (p && p.user_id) || "_").join(",");
  const cache = _getWheelCache(players, key, W);
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(cache.halo, 0, 0);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(WHEEL_ANGLE);
  ctx.drawImage(cache.sectors, -W/2, -H/2);
  ctx.restore();
  ctx.drawImage(cache.outer, 0, 0);
  ctx.drawImage(cache.hub, 0, 0);
}
function drawBracketWheelStatic(canvas, p1, p2, match_id){if(!canvas) return; _drawBracketWheelFrame(canvas, [p1,p2].filter(Boolean), match_id || "static");}
function animateBracketSpin(s, m, onDone){
  const mid = m.match_id;
  const canvas = document.getElementById("wheel");
  if(!canvas){ if(onDone) setTimeout(onDone, 50); return; }
  cancelBracketAnim(mid);
  const players = [m.p1, m.p2].filter(Boolean);
  const n = players.length;
  const winnerIdx = m.last_spin.winner_index;
  const offsetRatio = m.last_spin.final_offset_ratio || 0;
  const duration = m.last_spin.duration || 20000;
  const serverStart = m.last_spin.started_at || nowServer();
  const turns = pickSpinTurns();
  const span = Math.PI*2/n, center = -(winnerIdx+0.5)*span;
  const turnsRad = turns * Math.PI * 2;
  const target = center + offsetRatio*span + turnsRad;
  const startAngle = target - turnsRad;
  const el = nowServer() - serverStart;
  const initialK = Math.min(1, Math.max(0, el/duration));
  WHEEL_ANGLE = startAngle + (target - startAngle)*SPIN_EASING(initialK);
  _drawBracketWheelFrame(canvas, players, mid);
  if(initialK >= 1){
    WHEEL_ANGLE = target;
    _drawBracketWheelFrame(canvas, players, mid);
    if(onDone) onDone();
    return;
  }
  function frame(){
    if(BRACKET_ACTIVE_MATCH_ID !== mid){ BRACKET_MATCH_VIEW_ANIM[mid] = null; return; }
    const elapsed = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, elapsed/duration));
    WHEEL_ANGLE = startAngle + (target - startAngle)*SPIN_EASING(k);
    _drawBracketWheelFrame(canvas, players, mid);
    if(k < 1){ BRACKET_MATCH_VIEW_ANIM[mid] = requestAnimationFrame(frame); }
    else {
      WHEEL_ANGLE = target;
      _drawBracketWheelFrame(canvas, players, mid);
      BRACKET_MATCH_VIEW_ANIM[mid] = null;
      if(onDone) onDone();
    }
  }
  BRACKET_MATCH_VIEW_ANIM[mid] = requestAnimationFrame(frame);
}

function renderWheel1v1(s){
  LAST_STATE = s;
  els.roomExitBtn.classList.add("hidden");
  if(s.waiting){
    els.rmCounter.textContent = `Ожидание…`;
    els.roomContent.innerHTML = `<div class="waiting-box"><div class="waiting-ico">⚔️</div><div class="waiting-txt">Ожидание принятия…</div></div>`;
    return;
  }
  if(W1V1_VIEW_STATE === "spinning") return;
  if(W1V1_VIEW_STATE === "showing_result" || W1V1_VIEW_STATE === "final_result") return;
  const players = s.players || [];
  const lastShown = W1V1_LAST_SHOWN || 0;
  const hasNewSpin = s.last_spin && s.spin_count > lastShown;
  if(hasNewSpin){
    W1V1_LAST_SHOWN = s.spin_count;
    W1V1_VIEW_STATE = "spinning";
    startWheel1v1Animation(s, ()=>{
      setTimeout(()=>{
        if(W1V1_VIEW_STATE !== "spinning") return;
        const st = LAST_STATE;
        if(!st) return;
        if(st.finished){
          W1V1_VIEW_STATE = "final_result";
          drawWheel1v1FinalResult(st);
          if(W1V1_TIMER) clearTimeout(W1V1_TIMER);
          W1V1_TIMER = setTimeout(()=>{
            W1V1_VIEW_STATE = "idle";
            if(W1V1_TIMER){clearTimeout(W1V1_TIMER);W1V1_TIMER=null;}
            exitRoom();
          }, 8000);
        } else {
          W1V1_VIEW_STATE = "showing_result";
          drawWheel1v1RoundResult(st);
          if(W1V1_TIMER) clearTimeout(W1V1_TIMER);
          W1V1_TIMER = setTimeout(()=>{
            W1V1_VIEW_STATE = "idle";
            if(W1V1_TIMER){clearTimeout(W1V1_TIMER);W1V1_TIMER=null;}
            if(LAST_STATE) renderWheel1v1(LAST_STATE);
          }, 3500);
        }
      }, 1000);
    });
    return;
  }
  if(s.finished){
    W1V1_VIEW_STATE = "final_result";
    drawWheel1v1FinalResult(s);
    return;
  }
  drawWheel1v1UI(s);
}

function startWheel1v1Animation(s, onDone){
  WHEEL_LOCK = true;
  const players = s.players || [];
  els.roomContent.innerHTML = `
    ${_w1v1ScoreHtml(s)}
    <div class="wheel-arena"><div class="wheel-frame"><div class="wheel-frame-inner">

    </div></div></div>`;

  if(!canvas){WHEEL_LOCK = false; onDone && onDone(); return;}
  if(W1V1_ANIM){try{cancelAnimationFrame(W1V1_ANIM);}catch(e){} W1V1_ANIM = null;}
  const n = players.length;
  const winnerIdx = s.last_spin.winner_index;
  const offsetRatio = s.last_spin.final_offset_ratio || 0;
  const duration = s.last_spin.duration || 8000;
  const serverStart = s.last_spin.started_at || nowServer();
  const turns = pickSpinTurns();
  const span = Math.PI*2/n, center = -(winnerIdx+0.5)*span;
  const turnsRad = turns * Math.PI * 2;
  const target = center + offsetRatio*span + turnsRad;
  const startAngle = target - turnsRad;
  const matchKey = "1v1spin_" + (s.tid||"");
  function setPhase(){
    const el = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, el/duration));
    WHEEL_ANGLE = startAngle + (target - startAngle) * SPIN_EASING(k);
    return k;
  }
  setPhase(); _drawBracketWheelFrame(canvas, players, matchKey);
  function frame(){
    const k = setPhase();
    _drawBracketWheelFrame(canvas, players, matchKey);
    if(k < 1) W1V1_ANIM = requestAnimationFrame(frame);
    else {
      WHEEL_ANGLE = target;
      _drawBracketWheelFrame(canvas, players, matchKey);
      WHEEL_LOCK = false;
      W1V1_ANIM = null;
      if(PENDING_ENDED){const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(()=>_showEndedModal(e), 600);}
      if(onDone) onDone();
    }
  }
  W1V1_ANIM = requestAnimationFrame(frame);
}

function renderPokerLobby(s){

  PK_LAST_LOBBY = s;

        const freeSeats = t.free_seats !== undefined ? t.free_seats : Math.max(0, (s.max_seats||7) - (t.players_count||0));
        const isFull = freeSeats <= 0;
        const isMyTable = (s.my_table_id === t.table_id);
        const canSit = !s.is_seated && !isFull;
        const seatedCount = t.seated_count !== undefined ? t.seated_count : (t.players_count||0);
        const freeLabel = `${seatedCount} / ${s.max_seats||7}`;

        let statusCls = "waiting";

        if(t.merge_warning_until && t.merge_warning_until*1000 > Date.now()){
          statusCls = "merge"; statusTxt = "⚠ Слияние";
        } else if(t.started || (t.phase && t.phase !== "waiting")){
          statusCls = "running"; statusTxt = `Идёт (#${t.hand_number||0})`;
        } else if(isFull){

        let cls = "pk-table-card";
        if(isMyTable) cls += " mine";

        let btn;
        if(isMyTable){
          btn = `<button class="pkt-btn open" data-pk-open="${t.table_id}">🎮 Открыть стол</button>`;
        } else if(s.is_seated){
          btn = `<button class="pkt-btn full" disabled>Вы уже за столом #${s.my_table_id}</button>`;
        } else if(isFull){
          btn = `<button class="pkt-btn full" disabled>Стол полон</button>`;
        } else {
          btn = `<button class="pkt-btn" data-pk-sit="${t.table_id}">🪑 Сесть за стол</button>`;
        }

        const playersChips = (t.player_chips || []);
        const chipsRow = playersChips.length
          ? `<div class="pkt-players">${playersChips.slice(0,8).map(p => `<span class="pkt-chip">${escapeHtml(p.name||"")}: ${p.chips||0}</span>`).join("")}</div>`
          : "";

        body += `

            <div class="pkt-meta">

            ${chipsRow}
            ${btn}
          </div>`;
      });
      body += `</div>`;
    }
  } else {
    // ranking
    const players = s.players || [];
    if(!players.length){
      body = `<div class="waiting-box" style="padding:40px 20px;"><div class="waiting-ico">📊</div><div class="waiting-txt">Рейтинг пуст</div></div>`;

        const isMe = p.user_id === MY_ID;
        const cls = "pk-rank-row" + (isOut ? " out" : "") + (isMe ? " me" : "");
        const placeShow = isOut ? ("#" + p.finish_place) : place;
        const chipsShow = isOut ? "выбыл" : `💰 ${p.chips}`;
        // статус посадки
        let seatTag = "";
        if(!isOut){
          if(p.seated === false){
            seatTag = `<span class="rk-unseated">не за столом</span>`;
          } else if(p.table_id){
            seatTag = `<span class="rk-place-seated">стол #${p.table_id}</span>`;
          }
        }
        // кнопка исключить (для админов, не для себя)
        let kickBtn = "";
        if(IS_ADMIN && !isMe && !isOut){
          kickBtn = `<button class="rk-kick" data-pk-kick="${p.user_id}" data-pk-kick-name="${escapeHtml(p.name||"")}">🚫 Искл.</button>`;
        }
        body += `
          <div class="${cls}">
            <div class="rk-place">${placeShow}</div>
            <div class="rk-name">${escapeHtml(p.name)}${isMe ? ' <span style="color:#ffcc00;">(вы)</span>' : ''}</div>
            ${seatTag}
            <div class="rk-chips">${chipsShow}</div>
            ${kickBtn}
          </div>`;
        if(!isOut) place++;
      });
      body += `</div>`;
    }
  }

  els.roomContent.innerHTML = `<div class="pk-lobby">${info}${banner}${tabs}${body}</div>`;

  // события
  els.roomContent.querySelectorAll(".pk-lobby-tab").forEach(el=>{
    el.addEventListener("click",()=>{
      PK_LOBBY_TAB = el.dataset.pktab;
      if(PK_LAST_LOBBY) renderPokerLobby(PK_LAST_LOBBY);
    });
  });
  els.roomContent.querySelectorAll("[data-pk-sit]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      e.stopPropagation();
      const tid = parseInt(el.dataset.pkSit,10);
      if(!tid) return;
      wsSend({type:"poker_sit", table_id:tid});
    });
  });
  els.roomContent.querySelectorAll("[data-pk-open]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      e.stopPropagation();

  els.roomContent.querySelectorAll("[data-pk-kick]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      e.stopPropagation();
      const uid = parseInt(el.dataset.pkKick,10);
      const nm = el.dataset.pkKickName || "Игрок";

      showConfirm("🚫 Исключить игрока?", `Игрок <b style="color:#ffcc00;">${escapeHtml(nm)}</b> будет исключён из покер-турнира.`, ()=>{
        wsSend({type:"admin_kick_player", user_id: uid});
      });
    });
  });

   POKER TABLE RENDER
   ============================================================ */
function pokerSeatPositions(total){
  const positions = [];
  const nOpp = Math.max(0, total - 1);
  const cx = 50, cy = 50;
  const rx = 42, ry = 40;
  if(nOpp === 1){
    positions.push([50, 14]);
  } else if(nOpp > 1){
    for(let i = 0; i < nOpp; i++){
      const t = i / (nOpp - 1);
      const angleDeg = 165 - t * 150;
      const rad = angleDeg * Math.PI / 180;
      const x = cx + rx * Math.cos(rad);
      const y = cy - ry * Math.sin(rad);
      positions.push([x, y]);
    }
  }
  positions.push([50, 90]);
  return positions;
}

function cardMiniHtml(card){
  if(!card || card === "?" || card.length < 2){
    return `<div class="mini">?</div>`;
  }
  const r = card[0] === "T" ? "10" : card[0];
  const s = card.slice(1);
  const red = (s === "♥" || s === "♦") ? " red" : "";
  return `<div class="mini face${red}">${r}<span class="s">${s}</span></div>`;
}
function cardBigHtml(card){
  if(!card || card === "?" || card.length < 2) return `<div class="card empty"></div>`;
  const r = card[0] === "T" ? "10" : card[0];
  const s = card.slice(1);
  const red = (s === "♥" || s === "♦") ? " red" : "";
  return `<div class="card${red}"><span class="r">${r}</span><span class="s">${s}</span></div>`;
}

function renderPokerState(s){
  LAST_STATE = s;
  if(PK_VIEW !== "table"){
    PK_VIEW = "table";
    PK_TABLE_ID = s.table_id;
    els.roomExitBtn.classList.remove("hidden");
    els.roomExitBtn.textContent = "⬅️ В лобби";
  }
  if(s.table_id) PK_TABLE_ID = s.table_id;

  if(!s.players || !s.players.length){
    els.roomContent.innerHTML = `<div class="waiting-box"><div class="waiting-ico">🃏</div><div class="waiting-txt">Ожидание игроков…</div></div>`;
    return;
  }

  const players = s.players;
  const meIdx = (s.me_idx !== undefined && s.me_idx >= 0) ? s.me_idx : 0;
  const me = players[meIdx] || {};
  const positions = pokerSeatPositions(players.length);
  els.rmCounter.textContent = `Стол #${s.table_id||0} · Раздача #${s.hand_number||0} · Блайнды ${s.sb||10}/${s.bb||20}`;

  let seatsHtml = "";
  let order = [];
  for(let i = 0; i < players.length; i++){
    if(i === meIdx) continue;
    order.push(i);
  }
  order.push(meIdx);
  order.forEach((idx, posIdx)=>{
    const p = players[idx];
    const pos = positions[posIdx] || [50,50];
    const isTurn = (idx === s.turn_idx);
    const isDealer = !!p.is_dealer;
    const folded = !!p.folded;
    const sitOut = !!p.sit_out;
    const isOut = (p.finish_place !== null && p.finish_place !== undefined);
    const lastAction = p.last_action || "";
    const lastActionCls = lastAction.toLowerCase().split(/\s+/)[0];
    const cardsHtml = (p.cards || []).map(c => cardMiniHtml(c)).join("");
    let cls = "poker-seat";
    if(isTurn) cls += " turn";
    if(isDealer) cls += " dealer";
    if(folded) cls += " folded";
    if(sitOut) cls += " sitout";
    if(isOut) cls += " out";
    seatsHtml += `
      <div class="${cls}" data-idx="${idx}" style="left:${pos[0]}%;top:${pos[1]}%;">
        <div class="poker-avatar-wrap">
          <svg class="poker-timer-svg" viewBox="0 0 100 100">
            <circle class="poker-timer-bg" cx="50" cy="50" r="45"/>
            <circle class="poker-timer-ring" cx="50" cy="50" r="45"
                    stroke-dasharray="283" stroke-dashoffset="283"/>
          </svg>
          <div class="poker-avatar">${idx === meIdx ? '🙋' : '👤'}</div>
        </div>
        <div class="pname">${escapeHtml(p.name)}${idx === meIdx ? ' (вы)' : ''}</div>
        <div class="pchips">💰 ${p.chips}</div>
        ${!isOut && cardsHtml ? `<div class="pcards">${cardsHtml}</div>` : ""}
        ${lastAction ? `<div class="last-action ${lastActionCls}">${escapeHtml(lastAction)}</div>` : ""}
        ${p.bet > 0 ? `<div class="bet-chip">${p.bet}</div>` : ""}
        ${isOut ? `<div class="pfinish">#${p.finish_place}</div>` : ""}
      </div>`;
  });

  const community = s.community || [];
  let commHtml = "";
  for(let i = 0; i < 5; i++){
    commHtml += community[i] ? cardBigHtml(community[i]) : `<div class="card empty"></div>`;
  }

  const sidePotsHtml = (s.side_pots && s.side_pots.length)
    ? `<div class="poker-sidepots">${s.side_pots.map((sp, i) => `<span class="sp">Side ${i+1}: ${sp.amount}</span>`).join("")}</div>`
    : "";

  const phaseNames = {preflop:"Префлоп", flop:"Флоп", turn:"Тёрн", river:"Ривер", showdown:"Вскрытие", waiting:"Ожидание"};
  const phaseLabel = phaseNames[s.phase] || s.phase || "";

  let mergeBanner = "";
  if(s.merge_warning_until && s.merge_warning_until*1000 > Date.now()){
    const rem = Math.max(0, Math.ceil((s.merge_warning_until*1000 - Date.now())/1000));
    mergeBanner = `
      <div class="pk-merge-banner" id="pk-merge-banner">
        <span class="big">⚠️ Столы объединяются</span>
        Слияние со столом #${s.merge_with_table_id || '—'} через <span class="cd">${rem}</span> сек
      </div>`;
  }

  const feltHtml = `
    <div class="poker-table-wrap">
      <div class="poker-felt">
        ${seatsHtml}
        <div class="poker-center">
          <div class="poker-pot">💰 Банк: ${s.pot||0}</div>
          ${sidePotsHtml}
          <div class="poker-community">${commHtml}</div>
          <div class="poker-phase">${phaseLabel}</div>
        </div>
      </div>
    </div>`;

  const myCardsHtml = (me.cards || []).map(c => {
    if(!c || c === "?" || c.length < 2) return `<div class="card" style="background:#222;color:#666;">?</div>`;
    const r = c[0] === "T" ? "10" : c[0];
    const suit = c.slice(1);
    const red = (suit === "♥" || suit === "♦") ? " red" : "";
    return `<div class="card${red}"><span class="r">${r}</span><span class="s">${suit}</span></div>`;
  }).join("");
  const myHandName = s.my_hand_name ? `🃏 ${s.my_hand_name}` : "";
  const myZoneHtml = `
    <div class="poker-myzone">
      <div class="my-cards">${myCardsHtml || '<div class="hand-name muted" style="padding:16px;">Ждём раздачи…</div>'}</div>
      ${myHandName ? `<div class="hand-name">${escapeHtml(myHandName)}</div>` : ""}
    </div>`;

  const isMyTurn = s.turn_idx === meIdx && !me.folded && !me.all_in && !me.sit_out && !me.finish_place;
  const canCheck = s.can_check;
  const canCall = s.can_call;
  const canBet = s.can_bet;
  const canRaise = s.can_raise;
  const toCall = s.me_to_call || 0;
  const myMaxBet = s.my_max_bet || 0;
  const myMinBet = s.my_min_bet || 0;

  PK_MIN = myMinBet;
  PK_MAX = myMaxBet;
  if(PK_CUR_BET < PK_MIN) PK_CUR_BET = PK_MIN;
  if(PK_CUR_BET > PK_MAX) PK_CUR_BET = PK_MAX;

  let controlsHtml = "";
  if(isMyTurn){
    const mainAction2Label = canCheck ? "CHECK" : `CALL ${toCall}`;
    const mainAction3Label = canBet ? `BET ${PK_CUR_BET}` : (canRaise ? `RAISE ${PK_CUR_BET}` : "BET");
    controlsHtml = `
      <div class="poker-controls"><div class="frame">
        <div class="bet-slider-row">
          <button class="stepbtn" id="bet-minus" ${PK_CUR_BET <= PK_MIN ? "disabled" : ""}>−</button>
          <div class="slider-wrap">
            <input type="range" id="bet-slider" min="${PK_MIN}" max="${PK_MAX}" value="${PK_CUR_BET}" step="${Math.max(1, Math.floor((s.bb||20)/2))}"/>
            <div class="bet-val" id="bet-val">${PK_CUR_BET}</div>
          </div>
          <button class="stepbtn" id="bet-plus" ${PK_CUR_BET >= PK_MAX ? "disabled" : ""}>+</button>
        </div>
        <div class="quick-bets">
          <button data-quick="min">MIN</button>
          <button data-quick="half">½ POT</button>
          <button data-quick="pot">POT</button>
          <button data-quick="allin">ALL-IN</button>
        </div>
        <div class="main-actions">
          <button class="act-fold" data-act="fold">FOLD</button>
          <button class="${canCheck ? 'act-check' : 'act-call'}" data-act="${canCheck ? 'check' : 'call'}">${mainAction2Label}</button>
          <button class="${canBet ? 'act-bet' : 'act-raise'}" data-act="${canBet ? 'bet' : 'raise'}" ${(!canBet && !canRaise) ? "disabled" : ""}>${mainAction3Label}</button>
        </div>
        <div class="poker-utility">
          <button id="pk-sitout" class="${me.sit_out ? 'active' : ''}">${me.sit_out ? "↩️ I'm back" : "💤 Sit out"}</button>
          <button class="warn" id="pk-rebuy">💰 Rebuy</button>
          <button class="danger" id="pk-leave">🚪 Leave</button>
        </div>
      </div></div>`;
  } else {
    const preCF = (s.pre_actions && s.pre_actions.check_fold) || false;
    const preCA = (s.pre_actions && s.pre_actions.call_any) || false;
    PK_PRE.check_fold = preCF;
    PK_PRE.call_any = preCA;
    const activePlayer = (s.turn_idx >= 0 && players[s.turn_idx]) ? players[s.turn_idx] : null;
    const waitingLabel = activePlayer
      ? `Ход: <span class="who">${escapeHtml(activePlayer.name)}</span>`
      : (s.phase === "showdown" ? "Вскрытие…" : "Ожидание…");
    const canPreAct = !me.folded && !me.sit_out && !me.finish_place && s.phase !== "showdown" && !s.finished;
    controlsHtml = `
      <div class="poker-controls"><div class="frame">
        ${canPreAct ? `
          <div class="pre-actions">
            <div class="pre-row ${preCF ? 'on' : ''}" data-pre="check_fold">
              <div class="cb">✓</div>
              <div>Check / Fold <span style="color:#9a9a9a;font-size:10px;margin-left:4px;">(чек, если бесплатно — иначе фолд)</span></div>
            </div>
            <div class="pre-row ${preCA ? 'on' : ''}" data-pre="call_any">
              <div class="cb">✓</div>
              <div>Call Any <span style="color:#9a9a9a;font-size:10px;margin-left:4px;">(колл текущей ставки)</span></div>
            </div>
          </div>` : ""}
        <div class="waiting-actions">${waitingLabel}</div>
        <div class="poker-utility">
          <button id="pk-sitout" class="${me.sit_out ? 'active' : ''}">${me.sit_out ? "↩️ I'm back" : "💤 Sit out"}</button>
          <button class="warn" id="pk-rebuy">💰 Rebuy</button>
          <button class="danger" id="pk-leave">🚪 Leave</button>
        </div>
      </div></div>`;
  }

  els.roomContent.innerHTML = mergeBanner + feltHtml + myZoneHtml + controlsHtml;

  const sl = document.getElementById("bet-slider");
  if(sl){
    sl.addEventListener("input", ()=>{ PK_CUR_BET = parseInt(sl.value, 10) || 0; pkUpdateBetUI(); });
  }
  const bm = document.getElementById("bet-minus");
  if(bm) bm.addEventListener("click", ()=>{ PK_CUR_BET = Math.max(PK_MIN, PK_CUR_BET - (s.bb||20)); pkUpdateBetUI(); });
  const bp = document.getElementById("bet-plus");
  if(bp) bp.addEventListener("click", ()=>{ PK_CUR_BET = Math.min(PK_MAX, PK_CUR_BET + (s.bb||20)); pkUpdateBetUI(); });

  document.querySelectorAll(".quick-bets button").forEach(b=>{
    b.addEventListener("click", ()=>{
      const kind = b.dataset.quick;
      const potNow = s.pot || 0;
      const cur = s.current_bet || 0;
      if(kind === "min") PK_CUR_BET = PK_MIN;
      else if(kind === "half") PK_CUR_BET = Math.max(PK_MIN, Math.min(PK_MAX, Math.floor(potNow * 0.5) + cur));
      else if(kind === "pot") PK_CUR_BET = Math.max(PK_MIN, Math.min(PK_MAX, potNow + cur));
      else if(kind === "allin") PK_CUR_BET = PK_MAX;
      pkUpdateBetUI();
    });
  });

  document.querySelectorAll(".main-actions button").forEach(b=>{
    b.addEventListener("click", ()=>{
      const act = b.dataset.act;
      if(act === "fold") pkSend({action:"fold"});
      else if(act === "check") pkSend({action:"check"});
      else if(act === "call") pkSend({action:"call"});
      else if(act === "bet") pkSend({action:"bet", amount:PK_CUR_BET});
      else if(act === "raise") pkSend({action:"raise", amount:PK_CUR_BET});
    });
  });

  document.querySelectorAll(".pre-row").forEach(r=>{
    r.addEventListener("click", ()=>{
      const key = r.dataset.pre;
      const willBeOn = !r.classList.contains("on");
      if(key === "check_fold"){
        PK_PRE.check_fold = willBeOn; PK_PRE.call_any = false;
        pkSend({action: willBeOn ? "pre_check_fold" : "pre_clear"});
      } else if(key === "call_any"){
        PK_PRE.call_any = willBeOn; PK_PRE.check_fold = false;
        pkSend({action: willBeOn ? "pre_call_any" : "pre_clear"});
      }
    });
  });

  const soBtn = document.getElementById("pk-sitout");
  if(soBtn) soBtn.addEventListener("click", ()=>wsSend({type:"poker_sit_out", table_id: PK_TABLE_ID}));
  const rbBtn = document.getElementById("pk-rebuy");
  if(rbBtn) rbBtn.addEventListener("click", ()=>wsSend({type:"poker_rebuy", table_id: PK_TABLE_ID}));
  const lvBtn = document.getElementById("pk-leave");
  if(lvBtn) lvBtn.addEventListener("click", ()=>{
    showConfirm("🚪 Покинуть стол?","Вы выйдете из раздачи. Подтвердить?",()=>{
      wsSend({type:"poker_leave", table_id: PK_TABLE_ID});
      PK_VIEW = "lobby"; PK_TABLE_ID = null;
      wsSend({type:"request_lobby"});
      els.roomExitBtn.classList.add("hidden");
    });
  });
}

function pkSend(payload){
  wsSend(Object.assign({type:"poker_action", table_id: PK_TABLE_ID}, payload));
}
function pkUpdateBetUI(){
  const sl = document.getElementById("bet-slider");
  const val = document.getElementById("bet-val");
  if(sl) sl.value = PK_CUR_BET;
  if(val) val.textContent = PK_CUR_BET;
  const bm = document.getElementById("bet-minus");
  const bp = document.getElementById("bet-plus");
  if(bm) bm.disabled = PK_CUR_BET <= PK_MIN;
  if(bp) bp.disabled = PK_CUR_BET >= PK_MAX;
  const raiseBtn = document.querySelector('.main-actions .act-bet, .main-actions .act-raise');
  if(raiseBtn){
    const isBet = raiseBtn.classList.contains("act-bet");
    raiseBtn.textContent = isBet ? `BET ${PK_CUR_BET}` : `RAISE ${PK_CUR_BET}`;
  }
}

function handleMergeWarning(msg){
  const until = msg.merge_until_ms || 0;
  PK_MERGE_UNTIL_MS = until;
  const withTable = msg.with_table_id || "—";
  const rem = Math.max(0, Math.ceil((until - Date.now())/1000));
  if(PK_MERGE_MODAL_SHOWN) return;
  PK_MERGE_MODAL_SHOWN = true;
  els.modalTitle.textContent = "⚠️ Слияние столов";
  els.modalBody.innerHTML = `
    Ваш стол объединяется со столом <b style="color:#ffcc00;">#${withTable}</b>.<br><br>
    Через <b id="pk-merge-cd" style="color:#ff8080;font-size:20px;">${rem}</b> секунд все игроки будут пересажены за один стол.
    <br><br><span style="color:#9a9a9a;font-size:12px;">Раздача завершится, деньги сохранятся.</span>`;
  els.modalBtns.innerHTML = `<button class="btn" id="pk-merge-ok">Понятно</button>`;
  document.getElementById("pk-merge-ok").onclick = ()=>hide(els.modal);
  show(els.modal);
  const tick = setInterval(()=>{
    if(!PK_MERGE_UNTIL_MS){ clearInterval(tick); hide(els.modal); return; }
    const r = Math.max(0, Math.ceil((PK_MERGE_UNTIL_MS - Date.now())/1000));
    const cd = document.getElementById("pk-merge-cd");
    if(cd) cd.textContent = r;
    if(r <= 0){ clearInterval(tick); hide(els.modal); }
  }, 250);
  setTimeout(()=>{ if(PK_MERGE_MODAL_SHOWN){ hide(els.modal); PK_MERGE_MODAL_SHOWN = false; } }, 9000);
  try{ tg?.HapticFeedback?.notificationOccurred?.("warning"); }catch(e){}
}

function getKickablePlayers(){
  const s = LAST_STATE;
  if(!s) return [];
  let players = [];
  if(GAME_TYPE === "poker") players = (s.players || []).map(p=>({user_id:p.user_id,name:p.name}));
  else if(GAME_TYPE === "wheel_1v1") players = (s.players || []).map(p=>({user_id:p.user_id,name:p.name}));
  else if(GAME_TYPE === "wheel") players = [...(s.active||[]).map(p=>({user_id:p.user_id,name:p.name})),...(s.eliminated||[]).map(p=>({user_id:p.user_id,name:p.name}))];
  else if(GAME_TYPE === "bracket"){
    const seen = new Set();
    for(const rnd of (s.rounds || [])) for(const m of rnd){
      if(m.p1 && !seen.has(m.p1.user_id)){seen.add(m.p1.user_id); players.push(m.p1);}
      if(m.p2 && !seen.has(m.p2.user_id)){seen.add(m.p2.user_id); players.push(m.p2);}
    }
  }
  return players.filter(p => p.user_id !== MY_ID);
}
els.adKick.addEventListener("click",()=>{
  const list = getKickablePlayers();
  if(!list.length){showModal("🚫 Кик игрока","<div style='color:#666;'>Нет доступных.</div>",[]); return;}
  const rows = list.map(p=>`<div class="kick-row"><span class="kick-name">${escapeHtml(p.name||("Игрок "+p.user_id))}</span><button class="kick-x" data-uid="${p.user_id}" data-name="${escapeHtml(p.name||"Игрок")}">❌</button></div>`).join("");
  showModal("🚫 Удалить игрока",`<div class="kick-list">${rows}</div>`,[]);
  document.querySelectorAll("#modal-body .kick-x").forEach(b=>{
    b.addEventListener("click",()=>{
      const uid = parseInt(b.dataset.uid,10);
      const name = b.dataset.name || "Игрок";
      hide(els.modal);
      showConfirm("🚫 Удалить игрока?",`Игрок <b style="color:#ffcc00;">${escapeHtml(name)}</b> будет исключён.`,()=>{wsSend({type:"admin_kick_player", user_id:uid});});
    });
  });
});
function showModal(title, body, buttons){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body;
  if(!buttons || !buttons.length){
    els.modalBtns.innerHTML = '<button class="btn" id="mc">Закрыть</button>';
    document.getElementById("mc").onclick = () => hide(els.modal);
  } else {
    els.modalBtns.innerHTML = "";
    buttons.forEach(b=>{
      const btn = document.createElement("button");
      btn.className = "btn"; btn.style.background = b.color||"#1e1e1e"; btn.textContent = b.text;
      btn.onclick = b.onClick; els.modalBtns.appendChild(btn);
    });
  }
  show(els.modal);
}
function showConfirm(title, body, onYes){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body;
  els.modalBtns.innerHTML = `
    <button class="btn" style="background:linear-gradient(135deg,#8b0000,#dc2626);" id="cy">Да</button>
    <button class="btn" style="background:#1e1e1e;" id="cn">Отмена</button>`;
  document.getElementById("cy").onclick = () => {hide(els.modal); onYes();};
  document.getElementById("cn").onclick = () => hide(els.modal);
  show(els.modal);
}
function fireConfetti(){
  const canvas = els.confetti; show(canvas);
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  const colors = ["#ffcc00","#ffa500","#ff8800","#dc143c","#e91e63","#ffb040"];
  const pieces = Array.from({length:160},()=>({
    x:Math.random()*canvas.width, y:-20-Math.random()*200,
    vy:2+Math.random()*3, vx:-1+Math.random()*2,
    r:4+Math.random()*5, color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*Math.PI, vr:-0.1+Math.random()*0.2,
  }));
  let f = 0;
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r,-p.r,p.r*2,p.r*0.6); ctx.restore();
    });
    f++; if(f<400) requestAnimationFrame(loop); else hide(canvas);
  }
  loop();
}
