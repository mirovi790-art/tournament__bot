const NEON_PALETTE = [
  {fill:["#ffb04d","#cc6600"], glow:"#ff9500"},
  {fill:["#e6192b","#7a0008"], glow:"#dc143c"},
  {fill:["#ffcc00","#a06a00"], glow:"#ffcc00"},
  {fill:["#ff6b00","#8b3000"], glow:"#ff6b00"},
  {fill:["#c41030","#5a0010"], glow:"#c41030"},
  {fill:["#ff8040","#a03000"], glow:"#ff8040"},
];
function drawWheel(canvas, active){
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height, cx = W/2, cy = H/2, r = Math.min(W,H)/2 - 30;
  ctx.clearRect(0,0,W,H);
  /* Halo */
  const haloGrad = ctx.createRadialGradient(cx,cy,r*0.55,cx,cy,r+30);
  haloGrad.addColorStop(0,"rgba(220,20,60,0)");
  haloGrad.addColorStop(0.65,"rgba(255,140,0,0.22)");
  haloGrad.addColorStop(1,"rgba(255,180,60,0)");
  ctx.fillStyle = haloGrad; ctx.beginPath(); ctx.arc(cx,cy,r+30,0,Math.PI*2); ctx.fill();
  const n = Math.max(active.length, 1);
  if(active.length === 0){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    const emptyGrad = ctx.createRadialGradient(cx,cy,r*0.3,cx,cy,r);
    emptyGrad.addColorStop(0,"#1a1a1a"); emptyGrad.addColorStop(1,"#0a0a0a");
    ctx.fillStyle = emptyGrad; ctx.fill();
    ctx.strokeStyle = "rgba(255,180,60,.4)"; ctx.lineWidth = 3;
    ctx.shadowColor = "#ff9500"; ctx.shadowBlur = 30; ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#666"; ctx.font = "bold 24px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Ожидание", cx, cy); drawHub(ctx, cx, cy); return;
  }
  for(let i = 0; i < n; i++){
    const a0 = (i/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const a1 = ((i+1)/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const col = NEON_PALETTE[i % NEON_PALETTE.length];
    const grad = ctx.createRadialGradient(cx,cy,r*0.15,cx,cy,r);
    grad.addColorStop(0, col.fill[0]); grad.addColorStop(1, col.fill[1]);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.save(); ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx + r*Math.cos(a0), cy + r*Math.sin(a0)); ctx.stroke(); ctx.restore();
    const mid = (a0+a1)/2;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(mid);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 8; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#ffffff"; ctx.font = "900 20px 'Segoe UI',sans-serif";
    const label = active[i].name || "";
    const txt = label.length > 14 ? label.slice(0,14)+"…" : label;
    ctx.fillText(txt, r - 18, 0); ctx.restore();
  }
  /* Золотой внешний обод */
  ctx.save();
  const outerGrad = ctx.createLinearGradient(0,0,W,H);
  outerGrad.addColorStop(0,"#ffe680"); outerGrad.addColorStop(0.5,"#ffcc00"); outerGrad.addColorStop(1,"#a07010");
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle = outerGrad; ctx.lineWidth = 10;
  ctx.shadowColor = "rgba(255,180,60,.8)"; ctx.shadowBlur = 30; ctx.stroke(); ctx.restore();
  drawHub(ctx, cx, cy);
}
function drawHub(ctx, cx, cy){
  const hubR = 62;
  ctx.save();
  const glowGrad = ctx.createRadialGradient(cx,cy,hubR*0.6,cx,cy,hubR+20);
  glowGrad.addColorStop(0,"rgba(255,180,60,.6)"); glowGrad.addColorStop(1,"rgba(255,140,0,0)");
  ctx.beginPath(); ctx.arc(cx,cy,hubR+20,0,Math.PI*2);
  ctx.fillStyle = glowGrad; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,hubR,0,Math.PI*2);
  const ringGrad = ctx.createRadialGradient(cx,cy,hubR*0.7,cx,cy,hubR);
  ringGrad.addColorStop(0,"#ffe680"); ringGrad.addColorStop(0.5,"#d4a017"); ringGrad.addColorStop(1,"#8b6508");
  ctx.fillStyle = ringGrad; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,hubR-6,0,Math.PI*2);
  const hubGrad = ctx.createRadialGradient(cx,cy,hubR*0.1,cx,cy,hubR-6);
  hubGrad.addColorStop(0,"#2a1f10"); hubGrad.addColorStop(1,"#0a0a0a");
  ctx.fillStyle = hubGrad; ctx.shadowColor = "rgba(255,180,60,.6)"; ctx.shadowBlur = 20; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "44px sans-serif"; ctx.shadowColor = "#ffcc00"; ctx.shadowBlur = 18;
  ctx.fillText("🎡", cx, cy); ctx.restore();
}
function startSpinAnimation(s){
  WHEEL_LOCK = true; WHEEL_LAST_SPIN_SHOWN = s.spin_count;
  let activeWithElim;
  if(s.last_spin.before_active) activeWithElim = s.last_spin.before_active.map(p=>({...p}));
  else {activeWithElim = s.active.slice(); activeWithElim.splice(s.last_spin.sector_index, 0, s.last_spin.eliminated);}
  const canvas = document.getElementById("wheel");
  if(!canvas){WHEEL_LOCK = false; return;}
  const n = activeWithElim.length;
  const idx = s.last_spin.sector_index;
  const offsetRatio = s.last_spin.final_offset_ratio || 0;
  const duration = s.last_spin.duration || 8000;
  const serverStart = s.last_spin.started_at || nowServer();
  const turns = pickSpinTurns();
  const span = Math.PI*2/n, center = -(idx+0.5)*span;
  const turnsRad = turns * Math.PI * 2;
  const target = center + offsetRatio*span + turnsRad;
  const startAngle = target - turnsRad;
  function setPhase(force){
    const el = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, el/duration));
    WHEEL_ANGLE = startAngle + (target - startAngle)*SPIN_EASING(k);
    if(force){const c = document.getElementById("wheel"); if(c) drawWheel(c, activeWithElim);}
    return k;
  }
  let k = setPhase(true);
  if(k >= 1){
    WHEEL_ANGLE = target;
    const c = document.getElementById("wheel"); if(c) drawWheel(c, activeWithElim);
    setTimeout(()=>{
      hide(els.modal); WHEEL_LOCK = false;
      const finalState = WHEEL_NEXT || s;
      WHEEL_NEXT = null;
      updateWheelDOMOnly(finalState);
      if(PENDING_ENDED){const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(()=>_showEndedModal(e), 500); return;}
      if(finalState.finished){stopAutoSpin(); return;}
      if(AUTO_SPIN && (finalState.active||[]).length >= 2 && ACTIVE_TID && WS && WS.readyState === 1){
        AUTO_TIMER = setTimeout(()=>{if(AUTO_SPIN && WS.readyState === 1) wsSend({type:"spin"});}, 7000);
      } else stopAutoSpin();
    }, 100);
    return;
  }
  function frame(){
    const kk = setPhase(false);
    const c = document.getElementById("wheel"); if(c) drawWheel(c, activeWithElim);
    if(kk < 1){requestAnimationFrame(frame);}
    else {
      WHEEL_ANGLE = target;
      const c2 = document.getElementById("wheel"); if(c2) drawWheel(c2, activeWithElim);
      showModal("❌ Выбывает", `<b style="color:#ffcc00;">${escapeHtml(s.last_spin.eliminated.name)}</b><br>покидает турнир!`, []);
      setTimeout(()=>{
        hide(els.modal); WHEEL_LOCK = false;
        const finalState = WHEEL_NEXT || s;
        WHEEL_NEXT = null;
        updateWheelDOMOnly(finalState);
        if(PENDING_ENDED){const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(()=>_showEndedModal(e), 500); return;}
        if(finalState.finished){stopAutoSpin(); return;}
        if(AUTO_SPIN && (finalState.active||[]).length >= 2 && ACTIVE_TID && WS && WS.readyState === 1){
          AUTO_TIMER = setTimeout(()=>{if(AUTO_SPIN && WS.readyState === 1) wsSend({type:"spin"});}, 7000);
        } else stopAutoSpin();
      }, 2500);
    }
  }
  requestAnimationFrame(frame);
}

/* ================== CONTROLS ================== */
document.addEventListener("click", e => {
  const btn = e.target.closest("#acts button");
  if(!btn || btn.disabled) return;
  const act = btn.dataset.act;
  let amount = 0;
  if(act==="raise"){const sl = document.getElementById("rslider"); amount = sl?parseInt(sl.value,10)||0:0;}
  wsSend({type:"poker_action", action:act, amount});
});
els.leaveBtn.addEventListener("click",()=>{
  showConfirm("🚪 Покинуть турнир?","Вы выйдете досрочно. Подтвердить?",()=>{
    wsSend({type:"leave_tournament"});
  });
});
els.adEnd.addEventListener("click",()=>{
  showConfirm("🏁 Закончить турнир?","Турнир будет остановлен. Победитель НЕ засчитается.",()=>{
    wsSend({type:"admin_end_tournament"});
  });
});
function getKickablePlayers(){
  const s = LAST_STATE;
  if(!s) return [];
  let players = [];
  if(GAME_TYPE === "poker") players = (s.players || []).map(p=>({user_id:p.user_id,name:p.name}));
  else if(GAME_TYPE === "wheel_1v1") players = (s.players || []).map(p=>({user_id:p.user_id,name:p.name}));
  else if(GAME_TYPE === "wheel") players = [...(s.active||[]).map(p=>({user_id:p.user_id,name:p.name})),...(s.eliminated||[]).map(p=>({user_id:p.user_id,name:p.name}))];
  else if(GAME_TYPE === "bracket"){
    const seen = new Set();
    for(const rnd of (s.rounds || [])) for(const m of rnd){
      if(m.p1 && !seen.has(m.p1.user_id)){seen.add(m.p1.user_id); players.push(m.p1);}
      if(m.p2 && !seen.has(m.p2.user_id)){seen.add(m.p2.user_id); players.push(m.p2);}
    }
  }
  return players.filter(p => p.user_id !== MY_ID);
}
els.adKick.addEventListener("click",()=>{
  const list = getKickablePlayers();
  if(!list.length){showModal("🚫 Кик игрока","<div style='color:#666;'>Нет доступных.</div>",[]); return;}
  const rows = list.map(p=>`<div class="kick-row"><span class="kick-name">${escapeHtml(p.name||("Игрок "+p.user_id))}</span><button class="kick-x" data-uid="${p.user_id}" data-name="${escapeHtml(p.name||"Игрок")}">❌</button></div>`).join("");
  showModal("🚫 Удалить игрока",`<div class="kick-list">${rows}</div>`,[]);
  document.querySelectorAll("#modal-body .kick-x").forEach(b=>{
    b.addEventListener("click",()=>{
      const uid = parseInt(b.dataset.uid,10);
      const name = b.dataset.name || "Игрок";
      hide(els.modal);
      showConfirm("🚫 Удалить игрока?",`Игрок <b style="color:#ffcc00;">${escapeHtml(name)}</b> будет исключён.`,()=>{wsSend({type:"admin_kick_player", user_id:uid});});
    });
  });
});
function showModal(title, body, buttons){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body;
  if(!buttons || !buttons.length){
    els.modalBtns.innerHTML = '<button class="btn" id="mc">Закрыть</button>';
    document.getElementById("mc").onclick = () => hide(els.modal);
  } else {
    els.modalBtns.innerHTML = "";
    buttons.forEach(b=>{
      const btn = document.createElement("button");
      btn.className = "btn"; btn.style.background = b.color||"#1e1e1e"; btn.textContent = b.text;
      btn.onclick = b.onClick; els.modalBtns.appendChild(btn);
    });
  }
  show(els.modal);
}
function showConfirm(title, body, onYes){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body;
  els.modalBtns.innerHTML = `
    <button class="btn" style="background:linear-gradient(135deg,#8b0000,#dc2626);" id="cy">Да</button>
    <button class="btn" style="background:#1e1e1e;" id="cn">Отмена</button>`;
  document.getElementById("cy").onclick = () => {hide(els.modal); onYes();};
  document.getElementById("cn").onclick = () => hide(els.modal);
  show(els.modal);
}
function fireConfetti(){
  const canvas = els.confetti; show(canvas);
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  const colors = ["#ffcc00","#ffa500","#ff8800","#dc143c","#e91e63","#ffb040"];
  const pieces = Array.from({length:160},()=>({
    x:Math.random()*canvas.width, y:-20-Math.random()*200,
    vy:2+Math.random()*3, vx:-1+Math.random()*2,
    r:4+Math.random()*5, color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*Math.PI, vr:-0.1+Math.random()*0.2,
  }));
  let f = 0;
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r,-p.r,p.r*2,p.r*0.6); ctx.restore();
    });
    f++; if(f<400) requestAnimationFrame(loop); else hide(canvas);
  }
  loop();
}
