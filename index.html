<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Турнир · Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0e1a;color:#f1f5f9;min-height:100vh;user-select:none;overflow-x:hidden;}
#app{display:flex;flex-direction:column;min-height:100vh;}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(135deg,#1e40af,#7c3aed);border-bottom:2px solid #a78bfa;position:sticky;top:0;z-index:20;gap:6px;flex-wrap:wrap;}
#title{font-weight:800;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.status{font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;}
.status.ok{background:#16a34a;}
.status.err{background:#dc2626;}
.btn-leave{background:#b91c1c;color:#fff;border:none;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;}
.btn-admin{background:#ea580c;color:#fff;border:none;padding:6px 9px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;margin-right:3px;}
.view{flex:1;display:flex;flex-direction:column;}
.hidden{display:none!important;}
.tabs{display:flex;background:#1e293b;border-bottom:2px solid #334155;}
.tab{flex:1;padding:14px;text-align:center;font-weight:800;font-size:14px;color:#94a3b8;cursor:pointer;transition:.2s;}
.tab.active{color:#fbbf24;border-bottom:3px solid #fbbf24;background:#0f172a;}
.pf-wrap{padding:16px;}
.pf-card{background:linear-gradient(135deg,#1e40af,#7c3aed);border-radius:18px;padding:22px;text-align:center;box-shadow:0 6px 24px rgba(124,58,237,.4);}
.pf-card .av{font-size:64px;margin-bottom:6px;}
.pf-card .nm{font-size:20px;font-weight:800;}
.pf-card .un{font-size:13px;opacity:.85;margin-bottom:8px;}
.pf-card .rl{display:inline-block;background:rgba(0,0,0,.35);padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;}
.pf-stat{margin-top:12px;background:#1e293b;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;}
.pf-stat .v{font-size:26px;font-weight:900;color:#fbbf24;}
.tr-list{padding:14px;display:flex;flex-direction:column;gap:12px;}
.tr-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid #334155;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;}
.tr-card .hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.tr-card .name{font-size:16px;font-weight:800;color:#fef3c7;}
.tr-card .emoji{font-size:28px;}
.tr-card .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#cbd5e1;}
.tr-card .meta b{color:#fbbf24;}
.tr-card .btn-start{padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-weight:900;font-size:15px;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 12px rgba(34,197,94,.4);}
.tr-card .btn-start:disabled{background:#475569;box-shadow:none;}
.empty{padding:40px 20px;text-align:center;color:#94a3b8;}
.room-head{padding:16px 14px 8px;text-align:center;}
.room-title{font-family:Georgia,serif;font-size:26px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#fbbf24,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px;text-shadow:0 0 30px rgba(251,191,36,.5);}
.room-prize{display:inline-block;padding:10px 24px;border:3px solid #fbbf24;border-radius:14px;background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.05));color:#fbbf24;font-weight:900;font-size:15px;box-shadow:0 0 20px rgba(251,191,36,.4),inset 0 0 20px rgba(251,191,36,.1);}
.counter-badge{display:inline-block;padding:6px 14px;background:#334155;border-radius:999px;font-size:13px;margin-top:8px;color:#cbd5e1;font-weight:700;}

/* ===== NЕОНОВОЕ КОЛЕСО ===== */
.wheel-stage{position:relative;display:flex;justify-content:center;align-items:center;padding:32px 14px 14px;perspective:1000px;}
.wheel-stage::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(219,39,119,.25) 0%,transparent 60%),radial-gradient(circle at 50% 45%,rgba(124,58,237,.2) 0%,transparent 70%);pointer-events:none;animation:wheelPulse 3s ease-in-out infinite;}
@keyframes wheelPulse{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.03);}}
#wheel{position:relative;z-index:2;width:90vw;max-width:480px;filter:drop-shadow(0 0 30px rgba(219,39,119,.6)) drop-shadow(0 0 60px rgba(124,58,237,.4));animation:wheelGlow 4s ease-in-out infinite;}
@keyframes wheelGlow{0%,100%{filter:drop-shadow(0 0 30px rgba(219,39,119,.6)) drop-shadow(0 0 60px rgba(124,58,237,.4));}50%{filter:drop-shadow(0 0 40px rgba(219,39,119,.9)) drop-shadow(0 0 80px rgba(124,58,237,.7));}}
.pointer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:0;z-index:5;filter:drop-shadow(0 0 12px #fbbf24) drop-shadow(0 0 24px rgba(251,191,36,.7));animation:pointerBob 1.2s ease-in-out infinite;}
.pointer::before{content:'';display:block;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:36px solid #fbbf24;filter:drop-shadow(0 3px 8px rgba(0,0,0,.9));}
.pointer::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fbbf24 60%,#f59e0b 100%);box-shadow:0 0 14px #fbbf24,0 0 28px #f59e0b;}
@keyframes pointerBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(3px);}}
.spin-big{display:flex;justify-content:center;padding:8px 16px 16px;}
.spin-big button{position:relative;padding:18px 44px;border-radius:999px;border:2px solid rgba(255,255,255,.3);background:linear-gradient(135deg,#db2777,#a855f7,#f59e0b);background-size:200% 200%;color:#fff;font-weight:900;font-size:18px;letter-spacing:2px;cursor:pointer;box-shadow:0 0 24px rgba(219,39,119,.7),0 0 48px rgba(168,85,247,.5),0 8px 24px rgba(0,0,0,.5);animation:spinBtnShift 3s ease infinite;transition:transform .15s,box-shadow .3s;}
.spin-big button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 32px rgba(219,39,119,.9),0 0 64px rgba(168,85,247,.7),0 12px 28px rgba(0,0,0,.6);}
.spin-big button:active:not(:disabled){transform:translateY(0) scale(.97);}
.spin-big button:disabled{background:#334155;border-color:#475569;box-shadow:none;animation:none;color:#94a3b8;}
@keyframes spinBtnShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.participants{margin:0 14px 20px;background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:14px;padding:14px;border:1px solid rgba(124,58,237,.4);box-shadow:0 0 20px rgba(124,58,237,.2),inset 0 0 20px rgba(124,58,237,.05);}
.participants h3{margin:0 0 10px;font-size:14px;font-weight:800;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px;}
.p-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.p-list::-webkit-scrollbar{width:6px;}
.p-list::-webkit-scrollbar-track{background:#0f172a;border-radius:3px;}
.p-list::-webkit-scrollbar-thumb{background:linear-gradient(135deg,#7c3aed,#db2777);border-radius:3px;}
.p-row{display:flex;justify-content:space-between;padding:10px 14px;background:rgba(15,23,42,.7);border-radius:8px;font-size:13px;border-left:3px solid #22c55e;transition:all .2s;}
.p-row:hover{background:rgba(15,23,42,.95);transform:translateX(2px);}
.p-row.elim{color:#fca5a5;opacity:.6;border-left-color:#dc2626;text-decoration:line-through;}
.p-row.win{color:#fef3c7;font-weight:800;border-left-color:#fbbf24;background:linear-gradient(90deg,rgba(251,191,36,.2),rgba(15,23,42,.7));box-shadow:0 0 12px rgba(251,191,36,.4);}
.p-row.ready{border-left-color:#22c55e;background:linear-gradient(90deg,rgba(34,197,94,.15),rgba(15,23,42,.7));}
.p-row .ready-mark{color:#22c55e;font-weight:900;margin-left:6px;text-shadow:0 0 6px rgba(34,197,94,.6);}

/* ===== 1×1 ROOM ===== */
.duel-wrap{padding:14px;display:flex;flex-direction:column;gap:14px;}
.duel-vs{display:flex;align-items:center;justify-content:space-around;background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid rgba(168,85,247,.5);border-radius:20px;padding:20px 14px;box-shadow:0 0 30px rgba(168,85,247,.3),inset 0 0 20px rgba(168,85,247,.1);}
.duel-side{flex:1;text-align:center;padding:8px;}
.duel-side .ava{font-size:44px;margin-bottom:6px;filter:drop-shadow(0 0 12px rgba(255,255,255,.3));}
.duel-side .nm{font-weight:800;font-size:15px;color:#fef3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;}
.duel-side .status-tag{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;}
.duel-side .status-tag.notready{background:#7f1d1d;color:#fecaca;}
.duel-side .status-tag.ready{background:#065f46;color:#d1fae5;box-shadow:0 0 12px rgba(34,197,94,.6);}
.duel-vs-mid{font-size:28px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 10px;text-shadow:0 0 30px rgba(251,191,36,.5);animation:vsPulse 2s infinite;}
@keyframes vsPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.ready-btn{display:flex;justify-content:center;padding:4px 16px 16px;}
.ready-btn button{padding:16px 38px;border-radius:999px;border:2px solid rgba(255,255,255,.3);background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-weight:900;font-size:16px;letter-spacing:1.5px;cursor:pointer;box-shadow:0 0 24px rgba(34,197,94,.6),0 8px 24px rgba(0,0,0,.5);transition:transform .15s,box-shadow .3s;}
.ready-btn button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 32px rgba(34,197,94,.9);}
.ready-btn button:disabled{background:#334155;box-shadow:none;color:#94a3b8;}
.ready-btn button.pressed{background:linear-gradient(135deg,#065f46,#065f46);cursor:default;}
.waiting-info{text-align:center;color:#94a3b8;font-size:14px;padding:10px;}

/* ===== POKER ===== */
.table-wrap{padding:8px;display:flex;justify-content:center;align-items:center;}
.table-felt{position:relative;width:100%;max-width:520px;aspect-ratio:4/5;border-radius:50%/40%;background:radial-gradient(ellipse at center,#16a34a 0%,#065f46 100%);border:10px solid #b45309;box-shadow:inset 0 0 80px rgba(0,0,0,.3),0 0 40px rgba(251,191,36,.3);display:flex;align-items:center;justify-content:center;}
.pot{position:absolute;top:6%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#facc15,#f59e0b);padding:8px 20px;border-radius:999px;font-weight:900;color:#422006;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.5);}
.community{display:flex;gap:6px;justify-content:center;align-items:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.card{width:46px;height:64px;background:#fff;color:#111;border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px;font-weight:800;font-size:16px;box-shadow:0 4px 8px rgba(0,0,0,.5);animation:dealCard .35s ease-out;}
.card.red{color:#dc2626;}
.card.back{background:repeating-linear-gradient(45deg,#2563eb,#2563eb 8px,#7c3aed 8px,#7c3aed 16px);color:transparent;}
@keyframes dealCard{from{transform:translateY(-60px) rotate(-25deg);opacity:0;}to{transform:translateY(0) rotate(0);opacity:1;}}
#players-ring{position:absolute;inset:0;}
.player{position:absolute;width:92px;transform:translate(-50%,-50%);background:linear-gradient(135deg,#1e293b,#334155);border:3px solid #475569;border-radius:14px;padding:8px 5px 5px;text-align:center;font-size:12px;transition:all .25s;}
.player.turn{border-color:#facc15;box-shadow:0 0 24px #facc15,0 0 12px #f59e0b;}
.player.folded{opacity:.35;filter:grayscale(1);}
.player .name{font-weight:800;font-size:12px;color:#fef3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player .chips{color:#fbbf24;font-weight:800;font-size:13px;text-shadow:0 0 6px rgba(251,191,36,.5);}
.player .bet{color:#22d3ee;font-size:11px;font-weight:700;}
.player .cards{display:flex;gap:2px;justify-content:center;margin-top:3px;}
.player .cards .mini{width:18px;height:26px;border-radius:3px;background:#fff;color:#111;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.player .cards .mini.red{color:#dc2626;}
.player .cards .mini.back{background:#1e40af;color:transparent;}
.log-box{margin:6px 10px;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:10px;font-size:11px;color:#94a3b8;max-height:60px;overflow-y:auto;white-space:pre-line;}
.actions-frame{margin:8px 12px;padding:12px;border:3px solid #a78bfa;border-radius:18px;background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(30,64,175,.15));box-shadow:0 0 24px rgba(167,139,250,.3),inset 0 0 24px rgba(167,139,250,.05);}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.btn{border:none;border-radius:12px;padding:14px 10px;color:#fff;font-weight:800;font-size:14px;cursor:pointer;transition:transform .1s,opacity .15s;background:#334155;box-shadow:0 3px 8px rgba(0,0,0,.3);}
.btn:active{transform:scale(.95);}
.btn:disabled{opacity:.35;}
.btn-fold{background:linear-gradient(135deg,#991b1b,#dc2626);}
.btn-check{background:linear-gradient(135deg,#1e40af,#2563eb);}
.btn-call{background:linear-gradient(135deg,#065f46,#16a34a);}
.btn-raise{background:linear-gradient(135deg,#b45309,#f59e0b);}
.btn-allin{background:linear-gradient(135deg,#7c3aed,#a855f7);}
.raise-row{display:flex;align-items:center;gap:12px;padding:8px 14px 4px;}
.raise-row input{flex:1;}
#raise-amount{font-weight:800;color:#fbbf24;min-width:60px;text-align:right;}
.timer-bar{height:8px;background:#1e293b;overflow:hidden;border-radius:4px;margin:8px 14px;}
#timer-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transition:width .3s linear;}
.waiting-box{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 20px;gap:16px;text-align:center;}
.waiting-ico{font-size:80px;animation:pulse 1.6s infinite ease-in-out;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(1.08);}}
.waiting-txt{font-size:17px;color:#94a3b8;font-weight:700;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid #475569;border-radius:20px;padding:26px 22px;max-width:380px;width:100%;text-align:center;animation:pop .3s ease-out;max-height:90vh;overflow-y:auto;}
@keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
#modal-title{font-size:22px;font-weight:900;margin-bottom:14px;color:#fbbf24;}
#modal-body{font-size:14px;color:#e2e8f0;margin-bottom:16px;line-height:1.6;}
.modal-btns{display:flex;gap:8px;flex-wrap:wrap;}
.modal-btns .btn{flex:1;min-width:120px;}
.kick-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.kick-list button{padding:12px;background:#7f1d1d;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;}
.countdown-text{color:#fbbf24;font-size:14px;font-weight:800;margin-top:8px;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="title">🏆 Турнир</div>
    <div id="admin-toolbar" class="hidden">
      <button id="ad-pause" class="btn-admin">⏸</button>
      <button id="ad-kick" class="btn-admin">🚫</button>
      <button id="ad-end" class="btn-admin">🏁</button>
    </div>
    <button id="leave-btn" class="btn-leave hidden">🚪 Выйти</button>
    <div id="status" class="status">Подключение…</div>
  </header>

  <div id="tabs" class="tabs">
    <div class="tab active" data-tab="profile">👤 Профиль</div>
    <div class="tab" data-tab="tournaments">🏆 Турниры</div>
  </div>

  <main id="profile-view" class="view">
    <div class="pf-wrap">
      <div class="pf-card">
        <div class="av">👤</div>
        <div class="nm" id="pf-name">—</div>
        <div class="un" id="pf-uname"></div>
        <div class="rl" id="pf-role">🎮 Игрок</div>
      </div>
      <div class="pf-stat"><span>🏆 Побед</span><span class="v" id="pf-wins">0</span></div>
    </div>
  </main>

  <main id="tournaments-view" class="view hidden">
    <div class="tr-list" id="tr-list"><div class="empty">Загрузка…</div></div>
  </main>

  <main id="room-view" class="view hidden">
    <div class="room-head">
      <div class="room-title" id="rm-title">—</div>
      <div class="room-prize" id="rm-prize">🏆 Приз</div>
      <div class="counter-badge" id="rm-counter">👥 Игроков: 0</div>
    </div>
    <div id="room-content"></div>
  </main>

  <div id="modal" class="modal hidden"><div class="modal-card">
    <div id="modal-title"></div><div id="modal-body"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div></div>
  <canvas id="confetti" class="confetti hidden"></canvas>
</div>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand?.();
const INIT_DATA = tg?.initData || "";
const els = {
  title: document.getElementById("title"), status: document.getElementById("status"),
  tabs: document.getElementById("tabs"),
  profileView: document.getElementById("profile-view"),
  tournamentsView: document.getElementById("tournaments-view"),
  roomView: document.getElementById("room-view"),
  trList: document.getElementById("tr-list"),
  pfName: document.getElementById("pf-name"), pfUname: document.getElementById("pf-uname"),
  pfRole: document.getElementById("pf-role"), pfWins: document.getElementById("pf-wins"),
  rmTitle: document.getElementById("rm-title"), rmPrize: document.getElementById("rm-prize"),
  rmCounter: document.getElementById("rm-counter"),
  roomContent: document.getElementById("room-content"),
  leaveBtn: document.getElementById("leave-btn"),
  adminToolbar: document.getElementById("admin-toolbar"),
  adPause: document.getElementById("ad-pause"),
  adKick: document.getElementById("ad-kick"),
  adEnd: document.getElementById("ad-end"),
  modal: document.getElementById("modal"), modalTitle: document.getElementById("modal-title"),
  modalBody: document.getElementById("modal-body"), modalBtns: document.getElementById("modal-btns"),
  confetti: document.getElementById("confetti"),
};
let MY_ID = null, IS_ADMIN = false, WS = null, ACTIVE_TID = null;
let GAME_TYPE = null, LAST_STATE = null;
let IS_CREATOR = false, IS_PARTICIPANT = false, MY_STATUS = null;
let WHEEL_ANGLE = 0;
let WHEEL_LOCK = false;
let WHEEL_NEXT = null;
let WHEEL_LAST_SPIN_SHOWN = 0;
let WHEEL_INITIAL_DONE = false;
let AUTO_SPIN = false, AUTO_TIMER = null, EXIT_TIMER = null;
let PENDING_ENDED = null;
let SERVER_OFFSET = 0;
// Для 1×1:
let MY_READY = false;
let READY_STATE = null;

function show(el){el.classList.remove("hidden");}
function hide(el){el.classList.add("hidden");}
function setStatus(t,c){els.status.textContent=t; els.status.className="status "+(c||"");}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function stopAutoSpin(){ AUTO_SPIN = false; if(AUTO_TIMER){ clearTimeout(AUTO_TIMER); AUTO_TIMER = null; } }
function clearExitTimer(){ if(EXIT_TIMER){ clearTimeout(EXIT_TIMER); EXIT_TIMER = null; } }
function syncServerTime(s){ if(s && s.server_now){ SERVER_OFFSET = s.server_now - Date.now(); } }
function nowServer(){ return Date.now() + SERVER_OFFSET; }

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    if(ACTIVE_TID) return;
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    hide(els.profileView); hide(els.tournamentsView);
    if(t.dataset.tab === "profile") show(els.profileView);
    else { show(els.tournamentsView); loadTournaments(); }
  });
});

(async function boot(){
  if(!INIT_DATA){setStatus("Нет данных","err");return;}
  await loadProfile();
  setStatus("🟢 Онлайн","ok");
})();

async function loadProfile(){
  try{
    const r = await fetch(`/api/profile?initData=${encodeURIComponent(INIT_DATA)}`);
    if(!r.ok) throw new Error(await r.text());
    const p = await r.json();
    MY_ID = p.user_id;
    IS_ADMIN = p.is_admin;
    els.pfName.textContent = p.first_name || "Игрок";

}

    els.trList.innerHTML = "";
    tours.forEach(t => {

      else if(t.game_type === "wheel_1v1") gameName = "Колесо 1×1";

      let canStart = t.status === "running" || t.status === "paused";

      if(t.game_type === "wheel_1v1"){

        } else if(t.status === "registration"){
          btnLabel = "⏳ Ждём второго игрока";

      }

      const card = document.createElement("div");
      card.className = "tr-card";

      else if(t.my_status === "creator") badge = '<span style="color:#a78bfa;font-weight:800;font-size:11px;">🎨 СОЗДАТЕЛЬ</span>';
      else if(t.my_status === "pending") badge = '<span style="color:#fbbf24;font-weight:800;font-size:11px;">📩 ПРИГЛАШЕНИЕ</span>';

async function openRoom(tid){
  try{
    const r = await fetch(`/api/tournament/${tid}?initData=${encodeURIComponent(INIT_DATA)}`);
    if(!r.ok){
      const e = await r.json().catch(()=>({detail:"Ошибка"}));
      showModal("⚠ Ошибка", e.detail || "Не удалось войти", []);
      return;
    }
    const info = await r.json();
    GAME_TYPE = info.game_type;
    ACTIVE_TID = tid;
    IS_ADMIN = info.is_admin;
    IS_PARTICIPANT = info.is_participant;
    MY_STATUS = info.my_status;
    WHEEL_LOCK = false; WHEEL_NEXT = null; WHEEL_LAST_SPIN_SHOWN = 0;
    WHEEL_INITIAL_DONE = false; WHEEL_ANGLE = 0;
    PENDING_ENDED = null;
    MY_READY = false;
    hide(els.tabs); hide(els.profileView); hide(els.tournamentsView);
    show(els.roomView);
    els.title.textContent = `🏆 ${info.name}`;
    els.rmTitle.textContent = info.name;
    els.rmPrize.textContent = "🏆 " + (info.prize || "Приз");
    show(els.leaveBtn);
    if(IS_ADMIN && IS_PARTICIPANT) show(els.adminToolbar);
    else hide(els.adminToolbar);
    connectWS(tid);
  }catch(e){ showModal("⚠ Ошибка", e.message, []); }
}

function exitRoom(){
  stopAutoSpin(); clearExitTimer();
  PENDING_ENDED = null; WHEEL_NEXT = null; WHEEL_LOCK = false;
  MY_READY = false; READY_STATE = null;
  if(WS) try{WS.close();}catch(e){}
  WS = null; ACTIVE_TID = null; GAME_TYPE = null; LAST_STATE = null;
  hide(els.roomView); hide(els.leaveBtn); hide(els.adminToolbar);
  hide(els.modal); hide(els.confetti);
  show(els.tabs);
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelector('.tab[data-tab="tournaments"]').classList.add("active");
  show(els.tournamentsView);
  loadTournaments();
  loadProfile();
}

function connectWS(tid){
  if(WS) try{WS.close();}catch(e){}
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = `${proto}://${location.host}/ws/${tid}?initData=${encodeURIComponent(INIT_DATA)}`;
  WS = new WebSocket(url);
  WS.onopen = () => setStatus("🟢 Онлайн","ok");
  WS.onclose = () => {
    if(!ACTIVE_TID) return;
    setStatus("🔴 Оффлайн","err"); setTimeout(()=>{ if(ACTIVE_TID) connectWS(ACTIVE_TID); },2000);
  };
  WS.onerror = () => setStatus("⚠ Ошибка","err");
  WS.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if(msg.type === "poker_state"){ syncServerTime(msg); renderPoker(msg); }
    else if(msg.type === "wheel_state"){ syncServerTime(msg); renderWheel(msg); }
    else if(msg.type === "wheel_1v1_state"){ syncServerTime(msg); renderWheel1v1(msg); }
    else if(msg.type === "wheel_1v1_ready"){ /* ждём state */ }
    else if(msg.type === "not_ready"){ showModal("⏳ Не готово","Оба игрока должны нажать «Готов».",[]); }
    else if(msg.type === "spin_denied"){ showModal("⛔ Нет доступа","Крутить может только администратор.",[]); }
    else if(msg.type === "left_tournament"){
      stopAutoSpin(); showModal("🚪 Вы вышли","Возврат в меню...",[]);
      clearExitTimer(); EXIT_TIMER = setTimeout(()=>exitRoom(), 3000);
    }
    else if(msg.type === "player_kicked" && msg.user_id === MY_ID){
      stopAutoSpin(); showModal("🚫 Исключение","Администратор удалил вас.",[]);
      clearExitTimer(); EXIT_TIMER = setTimeout(()=>exitRoom(), 5000);
    }
    else if(msg.type === "tournament_ended"){ handleTournamentEnded(msg); }
    else if(msg.type === "tournament_cancelled"){
      stopAutoSpin();
      showModal("🛑 Отменён","Турнир отменён.",[]);
      clearExitTimer(); EXIT_TIMER = setTimeout(()=>exitRoom(), 5000);
    }
    else if(msg.type === "final_table"){
      showModal("🎯 ФИНАЛЬНЫЙ СТОЛ","Все игроки собраны за одним столом!",[]);
      setTimeout(()=>hide(els.modal), 3000);
    }
  };
}
function wsSend(o){ if(WS && WS.readyState===1) WS.send(JSON.stringify(o)); }

function handleTournamentEnded(msg){
  if(GAME_TYPE === 'wheel' && WHEEL_LOCK){ PENDING_ENDED = msg; return; }
  if(GAME_TYPE === 'wheel_1v1' && WHEEL_LOCK){ PENDING_ENDED = msg; return; }
  _showEndedModal(msg);
}

function _showEndedModal(msg){
  const manual = !!msg.manual;
  const winnerId = msg.winner_id;
  const winnerName = msg.winner_name;
  let title, body, countdown;
  if(manual){
    title = "🏁 Турнир завершён";
    body = "Администратор остановил турнир.<br>Победитель не определён.";
    countdown = 5;
  } else if(winnerId){
    if(winnerId === MY_ID){
      title = "🏆 ПОБЕДА!";
      body = `Вы победили!<br><b>${escapeHtml(winnerName || "")}</b>`;
    } else {
      title = "🏁 Турнир завершён";
      body = `🥇 Победитель: <b>${escapeHtml(winnerName || "—")}</b>`;
    }
    countdown = 15;
    fireConfetti();
  } else {
    title = "🏁 Турнир завершён";
    body = "Победитель не определён.";
    countdown = 5;
  }
  let remaining = countdown;
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body + `<div class="countdown-text" id="cd">Возврат в меню через ${remaining}…</div>`;
  els.modalBtns.innerHTML = `<button class="btn" id="mc">Закрыть сейчас</button>`;
  document.getElementById("mc").onclick = () => { clearExitTimer(); exitRoom(); };
  show(els.modal);

  const tick = setInterval(() => {
    remaining--;
    const cdel = document.getElementById("cd");
    if(cdel) cdel.textContent = `Возврат в меню через ${remaining}…`;
    if(remaining <= 0){ clearInterval(tick); exitRoom(); }
  }, 1000);
  clearExitTimer();
  EXIT_TIMER = setTimeout(()=>{ clearInterval(tick); exitRoom(); }, countdown * 1000 + 200);
}

// ================== 1×1 ROOM ==================
function renderWheel1v1(s){
  LAST_STATE = s;

  // Комната ещё не создана — ждём принятия обоих
  if(s.waiting){
    els.rmCounter.textContent = `⚔️ Ожидание игроков…`;
    els.roomContent.innerHTML = `<div class="waiting-box">
      <div class="waiting-ico">⚔️</div>
      <div class="waiting-txt">Ожидание принятия приглашения…</div>
      <div style="color:#94a3b8;font-size:13px;">Комната создастся, когда оба игрока примут вызов.</div>
    </div>`;
    return;
  }

  // Если идёт анимация — откладываем
  if(WHEEL_LOCK){ WHEEL_NEXT = s; return; }

  const players = s.players || [];
  const readyIds = new Set(s.ready || []);

  // Если это новый спин — запускаем анимацию
  if(s.spin_count > WHEEL_LAST_SPIN_SHOWN && s.last_spin){
    start1v1Animation(s);
    return;
  }

  // Обычная отрисовка комнаты
  drawWheel1v1UI(s, players, readyIds);
}

    <h3>👥 Участники</h3>
    <div class="p-list">`;
  players.forEach(p => {

  // Кнопка "Готов" — для участников 1×1, если ещё не готов

    } else {
      roomHtml += `<div class="ready-btn"><button id="ready-btn">🤝 ГОТОВ</button></div>`;
    }
    if(!p1Ready || !p2Ready){
      roomHtml += `<div class="waiting-info">Оба игрока должны нажать «Готов» — и колесо решит судьбу.</div>`;
    } else {

function start1v1Animation(s){
  WHEEL_LOCK = true;
  WHEEL_LAST_SPIN_SHOWN = s.spin_count;

  const players = s.players || [];
  // Рисуем колесо из 2 сегментов
  const canvas = document.createElement("canvas");
  canvas.id = "wheel";
  canvas.width = 640; canvas.height = 640;

  // Заменяем контент — колесо + участники
  let html = `
    <div class="wheel-stage">
      <div class="pointer"></div>
      <canvas id="wheel" width="640" height="640"></canvas>
    </div>
    <div class="participants">
      <h3>👥 Участники</h3>
      <div class="p-list">
  `;
  players.forEach(p => {
    html += `<div class="p-row"><span>${escapeHtml(p.name)}</span></div>`;
  });
  html += `</div></div>`;
  els.roomContent.innerHTML = html;

  const realCanvas = document.getElementById("wheel");
  const n = players.length;
  const winnerIdx = s.last_spin.winner_index;
  const duration = s.last_spin.duration || 8000;
  const serverStart = s.last_spin.started_at || nowServer();

  const FINAL_TURNS = 8;
  const target = -(winnerIdx + 0.5) / n * Math.PI * 2 + FINAL_TURNS * Math.PI * 2;
  const startAngle = target - Math.PI * 2 * 8;

  function setPhase(){
    const el = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, el / duration));
    const eased = 1 - Math.pow(1 - k, 4);
    WHEEL_ANGLE = startAngle + (target - startAngle) * eased;
    return k;
  }

  setPhase();
  draw1v1Wheel(realCanvas, players);

  function frame(){
    const k = setPhase();
    draw1v1Wheel(realCanvas, players);
    if(k < 1) requestAnimationFrame(frame);
    else {
      WHEEL_ANGLE = target;
      draw1v1Wheel(realCanvas, players);
      WHEEL_LOCK = false;
      // Победитель будет показан через tournament_ended
      if(PENDING_ENDED){ const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(()=>_showEndedModal(e), 600); }
    }
  }
  requestAnimationFrame(frame);
}

function draw1v1Wheel(canvas, players){
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, r = Math.min(W,H)/2 - 30;
  ctx.clearRect(0,0,W,H);

  // Halo
  const haloGrad = ctx.createRadialGradient(cx, cy, r*0.6, cx, cy, r+30);
  haloGrad.addColorStop(0, "rgba(219,39,119,0)");
  haloGrad.addColorStop(0.7, "rgba(219,39,119,0.15)");
  haloGrad.addColorStop(1, "rgba(219,39,119,0)");
  ctx.fillStyle = haloGrad;
  ctx.beginPath(); ctx.arc(cx, cy, r+30, 0, Math.PI*2); ctx.fill();

  const n = Math.max(players.length, 1);
  const palette = [
    {fill:["#ff1e56","#a41035"], glow:"#ff1e56"},
    {fill:["#00c9ff","#005b8f"], glow:"#00c9ff"},
  ];

  for(let i = 0; i < n; i++){
    const a0 = (i/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const a1 = ((i+1)/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const col = palette[i % palette.length];
    const grad = ctx.createRadialGradient(cx, cy, r*0.2, cx, cy, r);
    grad.addColorStop(0, col.fill[0]);
    grad.addColorStop(1, col.fill[1]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a0, a1);
    ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.save();
    ctx.strokeStyle = col.glow; ctx.lineWidth = 3;
    ctx.shadowColor = col.glow; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r*Math.cos(a0), cy + r*Math.sin(a0));
    ctx.stroke();
    ctx.restore();

    const mid = (a0 + a1) / 2;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(mid);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px 'Segoe UI',sans-serif";
    const label = players[i] ? players[i].name : "";
    const txt = label.length > 18 ? label.slice(0,18)+"…" : label;
    ctx.fillText(txt, r - 18, 0);
    ctx.restore();
  }

  // Обод
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = "#a78bfa"; ctx.lineWidth = 6;
  ctx.shadowColor = "#a78bfa"; ctx.shadowBlur = 25;
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r-4, 0, Math.PI*2);
  ctx.strokeStyle = "#db2777"; ctx.lineWidth = 2;
  ctx.shadowColor = "#db2777"; ctx.shadowBlur = 15;
  ctx.stroke();
  ctx.restore();

  // Хаб
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI*2);
  const hubGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 58);
  hubGrad.addColorStop(0, "#1e293b"); hubGrad.addColorStop(1, "#0a0e1a");
  ctx.fillStyle = hubGrad; ctx.shadowColor = "#7c3aed"; ctx.shadowBlur = 30;
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI*2);
  ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 4;
  ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 20;
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "36px sans-serif";
  ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 20;
  ctx.fillText("⚔️", cx, cy);
  ctx.restore();
}

    div.className = "player" + (p.is_turn?" turn":"") + (p.folded?" folded":"");
    div.style.left = x+"%"; div.style.top = y+"%";
    const cardsHTML = (p.cards||[]).map(c => {
      if(c==="?") return `<div class="mini back">?</div>`;
      const red = c.includes("♥")||c.includes("♦");
      return `<div class="mini ${red?"red":""}">${c}</div>`;
    }).join("");
    div.innerHTML = `<div class="name">${escapeHtml(p.name)}</div><div class="chips">💰 ${p.chips}</div>${p.bet?`<div class="bet">${p.bet}</div>`:""}<div class="cards">${cardsHTML}</div>`;
    ring.appendChild(div);
  });
  document.getElementById("logbox").textContent = (s.log||[]).join("\n");
  const me = (s.players||[]).find(p => p.user_id === MY_ID);
  const myTurn = me && s.turn_idx>=0 && s.players[s.turn_idx] && s.players[s.turn_idx].user_id===MY_ID && !me.folded && !me.all_in;
  [...document.querySelectorAll("#acts button")].forEach(b => b.disabled = !myTurn);
  const toCall = me ? Math.max(0, s.current_bet - me.bet) : 0;
  const cb = document.querySelector('[data-act="check"]');
  const cl = document.querySelector('[data-act="call"]');
  if(cb) cb.classList.toggle("hidden", toCall>0);
  if(cl) cl.classList.toggle("hidden", toCall===0);
  if(toCall>0 && me && cl) cl.textContent = `Колл ${Math.min(toCall, me.chips)}`;
  else if(cl) cl.textContent = "Колл";
  const rrow = document.getElementById("rrow");
  if(myTurn && me && rrow){
    const rslider = document.getElementById("rslider");
    const minR = s.min_raise||s.big_blind, maxR = me.chips;
    rslider.min = minR; rslider.max = Math.max(minR,maxR);
    rslider.value = minR; document.getElementById("ramount").textContent = minR;
    rrow.classList.remove("hidden");
    rslider.oninput = () => document.getElementById("ramount").textContent = rslider.value;
  }
  const tfill = document.getElementById("tfill");
  if(s.turn_deadline && myTurn && tfill){
    const total2 = s.turn_time||20;
    const rem = Math.max(0, s.turn_deadline - Date.now()/1000);
    tfill.style.width = Math.min(100,(rem/total2)*100)+"%";
  }
}
function makeCard(c){
  const div = document.createElement("div");
  const red = c.includes("♥")||c.includes("♦");
  div.className = "card" + (red?" red":"");
  if(c==="?") div.classList.add("back");
  div.textContent = c;
  return div;
}

// ================== WHEEL (обычное) ==================
function renderWheel(s){
  LAST_STATE = s;
  if(WHEEL_LOCK){ WHEEL_NEXT = s; return; }
  if(!WHEEL_INITIAL_DONE){
    WHEEL_INITIAL_DONE = true;
    WHEEL_LAST_SPIN_SHOWN = s.spin_count;
    drawWheelUI(s);
    return;
  }
  if(s.spin_count > WHEEL_LAST_SPIN_SHOWN && s.last_spin){
    startSpinAnimation(s);
    return;
  }
  drawWheelUI(s);
}

function updateWheelDOMOnly(s){
  els.rmCounter.textContent = `🎡 На колесе: ${(s.active||[]).length} игроков`;
  const plist = document.querySelector(".p-list");
  const h3 = document.querySelector(".participants h3");
  if(!plist) return;
  const activeArr = s.active || [];
  const eliminatedArr = s.eliminated || [];
  if(h3) h3.textContent = `👥 Участники (${activeArr.length + eliminatedArr.length})`;
  let html = "";
  activeArr.forEach(p => {
    html += `<div class="p-row"><span>🟢 ${escapeHtml(p.name)}</span><span>в игре</span></div>`;
  });
  eliminatedArr.slice().sort((a,b)=>b.place-a.place).forEach(p => {
    const cls = p.place === 1 ? "p-row win" : "p-row elim";
    html += `<div class="${cls}"><span>${p.place===1?"🏆":"❌"} ${escapeHtml(p.name)}</span><span>место ${p.place}</span></div>`;
  });
  plist.innerHTML = html;
}

function drawWheelUI(s){
  const activeArr = s.active || [];
  const eliminatedArr = s.eliminated || [];
  els.rmCounter.textContent = `🎡 На колесе: ${activeArr.length} игроков`;
  const canSpin = IS_ADMIN && !s.finished && activeArr.length >= 2;
  let btnHTML = "";
  if(IS_ADMIN){
    btnHTML = `<button id="spin-btn" ${canSpin && !WHEEL_LOCK && !AUTO_SPIN ? "" : "disabled"}>${AUTO_SPIN ? "🔄 КРУТИТСЯ..." : "🎡 КРУТИТЬ"}</button>`;
  } else {
    btnHTML = `<button id="spin-btn" disabled>🎡 Крутит администратор</button>`;
  }
  let html = `
    <div class="wheel-stage">
      <div class="pointer"></div>
      <canvas id="wheel" width="640" height="640"></canvas>
    </div>
    <div class="spin-big">${btnHTML}</div>
    <div class="participants">
      <h3>👥 Участники (${activeArr.length + eliminatedArr.length})</h3>
      <div class="p-list">
  `;
  activeArr.forEach(p => {
    html += `<div class="p-row"><span>🟢 ${escapeHtml(p.name)}</span><span>в игре</span></div>`;
  });
  eliminatedArr.slice().sort((a,b)=>b.place-a.place).forEach(p => {
    const cls = p.place === 1 ? "p-row win" : "p-row elim";
    html += `<div class="${cls}"><span>${p.place===1?"🏆":"❌"} ${escapeHtml(p.name)}</span><span>место ${p.place}</span></div>`;
  });
  html += `</div></div>`;
  els.roomContent.innerHTML = html;
  const canvas = document.getElementById("wheel");
  const spinBtn = document.getElementById("spin-btn");
  drawWheel(canvas, activeArr);
  if(spinBtn) spinBtn.addEventListener("click", () => {
    if(!IS_ADMIN){ showModal("⛔ Нет доступа","Крутить может только администратор",[]); return; }
    if(WHEEL_LOCK) return;
    if(!AUTO_SPIN){ AUTO_SPIN = true; wsSend({type:"spin"}); }
  });
}

const NEON_PALETTE = [
  {fill:["#ff1e56","#a41035"], glow:"#ff1e56"},
  {fill:["#00c9ff","#005b8f"], glow:"#00c9ff"},
  {fill:["#b026ff","#5a0f8a"], glow:"#b026ff"},
  {fill:["#ffb600","#a06a00"], glow:"#ffb600"},
  {fill:["#00ff9d","#007a4a"], glow:"#00ff9d"},
  {fill:["#ff6b00","#a13800"], glow:"#ff6b00"},
  {fill:["#ff00e5","#8c0077"], glow:"#ff00e5"},
  {fill:["#7cff00","#3d8a00"], glow:"#7cff00"},
  {fill:["#00e5ff","#006b8f"], glow:"#00e5ff"},
  {fill:["#f959ff","#8a1e99"], glow:"#f959ff"},
  {fill:["#ffd400","#8a6f00"], glow:"#ffd400"},
  {fill:["#5cff9d","#1e8a52"], glow:"#5cff9d"},
];

function drawWheel(canvas, active){
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, r = Math.min(W,H)/2 - 30;
  ctx.clearRect(0,0,W,H);

  const haloGrad = ctx.createRadialGradient(cx, cy, r*0.6, cx, cy, r+30);
  haloGrad.addColorStop(0, "rgba(219,39,119,0)");
  haloGrad.addColorStop(0.7, "rgba(219,39,119,0.15)");
  haloGrad.addColorStop(1, "rgba(219,39,119,0)");
  ctx.fillStyle = haloGrad;
  ctx.beginPath(); ctx.arc(cx, cy, r+30, 0, Math.PI*2); ctx.fill();

  const n = Math.max(active.length, 1);

  if(active.length === 0){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    const emptyGrad = ctx.createRadialGradient(cx,cy,r*0.3,cx,cy,r);
    emptyGrad.addColorStop(0,"#1e293b"); emptyGrad.addColorStop(1,"#0a0e1a");
    ctx.fillStyle = emptyGrad; ctx.fill();
    ctx.strokeStyle = "rgba(124,58,237,.6)"; ctx.lineWidth = 3;
    ctx.shadowColor = "#7c3aed"; ctx.shadowBlur = 30;
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#64748b"; ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Ожидание", cx, cy);
    drawHub(ctx, cx, cy);
    return;
  }

  for(let i = 0; i < n; i++){
    const a0 = (i/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const a1 = ((i+1)/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const col = NEON_PALETTE[i % NEON_PALETTE.length];
    const grad = ctx.createRadialGradient(cx, cy, r*0.2, cx, cy, r);
    grad.addColorStop(0, col.fill[0]);
    grad.addColorStop(1, col.fill[1]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a0, a1);
    ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.save();
    ctx.strokeStyle = col.glow; ctx.lineWidth = 3;
    ctx.shadowColor = col.glow; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r*Math.cos(a0), cy + r*Math.sin(a0));
    ctx.stroke();
    ctx.restore();

    const mid = (a0 + a1) / 2;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(mid);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 20px 'Segoe UI',sans-serif";
    const label = active[i].name || "";
    const txt = label.length > 14 ? label.slice(0,14)+"…" : label;
    ctx.fillText(txt, r - 18, 0);
    ctx.restore();
  }

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = "#a78bfa"; ctx.lineWidth = 6;
  ctx.shadowColor = "#a78bfa"; ctx.shadowBlur = 25;
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r-4, 0, Math.PI*2);
  ctx.strokeStyle = "#db2777"; ctx.lineWidth = 2;
  ctx.shadowColor = "#db2777"; ctx.shadowBlur = 15;
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, 78, 0, Math.PI*2);
  ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 3;
  ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 20;
  ctx.stroke();
  ctx.restore();

  drawHub(ctx, cx, cy);
}

function drawHub(ctx, cx, cy){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI*2);
  const hubGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 58);
  hubGrad.addColorStop(0, "#1e293b"); hubGrad.addColorStop(1, "#0a0e1a");
  ctx.fillStyle = hubGrad;
  ctx.shadowColor = "#7c3aed"; ctx.shadowBlur = 30;
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI*2);
  ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 4;
  ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 20;
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "36px sans-serif";
  ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 20;
  ctx.fillText("🎡", cx, cy);
  ctx.restore();
}

function startSpinAnimation(s){
  WHEEL_LOCK = true;
  WHEEL_LAST_SPIN_SHOWN = s.spin_count;
  let activeWithElim;
  if(s.last_spin.before_active){
    activeWithElim = s.last_spin.before_active.map(p => ({...p}));
  } else {
    activeWithElim = s.active.slice();
    activeWithElim.splice(s.last_spin.sector_index, 0, s.last_spin.eliminated);
  }
  const canvas = document.getElementById("wheel");
  if(!canvas){ WHEEL_LOCK = false; return; }
  const n = activeWithElim.length;
  const idx = s.last_spin.sector_index;
  const FINAL_TURNS = 8;
  const target = -(idx + 0.5) / n * Math.PI * 2 + FINAL_TURNS * Math.PI * 2;
  const startAngle = target - Math.PI * 2 * 8;
  const duration = s.last_spin.duration || 8000;
  const serverStart = s.last_spin.started_at || nowServer();

  function setPhase(force){
    const el = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, el / duration));
    const eased = 1 - Math.pow(1 - k, 4);
    WHEEL_ANGLE = startAngle + (target - startAngle) * eased;
    if(force){
      const c = document.getElementById("wheel");
      if(c) drawWheel(c, activeWithElim);
    }
    return k;
  }

  let k = setPhase(true);
  if(k >= 1){
    WHEEL_ANGLE = target;
    const c = document.getElementById("wheel");
    if(c) drawWheel(c, activeWithElim);
    setTimeout(() => {
      hide(els.modal); WHEEL_LOCK = false;
      const finalState = WHEEL_NEXT || s;
      WHEEL_NEXT = null;
      updateWheelDOMOnly(finalState);
      if(PENDING_ENDED){ const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(() => _showEndedModal(e), 500); return; }
      if(finalState.finished){ stopAutoSpin(); return; }
      if(AUTO_SPIN && (finalState.active||[]).length >= 2 && ACTIVE_TID && WS && WS.readyState === 1){
        AUTO_TIMER = setTimeout(() => { if(AUTO_SPIN && WS.readyState === 1) wsSend({type:"spin"}); }, 7000);
      } else stopAutoSpin();
    }, 100);
    return;
  }

  function frame(){
    const kk = setPhase(false);
    const c = document.getElementById("wheel");
    if(c) drawWheel(c, activeWithElim);
    if(kk < 1){ requestAnimationFrame(frame); }
    else {
      WHEEL_ANGLE = target;
      const c2 = document.getElementById("wheel");
      if(c2) drawWheel(c2, activeWithElim);
      showModal("❌ Выбывает", `<b>${escapeHtml(s.last_spin.eliminated.name)}</b><br>покидает турнир!`, []);
      setTimeout(() => {
        hide(els.modal); WHEEL_LOCK = false;
        const finalState = WHEEL_NEXT || s;
        WHEEL_NEXT = null;
        updateWheelDOMOnly(finalState);
        if(PENDING_ENDED){ const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(() => _showEndedModal(e), 500); return; }
        if(finalState.finished){ stopAutoSpin(); return; }
        if(AUTO_SPIN && (finalState.active||[]).length >= 2 && ACTIVE_TID && WS && WS.readyState === 1){
          AUTO_TIMER = setTimeout(() => { if(AUTO_SPIN && WS.readyState === 1) wsSend({type:"spin"}); }, 7000);
        } else stopAutoSpin();
      }, 2500);
    }
  }
  requestAnimationFrame(frame);
}

document.addEventListener("click", e => {
  const btn = e.target.closest("#acts button");
  if(!btn || btn.disabled) return;
  const act = btn.dataset.act;
  let amount = 0;
  if(act==="raise"){ const sl = document.getElementById("rslider"); amount = sl?parseInt(sl.value,10)||0:0; }
  wsSend({type:"poker_action", action:act, amount});
});

els.adKick.addEventListener("click", () => {

  if(!players.length){ showModal("Нет игроков","Нечего удалять",[]); return; }

    `<button data-uid="${p.user_id}">🚫 ${escapeHtml(p.name)}</button>`).join("") + `</div>`;

  document.querySelectorAll("#modal-body button[data-uid]").forEach(b => {

      const uid = parseInt(b.dataset.uid,10);

        wsSend({type:"admin_kick_player", user_id: uid});
      });

});

function showModal(title, body, buttons){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body;
  if(!buttons || !buttons.length){
    els.modalBtns.innerHTML = '<button class="btn" id="mc">Закрыть</button>';
    document.getElementById("mc").onclick = () => hide(els.modal);
  } else {
    els.modalBtns.innerHTML = "";
    buttons.forEach(b => {
      const btn = document.createElement("button");
      btn.className = "btn"; btn.style.background = b.color||"#334155"; btn.textContent = b.text;
      btn.onclick = b.onClick; els.modalBtns.appendChild(btn);
    });
  }
  show(els.modal);
}
function showConfirm(title, body, onYes){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body;
  els.modalBtns.innerHTML = `
    <button class="btn" style="background:#b91c1c;" id="cy">Да</button>
    <button class="btn" style="background:#334155;" id="cn">Отмена</button>`;
  document.getElementById("cy").onclick = () => { hide(els.modal); onYes(); };
  document.getElementById("cn").onclick = () => hide(els.modal);
  show(els.modal);
}

function fireConfetti(){
  const canvas = els.confetti;
  show(canvas);
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  const pieces = Array.from({length:160},()=>({
    x:Math.random()*canvas.width, y:-20-Math.random()*200,
    vy:2+Math.random()*3, vx:-1+Math.random()*2,
    r:4+Math.random()*5, color:`hsl(${Math.random()*360},90%,60%)`,
    rot:Math.random()*Math.PI, vr:-0.1+Math.random()*0.2,
  }));
  let f = 0;
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r,-p.r,p.r*2,p.r*0.6); ctx.restore();
    });
    f++; if(f<400) requestAnimationFrame(loop); else hide(canvas);
  }
  loop();
}
