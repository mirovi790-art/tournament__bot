<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Турнир · Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0e1a;color:#f1f5f9;min-height:100vh;user-select:none;overflow-x:hidden;}
#app{display:flex;flex-direction:column;min-height:100vh;}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(135deg,#1e40af,#7c3aed);border-bottom:2px solid #a78bfa;position:sticky;top:0;z-index:20;gap:6px;flex-wrap:wrap;}
#title{font-weight:800;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.status{font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;}
.status.ok{background:#16a34a;}
.status.err{background:#dc2626;}
.btn-leave{background:#b91c1c;color:#fff;border:none;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;}
.btn-admin{background:#ea580c;color:#fff;border:none;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;margin-right:3px;}
.view{flex:1;display:flex;flex-direction:column;}
.hidden{display:none!important;}
.tabs{display:flex;background:#1e293b;border-bottom:2px solid #334155;}
.tab{flex:1;padding:14px;text-align:center;font-weight:800;font-size:14px;color:#94a3b8;cursor:pointer;transition:.2s;}
.tab.active{color:#fbbf24;border-bottom:3px solid #fbbf24;background:#0f172a;}
.room-tabs{display:flex;background:#0f172a;border-bottom:1px solid #334155;}
.room-tab{flex:1;padding:12px;text-align:center;font-weight:700;font-size:13px;color:#94a3b8;cursor:pointer;}
.room-tab.active{color:#fbbf24;border-bottom:2px solid #fbbf24;background:#1e293b;}
.pf-wrap{padding:16px;}
.pf-card{background:linear-gradient(135deg,#1e40af,#7c3aed);border-radius:18px;padding:22px;text-align:center;box-shadow:0 6px 24px rgba(124,58,237,.4);}
.pf-card .av{font-size:64px;margin-bottom:6px;}
.pf-card .nm{font-size:20px;font-weight:800;}
.pf-card .un{font-size:13px;opacity:.85;margin-bottom:8px;}
.pf-card .rl{display:inline-block;background:rgba(0,0,0,.35);padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;}
.pf-stat{margin-top:12px;background:#1e293b;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;}
.pf-stat .v{font-size:26px;font-weight:900;color:#fbbf24;}
.tr-list{padding:14px;display:flex;flex-direction:column;gap:12px;}
.tr-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid #334155;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;}
.tr-card .hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.tr-card .name{font-size:16px;font-weight:800;color:#fef3c7;}
.tr-card .emoji{font-size:28px;}
.tr-card .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#cbd5e1;}
.tr-card .meta b{color:#fbbf24;}
.tr-card .btn-start{padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-weight:900;font-size:15px;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 12px rgba(34,197,94,.4);}
.tr-card .btn-start:disabled{background:#475569;box-shadow:none;}
.empty{padding:40px 20px;text-align:center;color:#94a3b8;}
.room-head{padding:16px 14px 8px;text-align:center;}
.room-title{font-family:Georgia,serif;font-size:26px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#fbbf24,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px;text-shadow:0 0 30px rgba(251,191,36,.5);}
.room-prize{display:inline-block;padding:10px 24px;border:3px solid #fbbf24;border-radius:14px;background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.05));color:#fbbf24;font-weight:900;font-size:15px;box-shadow:0 0 20px rgba(251,191,36,.4),inset 0 0 20px rgba(251,191,36,.1);}
.counter-badge{display:inline-block;padding:6px 14px;background:#334155;border-radius:999px;font-size:13px;margin-top:8px;color:#cbd5e1;font-weight:700;}
.wheel-stage{position:relative;display:flex;justify-content:center;align-items:center;padding:32px 14px 14px;perspective:1000px;}
.wheel-stage::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(219,39,119,.25) 0%,transparent 60%),radial-gradient(circle at 50% 45%,rgba(124,58,237,.2) 0%,transparent 70%);pointer-events:none;animation:wheelPulse 3s ease-in-out infinite;}
@keyframes wheelPulse{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.03);}}
#wheel{position:relative;z-index:2;width:90vw;max-width:480px;filter:drop-shadow(0 0 30px rgba(219,39,119,.6)) drop-shadow(0 0 60px rgba(124,58,237,.4));animation:wheelGlow 4s ease-in-out infinite;}
@keyframes wheelGlow{0%,100%{filter:drop-shadow(0 0 30px rgba(219,39,119,.6)) drop-shadow(0 0 60px rgba(124,58,237,.4));}50%{filter:drop-shadow(0 0 40px rgba(219,39,119,.9)) drop-shadow(0 0 80px rgba(124,58,237,.7));}}
.pointer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:0;z-index:5;filter:drop-shadow(0 0 12px #fbbf24) drop-shadow(0 0 24px rgba(251,191,36,.7));animation:pointerBob 1.2s ease-in-out infinite;}
.pointer::before{content:'';display:block;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:36px solid #fbbf24;filter:drop-shadow(0 3px 8px rgba(0,0,0,.9));}
.pointer::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fbbf24 60%,#f59e0b 100%);box-shadow:0 0 14px #fbbf24,0 0 28px #f59e0b;}
@keyframes pointerBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(3px);}}
.spin-big{display:flex;justify-content:center;padding:8px 16px 16px;}
.spin-big button{position:relative;padding:18px 44px;border-radius:999px;border:2px solid rgba(255,255,255,.3);background:linear-gradient(135deg,#db2777,#a855f7,#f59e0b);background-size:200% 200%;color:#fff;font-weight:900;font-size:18px;letter-spacing:2px;cursor:pointer;box-shadow:0 0 24px rgba(219,39,119,.7),0 0 48px rgba(168,85,247,.5),0 8px 24px rgba(0,0,0,.5);animation:spinBtnShift 3s ease infinite;transition:transform .15s,box-shadow .3s;}
.spin-big button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 32px rgba(219,39,119,.9),0 0 64px rgba(168,85,247,.7),0 12px 28px rgba(0,0,0,.6);}
.spin-big button:active:not(:disabled){transform:translateY(0) scale(.97);}
.spin-big button:disabled{background:#334155;border-color:#475569;box-shadow:none;animation:none;color:#94a3b8;}
@keyframes spinBtnShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.participants{margin:0 14px 20px;background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:14px;padding:14px;border:1px solid rgba(124,58,237,.4);box-shadow:0 0 20px rgba(124,58,237,.2),inset 0 0 20px rgba(124,58,237,.05);}
.participants h3{margin:0 0 10px;font-size:14px;font-weight:800;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px;}
.p-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.p-list::-webkit-scrollbar{width:6px;}
.p-list::-webkit-scrollbar-track{background:#0f172a;border-radius:3px;}
.p-list::-webkit-scrollbar-thumb{background:linear-gradient(135deg,#7c3aed,#db2777);border-radius:3px;}
.p-row{display:flex;justify-content:space-between;padding:10px 14px;background:rgba(15,23,42,.7);border-radius:8px;font-size:13px;border-left:3px solid #22c55e;transition:all .2s;}
.p-row.elim{color:#fca5a5;opacity:.6;border-left-color:#dc2626;text-decoration:line-through;}
.p-row.win{color:#fef3c7;font-weight:800;border-left-color:#fbbf24;background:linear-gradient(90deg,rgba(251,191,36,.2),rgba(15,23,42,.7));box-shadow:0 0 12px rgba(251,191,36,.4);}
.p-row.ready{border-left-color:#22c55e;background:linear-gradient(90deg,rgba(34,197,94,.15),rgba(15,23,42,.7));}
.p-row .ready-mark{color:#22c55e;font-weight:900;margin-left:6px;text-shadow:0 0 6px rgba(34,197,94,.6);}
.duel-wrap{padding:14px;display:flex;flex-direction:column;gap:14px;}
.duel-vs{display:flex;align-items:center;justify-content:space-around;background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid rgba(168,85,247,.5);border-radius:20px;padding:20px 14px;box-shadow:0 0 30px rgba(168,85,247,.3),inset 0 0 20px rgba(168,85,247,.1);}
.duel-side{flex:1;text-align:center;padding:8px;}
.duel-side .ava{font-size:44px;margin-bottom:6px;filter:drop-shadow(0 0 12px rgba(255,255,255,.3));}
.duel-side .nm{font-weight:800;font-size:15px;color:#fef3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;}
.duel-side .score-big{font-size:26px;font-weight:900;color:#fbbf24;text-shadow:0 0 16px rgba(251,191,36,.6);margin:2px 0 4px;}
.duel-side .status-tag{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;}
.duel-side .status-tag.notready{background:#7f1d1d;color:#fecaca;}
.duel-side .status-tag.ready{background:#065f46;color:#d1fae5;box-shadow:0 0 12px rgba(34,197,94,.6);}
.duel-vs-mid{font-size:28px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 10px;text-shadow:0 0 30px rgba(251,191,36,.5);animation:vsPulse 2s infinite;}
@keyframes vsPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.ready-btn{display:flex;justify-content:center;padding:4px 16px 16px;}
.ready-btn button{padding:16px 38px;border-radius:999px;border:2px solid rgba(255,255,255,.3);background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-weight:900;font-size:16px;letter-spacing:1.5px;cursor:pointer;box-shadow:0 0 24px rgba(34,197,94,.6),0 8px 24px rgba(0,0,0,.5);transition:transform .15s,box-shadow .3s;}
.ready-btn button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 32px rgba(34,197,94,.9);}
.ready-btn button:disabled{background:#334155;box-shadow:none;color:#94a3b8;}
.ready-btn button.pressed{background:linear-gradient(135deg,#065f46,#065f46);cursor:default;}
.waiting-info{text-align:center;color:#94a3b8;font-size:14px;padding:10px;}
.table-wrap{padding:8px;display:flex;justify-content:center;align-items:center;}
.table-felt{position:relative;width:100%;max-width:520px;aspect-ratio:4/5;border-radius:50%/40%;background:radial-gradient(ellipse at center,#16a34a 0%,#065f46 100%);border:10px solid #b45309;box-shadow:inset 0 0 80px rgba(0,0,0,.3),0 0 40px rgba(251,191,36,.3);display:flex;align-items:center;justify-content:center;}
.pot{position:absolute;top:6%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#facc15,#f59e0b);padding:8px 20px;border-radius:999px;font-weight:900;color:#422006;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.5);}
.community{display:flex;gap:6px;justify-content:center;align-items:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.card{width:46px;height:64px;background:#fff;color:#111;border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px;font-weight:800;font-size:16px;box-shadow:0 4px 8px rgba(0,0,0,.5);animation:dealCard .35s ease-out;}
.card.red{color:#dc2626;}
.card.back{background:repeating-linear-gradient(45deg,#2563eb,#2563eb 8px,#7c3aed 8px,#7c3aed 16px);color:transparent;}
@keyframes dealCard{from{transform:translateY(-60px) rotate(-25deg);opacity:0;}to{transform:translateY(0) rotate(0);opacity:1;}}
#players-ring{position:absolute;inset:0;}
.player{position:absolute;width:92px;transform:translate(-50%,-50%);background:linear-gradient(135deg,#1e293b,#334155);border:3px solid #475569;border-radius:14px;padding:8px 5px 5px;text-align:center;font-size:12px;transition:all .25s;}
.player.turn{border-color:#facc15;box-shadow:0 0 24px #facc15,0 0 12px #f59e0b;}
.player.folded{opacity:.35;filter:grayscale(1);}
.player .name{font-weight:800;font-size:12px;color:#fef3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player .chips{color:#fbbf24;font-weight:800;font-size:13px;text-shadow:0 0 6px rgba(251,191,36,.5);}
.player .bet{color:#22d3ee;font-size:11px;font-weight:700;}
.player .cards{display:flex;gap:2px;justify-content:center;margin-top:3px;}
.player .cards .mini{width:18px;height:26px;border-radius:3px;background:#fff;color:#111;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.player .cards .mini.red{color:#dc2626;}
.player .cards .mini.back{background:#1e40af;color:transparent;}
.log-box{margin:6px 10px;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:10px;font-size:11px;color:#94a3b8;max-height:60px;overflow-y:auto;white-space:pre-line;}
.actions-frame{margin:8px 12px;padding:12px;border:3px solid #a78bfa;border-radius:18px;background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(30,64,175,.15));box-shadow:0 0 24px rgba(167,139,250,.3),inset 0 0 24px rgba(167,139,250,.05);}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.btn{border:none;border-radius:12px;padding:14px 10px;color:#fff;font-weight:800;font-size:14px;cursor:pointer;transition:transform .1s,opacity .15s;background:#334155;box-shadow:0 3px 8px rgba(0,0,0,.3);}
.btn:active{transform:scale(.95);}
.btn:disabled{opacity:.35;}
.btn-fold{background:linear-gradient(135deg,#991b1b,#dc2626);}
.btn-check{background:linear-gradient(135deg,#1e40af,#2563eb);}
.btn-call{background:linear-gradient(135deg,#065f46,#16a34a);}
.btn-raise{background:linear-gradient(135deg,#b45309,#f59e0b);}
.btn-allin{background:linear-gradient(135deg,#7c3aed,#a855f7);}
.raise-row{display:flex;align-items:center;gap:12px;padding:8px 14px 4px;}
.raise-row input{flex:1;}
#raise-amount{font-weight:800;color:#fbbf24;min-width:60px;text-align:right;}
.timer-bar{height:8px;background:#1e293b;overflow:hidden;border-radius:4px;margin:8px 14px;}
#timer-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transition:width .3s linear;}
.waiting-box{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 20px;gap:16px;text-align:center;}
.waiting-ico{font-size:80px;animation:pulse 1.6s infinite ease-in-out;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(1.08);}}
.waiting-txt{font-size:17px;color:#94a3b8;font-weight:700;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid #475569;border-radius:20px;padding:26px 22px;max-width:380px;width:100%;text-align:center;animation:pop .3s ease-out;max-height:90vh;overflow-y:auto;}
@keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
#modal-title{font-size:22px;font-weight:900;margin-bottom:14px;color:#fbbf24;}
#modal-body{font-size:14px;color:#e2e8f0;margin-bottom:16px;line-height:1.6;}
.modal-btns{display:flex;gap:8px;flex-wrap:wrap;}
.modal-btns .btn{flex:1;min-width:120px;}
.kick-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:50vh;overflow-y:auto;}
.kick-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:rgba(15,23,42,.85);border-radius:10px;border-left:3px solid #a78bfa;font-size:14px;}
.kick-row .kick-name{flex:1;text-align:left;font-weight:700;color:#fef3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kick-row .kick-x{flex-shrink:0;background:linear-gradient(135deg,#991b1b,#dc2626);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 0 12px rgba(220,38,38,.5);}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;}
.countdown-text{color:#fbbf24;font-size:14px;font-weight:800;margin-top:8px;}

/* ============ BRACKET ============ */
.bracket-wrap{padding:14px;display:flex;flex-direction:column;gap:16px;overflow-x:hidden;}
.bracket-columns{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
.bracket-col{display:flex;flex-direction:column;gap:12px;min-width:180px;}
.bracket-col-title{text-align:center;font-size:12px;font-weight:800;color:#fbbf24;background:#1e293b;padding:6px 10px;border-radius:8px;letter-spacing:1px;text-transform:uppercase;}
.bracket-match{background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid rgba(124,58,237,.5);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;transition:all .3s;}
.bracket-match.finished{border-color:#fbbf24;box-shadow:0 0 16px rgba(251,191,36,.4);}
.bracket-match.active{border-color:#22c55e;box-shadow:0 0 20px rgba(34,197,94,.5);}
.bracket-player{display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(15,23,42,.8);border-radius:8px;font-size:12px;}
.bracket-player .bp-name{flex:1;font-weight:700;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bracket-player.winner{background:linear-gradient(90deg,rgba(251,191,36,.25),rgba(15,23,42,.8));border:1px solid rgba(251,191,36,.5);}
.bracket-player.winner .bp-name{color:#fbbf24;font-weight:900;}
.bracket-player.loser .bp-name{color:#94a3b8;text-decoration:line-through;opacity:.6;}
.bracket-score{font-size:11px;color:#fbbf24;font-weight:900;margin-left:4px;background:rgba(251,191,36,.12);padding:1px 6px;border-radius:6px;}
.bracket-check{flex-shrink:0;width:26px;height:26px;border-radius:6px;border:2px solid #475569;background:#1e293b;color:#64748b;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;transition:all .2s;}
.bracket-check:disabled{cursor:default;opacity:.7;}
.bracket-check.checked{background:linear-gradient(135deg,#16a34a,#22c55e);border-color:#22c55e;color:#fff;box-shadow:0 0 12px rgba(34,197,94,.7);}
.bracket-check.opponent.checked{background:linear-gradient(135deg,#166534,#15803d);border-color:#15803d;color:#fff;}
.bracket-check.notmine{cursor:default;}
.bracket-enter-btn{margin-top:4px;padding:8px;border-radius:8px;border:none;background:linear-gradient(135deg,#db2777,#a855f7);color:#fff;font-weight:800;font-size:12px;cursor:pointer;letter-spacing:1px;}
.bracket-enter-btn:disabled{background:#334155;color:#64748b;cursor:not-allowed;box-shadow:none;}
.bracket-enter-btn.admin-view{background:linear-gradient(135deg,#0891b2,#06b6d4);}
.bracket-enter-btn.spectate{background:linear-gradient(135deg,#334155,#475569);}
.bracket-enter-btn.spectate:hover:not(:disabled){background:linear-gradient(135deg,#475569,#64748b);}
.bracket-vs{text-align:center;font-size:10px;color:#64748b;font-weight:800;letter-spacing:1px;margin:-2px 0;}
.bracket-round-tag{font-size:10px;color:#94a3b8;text-align:center;margin-bottom:2px;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="title">🏆 Турнир</div>
    <div id="admin-toolbar" class="hidden">
      <button id="ad-kick" class="btn-admin">🚫 Кик</button>
      <button id="ad-end" class="btn-admin">🏁 Закончить</button>
    </div>
    <button id="leave-btn" class="btn-leave hidden">🚪 Выйти</button>
    <div id="status" class="status">Подключение…</div>
  </header>

  <div id="tabs" class="tabs">
    <div class="tab active" data-tab="profile">👤 Профиль</div>
    <div class="tab" data-tab="tournaments">🏆 Турниры</div>
  </div>

  <div id="room-tabs" class="room-tabs hidden">
    <div class="room-tab active" data-rtab="bracket">🏆 Сетка турнира</div>
    <div class="room-tab" data-rtab="main">🎮 Комната</div>
  </div>

  <main id="profile-view" class="view">
    <div class="pf-wrap">
      <div class="pf-card">
        <div class="av">👤</div>
        <div class="nm" id="pf-name">—</div>
        <div class="un" id="pf-uname"></div>
        <div class="rl" id="pf-role">🎮 Игрок</div>
      </div>
      <div class="pf-stat"><span>🏆 Побед</span><span class="v" id="pf-wins">0</span></div>
    </div>
  </main>

  <main id="tournaments-view" class="view hidden">
    <div class="tr-list" id="tr-list"><div class="empty">Загрузка…</div></div>
  </main>

  <main id="room-view" class="view hidden">
    <div class="room-head">
      <div class="room-title" id="rm-title">—</div>
      <div class="room-prize" id="rm-prize">🏆 Приз</div>
      <div class="counter-badge" id="rm-counter">👥 Игроков: 0</div>
    </div>
    <div id="room-content"></div>
    <div id="bracket-content" class="hidden"></div>
  </main>

  <div id="modal" class="modal hidden"><div class="modal-card">
    <div id="modal-title"></div><div id="modal-body"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div></div>
  <canvas id="confetti" class="confetti hidden"></canvas>
</div>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand?.();
const INIT_DATA = tg?.initData || "";
const els = {
  title: document.getElementById("title"), status: document.getElementById("status"),
  tabs: document.getElementById("tabs"),
  roomTabs: document.getElementById("room-tabs"),
  profileView: document.getElementById("profile-view"),
  tournamentsView: document.getElementById("tournaments-view"),
  roomView: document.getElementById("room-view"),
  roomContent: document.getElementById("room-content"),
  bracketContent: document.getElementById("bracket-content"),
  trList: document.getElementById("tr-list"),
  pfName: document.getElementById("pf-name"), pfUname: document.getElementById("pf-uname"),
  pfRole: document.getElementById("pf-role"), pfWins: document.getElementById("pf-wins"),
  rmTitle: document.getElementById("rm-title"), rmPrize: document.getElementById("rm-prize"),
  rmCounter: document.getElementById("rm-counter"),
  leaveBtn: document.getElementById("leave-btn"),
  adminToolbar: document.getElementById("admin-toolbar"),
  adKick: document.getElementById("ad-kick"),
  adEnd: document.getElementById("ad-end"),
  modal: document.getElementById("modal"), modalTitle: document.getElementById("modal-title"),
  modalBody: document.getElementById("modal-body"), modalBtns: document.getElementById("modal-btns"),
  confetti: document.getElementById("confetti"),
};
let MY_ID = null, IS_ADMIN = false, WS = null, ACTIVE_TID = null;
let GAME_TYPE = null, LAST_STATE = null;
let IS_CREATOR = false, IS_PARTICIPANT = false, MY_STATUS = null, IS_EXCLUDED = false;
let WHEEL_ANGLE = 0;
let WHEEL_LOCK = false;
let WHEEL_NEXT = null;
let WHEEL_LAST_SPIN_SHOWN = 0;
let WHEEL_INITIAL_DONE = false;
let AUTO_SPIN = false, AUTO_TIMER = null, EXIT_TIMER = null;
let PENDING_ENDED = null;
let SERVER_OFFSET = 0;
let MY_READY = false;
let ACTIVE_ROOM_TAB = "bracket";
let BRACKET_ACTIVE_MATCH_ID = null;
let BRACKET_MY_MATCH_ID = null;
let BRACKET_MATCH_VIEW_STATE = {};
let BRACKET_MATCH_VIEW_TIMER = {};
let BRACKET_MATCH_VIEW_ANIM = {};
let BRACKET_MATCH_LAST_SPIN_SHOWN = {};

function show(el){el.classList.remove("hidden");}
function hide(el){el.classList.add("hidden");}
function setStatus(t,c){els.status.textContent=t; els.status.className="status "+(c||"");}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function stopAutoSpin(){ AUTO_SPIN = false; if(AUTO_TIMER){ clearTimeout(AUTO_TIMER); AUTO_TIMER = null; } }
function clearExitTimer(){ if(EXIT_TIMER){ clearTimeout(EXIT_TIMER); EXIT_TIMER = null; } }
function syncServerTime(s){ if(s && s.server_now){ SERVER_OFFSET = s.server_now - Date.now(); } }
function nowServer(){ return Date.now() + SERVER_OFFSET; }

document.querySelectorAll("#tabs .tab").forEach(t => {
  t.addEventListener("click", () => {
    if(ACTIVE_TID) return;
    document.querySelectorAll("#tabs .tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    hide(els.profileView); hide(els.tournamentsView);
    if(t.dataset.tab === "profile") show(els.profileView);
    else { show(els.tournamentsView); loadTournaments(); }
  });
});

document.querySelectorAll(".room-tab").forEach(t => {
  t.addEventListener("click", () => {
    ACTIVE_ROOM_TAB = t.dataset.rtab;
    document.querySelectorAll(".room-tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    if(ACTIVE_ROOM_TAB === "bracket"){
      hide(els.roomContent); show(els.bracketContent);
      if(LAST_STATE && LAST_STATE.type === "bracket_state") drawBracketUI(LAST_STATE);
    } else {
      hide(els.bracketContent); show(els.roomContent);
      if(LAST_STATE && LAST_STATE.type === "bracket_state"){
        if(BRACKET_ACTIVE_MATCH_ID) renderBracketRoom(LAST_STATE, BRACKET_ACTIVE_MATCH_ID);
        else drawBracketRoomsList(LAST_STATE);
      }
    }
  });
});

(async function boot(){
  if(!INIT_DATA){setStatus("Нет данных","err");return;}
  await loadProfile();
  setStatus("🟢 Онлайн","ok");
})();

async function loadProfile(){
  try{
    const r = await fetch(`/api/profile?initData=${encodeURIComponent(INIT_DATA)}`);
    if(!r.ok) throw new Error(await r.text());
    const p = await r.json();
    MY_ID = p.user_id;
    IS_ADMIN = p.is_admin;
    els.pfName.textContent = p.first_name || "Игрок";
    els.pfUname.textContent = p.username ? "@"+p.username : "";
    els.pfWins.textContent = p.wins || 0;
    els.pfRole.textContent = IS_ADMIN ? "🛠 Администратор" : "🎮 Игрок";
  }catch(e){ console.error(e); }
}

async function loadTournaments(){
  els.trList.innerHTML = '<div class="empty">Загрузка…</div>';
  try{
    const r = await fetch(`/api/profile?initData=${encodeURIComponent(INIT_DATA)}`);
    const p = await r.json();
    const tours = p.tournaments || [];
    if(!tours.length){
      els.trList.innerHTML = '<div class="empty">📭 Нет активных турниров</div>';
      return;
    }
    els.trList.innerHTML = "";
    tours.forEach(t => {
      const emoji = t.game_type === "poker" ? "🃏" : (t.game_type === "wheel_1v1" ? "⚔️" : (t.game_type === "bracket" ? "🏆" : "🎡"));
      let gameName = "Колесо Фортуны";
      if(t.game_type === "poker") gameName = "Покер";
      else if(t.game_type === "wheel_1v1") gameName = "Колесо 1×1";
      else if(t.game_type === "bracket") gameName = "Турнир с сеткой";
      let canStart = t.status === "running" || t.status === "paused";
      let btnLabel = canStart ? "🎮 НАЧАТЬ" : (t.status === "registration" ? "⏳ Ожидание старта" : "🏁 Завершён");
      let disabled = !canStart;
      if(t.game_type === "wheel_1v1"){
        if(t.my_status === "pending"){ btnLabel = "⏳ Ожидает подтверждения"; disabled = true; }
        else if(t.status === "registration"){ btnLabel = "⏳ Ждём второго игрока"; disabled = true; }
      }
      if(t.game_type === "bracket"){
        if(t.my_status === "pending"){ btnLabel = "⏳ Ожидает подтверждения"; disabled = true; }
        else if(t.status === "registration"){ btnLabel = "⏳ Ждём всех игроков"; disabled = true; }
        else if(t.my_status === "kicked" || t.my_status === "left"){ btnLabel = "👁 СМОТРЕТЬ"; disabled = false; canStart = true; }
      }
      const card = document.createElement("div");
      card.className = "tr-card";
      let badge = "";
      if(t.my_status === "admin") badge = '<span style="color:#f59e0b;font-weight:800;font-size:11px;">👑 АДМИН</span>';
      else if(t.my_status === "creator") badge = '<span style="color:#a78bfa;font-weight:800;font-size:11px;">🎨 СОЗДАТЕЛЬ</span>';
      else if(t.my_status === "pending") badge = '<span style="color:#fbbf24;font-weight:800;font-size:11px;">📩 ПРИГЛАШЕНИЕ</span>';
      else if(t.my_status === "kicked") badge = '<span style="color:#fca5a5;font-weight:800;font-size:11px;">🚫 ИСКЛЮЧЁН</span>';
      else if(t.my_status === "left") badge = '<span style="color:#fca5a5;font-weight:800;font-size:11px;">🚪 ВЫШЕЛ</span>';
      card.innerHTML = `
        <div class="hdr">
          <div class="name">${escapeHtml(t.name)}</div>
          <div class="emoji">${emoji}</div>
        </div>
        <div class="meta">
          <span>Игра: <b>${gameName}</b></span>
          <span>Статус: <b>${t.display_status || t.status}</b></span>
          ${badge}
        </div>
        ${t.prize ? `<div class="meta">🎁 Приз: <b>${escapeHtml(t.prize)}</b></div>` : ""}
        <button class="btn-start" ${disabled?"disabled":""}>${btnLabel}</button>
      `;
      card.querySelector(".btn-start").addEventListener("click", () => { if(canStart) openRoom(t.tid); });
      els.trList.appendChild(card);
    });
  }catch(e){ els.trList.innerHTML = '<div class="empty">Ошибка: '+escapeHtml(e.message)+'</div>'; }
}

async function openRoom(tid){
  try{
    const r = await fetch(`/api/tournament/${tid}?initData=${encodeURIComponent(INIT_DATA)}`);
    if(!r.ok){
      const e = await r.json().catch(()=>({detail:"Ошибка"}));
      showModal("⚠ Ошибка", e.detail || "Не удалось войти", []);
      return;
    }
    const info = await r.json();
    GAME_TYPE = info.game_type;
    ACTIVE_TID = tid;
    IS_ADMIN = info.is_admin;
    IS_PARTICIPANT = info.is_participant;
    IS_EXCLUDED = info.is_excluded;
    MY_STATUS = info.my_status;
    WHEEL_LOCK = false; WHEEL_NEXT = null; WHEEL_LAST_SPIN_SHOWN = 0;
    WHEEL_INITIAL_DONE = false; WHEEL_ANGLE = 0;
    PENDING_ENDED = null; MY_READY = false;
    BRACKET_ACTIVE_MATCH_ID = null; BRACKET_MY_MATCH_ID = null;
    BRACKET_MATCH_VIEW_STATE = {}; BRACKET_MATCH_VIEW_TIMER = {};
    BRACKET_MATCH_VIEW_ANIM = {}; BRACKET_MATCH_LAST_SPIN_SHOWN = {};
    ACTIVE_ROOM_TAB = (info.game_type === "bracket") ? "bracket" : "main";
    hide(els.tabs); hide(els.profileView); hide(els.tournamentsView);
    show(els.roomView);
    els.title.textContent = `🏆 ${info.name}`;
    els.rmTitle.textContent = info.name;
    els.rmPrize.textContent = "🏆 " + (info.prize || "Приз");
    show(els.leaveBtn);
    if(IS_ADMIN) show(els.adminToolbar);
    else hide(els.adminToolbar);
    if(GAME_TYPE === "bracket"){
      show(els.roomTabs);
      document.querySelectorAll(".room-tab").forEach(x => x.classList.remove("active"));
      document.querySelector('.room-tab[data-rtab="bracket"]').classList.add("active");
      hide(els.roomContent); show(els.bracketContent);
    } else {
      hide(els.roomTabs);
      show(els.roomContent); hide(els.bracketContent);
    }
    connectWS(tid);
  }catch(e){ showModal("⚠ Ошибка", e.message, []); }
}

function exitRoom(){
  stopAutoSpin(); clearExitTimer();
  for(const mid in BRACKET_MATCH_VIEW_TIMER){ try{ clearTimeout(BRACKET_MATCH_VIEW_TIMER[mid]); }catch(e){} }
  for(const mid in BRACKET_MATCH_VIEW_ANIM){ try{ cancelAnimationFrame(BRACKET_MATCH_VIEW_ANIM[mid]); }catch(e){} }
  BRACKET_MATCH_VIEW_TIMER = {}; BRACKET_MATCH_VIEW_ANIM = {}; BRACKET_MATCH_VIEW_STATE = {};
  BRACKET_MATCH_LAST_SPIN_SHOWN = {};
  PENDING_ENDED = null; WHEEL_NEXT = null; WHEEL_LOCK = false;
  MY_READY = false; BRACKET_ACTIVE_MATCH_ID = null; BRACKET_MY_MATCH_ID = null;
  ACTIVE_ROOM_TAB = "bracket";
  if(WS) try{WS.close();}catch(e){}
  WS = null; ACTIVE_TID = null; GAME_TYPE = null; LAST_STATE = null;
  hide(els.roomView); hide(els.leaveBtn); hide(els.adminToolbar); hide(els.roomTabs);
  hide(els.modal); hide(els.confetti);
  show(els.tabs);
  document.querySelectorAll("#tabs .tab").forEach(x => x.classList.remove("active"));
  document.querySelector('#tabs .tab[data-tab="tournaments"]').classList.add("active");
  show(els.tournamentsView);
  loadTournaments();
  loadProfile();
}

function connectWS(tid){
  if(WS) try{WS.close();}catch(e){}
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = `${proto}://${location.host}/ws/${tid}?initData=${encodeURIComponent(INIT_DATA)}`;
  WS = new WebSocket(url);
  WS.onopen = () => setStatus("🟢 Онлайн","ok");
  WS.onclose = () => {
    if(!ACTIVE_TID) return;
    setStatus("🔴 Оффлайн","err"); setTimeout(()=>{ if(ACTIVE_TID) connectWS(ACTIVE_TID); },2000);
  };
  WS.onerror = () => setStatus("⚠ Ошибка","err");
  WS.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if(msg.type === "poker_state"){ syncServerTime(msg); renderPoker(msg); }
    else if(msg.type === "wheel_state"){ syncServerTime(msg); renderWheel(msg); }
    else if(msg.type === "wheel_1v1_state"){ syncServerTime(msg); renderWheel1v1(msg); }
    else if(msg.type === "bracket_state"){ syncServerTime(msg); renderBracket(msg); }
    else if(msg.type === "wheel_1v1_ready"){ }
    else if(msg.type === "not_ready"){ showModal("⏳ Не готово","Оба игрока должны нажать «Готов».",[]); }
    else if(msg.type === "spin_denied"){ showModal("⛔ Нет доступа","Крутить может только администратор.",[]); }
    else if(msg.type === "left_tournament"){
      stopAutoSpin(); showModal("🚪 Вы вышли","Возврат в меню...",[]);
      clearExitTimer(); EXIT_TIMER = setTimeout(()=>exitRoom(), 3000);
    }
    else if(msg.type === "player_kicked" && msg.user_id === MY_ID){
      stopAutoSpin(); showModal("🚫 Исключение","Администратор удалил вас.",[]);
      if(GAME_TYPE !== "bracket"){
        clearExitTimer(); EXIT_TIMER = setTimeout(()=>exitRoom(), 5000);
      }
    }
    else if(msg.type === "tournament_ended"){ handleTournamentEnded(msg); }
    else if(msg.type === "tournament_cancelled"){
      stopAutoSpin();
      showModal("🛑 Отменён","Турнир отменён.",[]);
      clearExitTimer(); EXIT_TIMER = setTimeout(()=>exitRoom(), 5000);
    }
    else if(msg.type === "final_table"){
      showModal("🎯 ФИНАЛЬНЫЙ СТОЛ","Все игроки собраны за одним столом!",[]);
      setTimeout(()=>hide(els.modal), 3000);
    }
  };
}
function wsSend(o){ if(WS && WS.readyState===1) WS.send(JSON.stringify(o)); }

function handleTournamentEnded(msg){
  if((GAME_TYPE === 'wheel' || GAME_TYPE === 'wheel_1v1') && WHEEL_LOCK){
    PENDING_ENDED = msg; return;
  }
  _showEndedModal(msg);
}

function _showEndedModal(msg){
  const manual = !!msg.manual;
  const winnerId = msg.winner_id;
  const winnerName = msg.winner_name;
  let title, body, countdown;
  if(manual){
    title = "🏁 Турнир завершён";
    body = "Администратор остановил турнир.<br>Победитель не определён.";
    countdown = 5;
  } else if(winnerId){
    if(winnerId === MY_ID){
      title = "🏆 ПОБЕДА!";
      body = `Вы победили!<br><b>${escapeHtml(winnerName || "")}</b>`;
    } else {
      title = "🏁 Турнир завершён";
      body = `🥇 Победитель: <b>${escapeHtml(winnerName || "—")}</b>`;
    }
    countdown = 15; fireConfetti();
  } else {
    title = "🏁 Турнир завершён";
    body = "Победитель не определён.";
    countdown = 5;
  }
  let remaining = countdown;
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body + `<div class="countdown-text" id="cd">Возврат в меню через ${remaining}…</div>`;
  els.modalBtns.innerHTML = `<button class="btn" id="mc">Закрыть сейчас</button>`;
  document.getElementById("mc").onclick = () => { clearExitTimer(); exitRoom(); };
  show(els.modal);
  const tick = setInterval(() => {
    remaining--;
    const cdel = document.getElementById("cd");
    if(cdel) cdel.textContent = `Возврат в меню через ${remaining}…`;
    if(remaining <= 0){ clearInterval(tick); exitRoom(); }
  }, 1000);
  clearExitTimer();
  EXIT_TIMER = setTimeout(()=>{ clearInterval(tick); exitRoom(); }, countdown * 1000 + 200);
}

// ================== BRACKET ==================
function renderBracket(s){
  LAST_STATE = s;
  if(BRACKET_ACTIVE_MATCH_ID){
    // пользователь в конкретной комнате
    if(ACTIVE_ROOM_TAB === "bracket"){
      // он на вкладке "Сетка", но всё ещё "в комнате" — покажем сетку, а если вернётся на "Комната", вернёмся в комнату
      drawBracketUI(s);
    } else {
      renderBracketRoom(s, BRACKET_ACTIVE_MATCH_ID);
    }
  } else {
    if(ACTIVE_ROOM_TAB === "bracket") drawBracketUI(s);
    else drawBracketRoomsList(s);
  }
}

function findMatch(s, match_id){
  if(!s || !s.rounds) return null;
  for(const rnd of s.rounds) for(const m of rnd) if(m.match_id === match_id) return m;
  return null;
}

function findMyActiveMatch(s){
  if(!s || !s.rounds) return null;
  for(const rnd of s.rounds) for(const m of rnd){
    if(m.finished) continue;
    if(m.p1 && m.p1.user_id === MY_ID) return m;
    if(m.p2 && m.p2.user_id === MY_ID) return m;
  }
  return null;
}

function getRoundNames(total){
  if(total === 1) return ["ФИНАЛ"];
  if(total === 2) return ["1/2", "ФИНАЛ"];
  if(total === 3) return ["1/4", "1/2", "ФИНАЛ"];
  if(total === 4) return ["1/8", "1/4", "1/2", "ФИНАЛ"];
  if(total === 5) return ["1/16", "1/8", "1/4", "1/2", "ФИНАЛ"];
  return Array.from({length: total}, (_, i) => `Раунд ${i + 1}`);
}

/* ============ СПИСОК АКТИВНЫХ КОМНАТ ============ */
function drawBracketRoomsList(s){
  els.rmCounter.textContent = `🎮 Комнаты · ${s.size} игроков`;
  if(s.waiting || !s.rounds || !s.rounds.length){
    els.roomContent.innerHTML = `<div class="waiting-box">
      <div class="waiting-ico">🎮</div>
      <div class="waiting-txt">Ожидание участников…</div>
    </div>`;
    return;
  }
  const roundNames = getRoundNames(s.rounds.length);
  const active = [];
  s.rounds.forEach(rnd => rnd.forEach(m => {
    if(m.finished) return;
    if(!m.p1 || !m.p2) return;
    const bothReady = (m.ready||[]).length >= 2;
    if(!bothReady && !m.room_active) return;
    active.push(m);
  }));

  if(!active.length){
    els.roomContent.innerHTML = `<div class="waiting-box">
      <div class="waiting-ico">🎮</div>
      <div class="waiting-txt">Пока нет активных комнат</div>
      <div style="color:#94a3b8;font-size:13px;">Комната появится, когда оба игрока отметятся ✓ в сетке турнира.</div>
    </div>`;
    return;
  }

  let html = `<div style="padding:14px;display:flex;flex-direction:column;gap:12px;">`;
  active.forEach(m => {
    const rn = roundNames[m.round_num] || ("Раунд " + (m.round_num+1));
    const isMine = (m.p1 && m.p1.user_id === MY_ID) || (m.p2 && m.p2.user_id === MY_ID);
    const roomReadyCount = (m.room_ready||[]).length;
    let statusBadge = "";
    if(roomReadyCount >= 2){
      statusBadge = '<span style="color:#fbbf24;font-weight:800;font-size:11px;">🎲 ИДЁТ СЕРИЯ</span>';
    } else if(roomReadyCount === 1){
      statusBadge = '<span style="color:#22c55e;font-weight:800;font-size:11px;">⏳ ЖДЁМ ВТОРОГО</span>';
    } else {
      statusBadge = '<span style="color:#94a3b8;font-weight:800;font-size:11px;">🕒 ОЖИДАНИЕ</span>';
    }
    let btnLabel = isMine ? "🎮 ВОЙТИ" : "👁 НАБЛЮДАТЬ";
    const p1Name = m.p1?.name || "—";
    const p2Name = m.p2?.name || "—";
    const p1w = m.p1_wins || 0, p2w = m.p2_wins || 0;
    html += `
      <div class="tr-card" style="gap:8px;">
        <div class="hdr">
          <div class="name">${escapeHtml(rn)} · матч ${m.pos_in_round+1}</div>
          ${statusBadge}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
          <div style="flex:1;">
            <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
              <span style="color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(p1Name)}</span>
              <b style="color:#fbbf24;font-size:16px;">${p1w}</b>
            </div>
            <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
              <span style="color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(p2Name)}</span>
              <b style="color:#fbbf24;font-size:16px;">${p2w}</b>
            </div>
          </div>
          <div style="font-size:11px;color:#94a3b8;text-align:right;">до ${m.series_target||3}<br>побед</div>
        </div>
        <button class="btn-start" data-enter-room="${m.match_id}">${btnLabel}</button>
      </div>
    `;
  });
  html += `</div>`;
  els.roomContent.innerHTML = html;

  els.roomContent.querySelectorAll("[data-enter-room]").forEach(b => {
    b.addEventListener("click", () => {
      const mid = parseInt(b.dataset.enterRoom, 10);
      if(!mid) return;
      openBracketRoom(mid);
    });
  });
}

function openBracketRoom(mid){
  BRACKET_ACTIVE_MATCH_ID = mid;
  BRACKET_MATCH_VIEW_STATE[mid] = null;

  // Умный старт: если спин уже идёт — дать клиенту его догнать
  const mm = LAST_STATE ? findMatch(LAST_STATE, mid) : null;
  if(mm && mm.last_spin){
    const now = nowServer();
    const spinEndsAt = (mm.last_spin.started_at || 0) + (mm.last_spin.duration || 20000);
    if(now < spinEndsAt){
      // спин ещё крутится → анимируем с текущего момента
      BRACKET_MATCH_LAST_SPIN_SHOWN[mid] = (mm.spin_count || 1) - 1;
    } else {
      BRACKET_MATCH_LAST_SPIN_SHOWN[mid] = mm.spin_count || 0;
    }
  } else {
    BRACKET_MATCH_LAST_SPIN_SHOWN[mid] = 0;
  }

  wsSend({type: "bracket_enter", match_id: mid});

  // Переходим на вкладку «Комната»
  ACTIVE_ROOM_TAB = "main";
  document.querySelectorAll(".room-tab").forEach(x => x.classList.remove("active"));
  const mainTab = document.querySelector('.room-tab[data-rtab="main"]');
  if(mainTab) mainTab.classList.add("active");
  hide(els.bracketContent); show(els.roomContent);
  if(LAST_STATE) renderBracketRoom(LAST_STATE, mid);
}

function closeBracketRoom(){
  const oldMid = BRACKET_ACTIVE_MATCH_ID;
  if(oldMid && BRACKET_MATCH_VIEW_TIMER[oldMid]){
    try{ clearTimeout(BRACKET_MATCH_VIEW_TIMER[oldMid]); }catch(e){}
    BRACKET_MATCH_VIEW_TIMER[oldMid] = null;
  }
  if(oldMid && BRACKET_MATCH_VIEW_ANIM[oldMid]){
    try{ cancelAnimationFrame(BRACKET_MATCH_VIEW_ANIM[oldMid]); }catch(e){}
    BRACKET_MATCH_VIEW_ANIM[oldMid] = null;
  }
  BRACKET_ACTIVE_MATCH_ID = null;
  BRACKET_MATCH_VIEW_STATE = {};
  if(LAST_STATE) drawBracketRoomsList(LAST_STATE);
}

/* ============ СЕТКА ============ */
function drawBracketUI(s){
  els.rmCounter.textContent = `🏆 Сетка · ${s.size} игроков`;
  if(s.waiting || !s.rounds || !s.rounds.length){
    els.bracketContent.innerHTML = `<div class="waiting-box">
      <div class="waiting-ico">🏆</div>
      <div class="waiting-txt">Ожидание всех участников…</div>
      <div style="color:#94a3b8;font-size:13px;">Сетка появится, когда все примут приглашение.</div>
    </div>`;
    return;
  }

  const match = findMyActiveMatch(s);
  BRACKET_MY_MATCH_ID = match ? match.match_id : null;

  const total_rounds = s.rounds.length;
  const roundNames = getRoundNames(total_rounds);

  let html = `<div class="bracket-wrap"><div class="bracket-columns">`;
  s.rounds.forEach((rnd, rIdx) => {
    html += `<div class="bracket-col">`;
    html += `<div class="bracket-col-title">${roundNames[rIdx] || ('Раунд ' + (rIdx + 1))}</div>`;
    rnd.forEach(m => {
      const isMyMatch = (m.p1 && m.p1.user_id === MY_ID) || (m.p2 && m.p2.user_id === MY_ID);
      const bothReady = (m.ready || []).length >= 2;
      const cls = "bracket-match" + (m.finished ? " finished" : (isMyMatch ? " active" : ""));
      html += `<div class="${cls}" data-match="${m.match_id}">`;

      html += renderBracketPlayer(m, m.p1, m.ready, m.finished, m.winner, isMyMatch, m.p1_wins);
      html += `<div class="bracket-vs">VS</div>`;
      html += renderBracketPlayer(m, m.p2, m.ready, m.finished, m.winner, isMyMatch, m.p2_wins);

      const canShowSpectate = !isMyMatch && m.p1 && m.p2;
      if(isMyMatch && !m.finished && m.p1 && m.p2){
        const roomActive = m.room_active;
        let btnLabel = roomActive ? "🎮 ОТКРЫТЬ КОМНАТУ" : "🎮 ВОЙТИ";
        let dis = !bothReady && !roomActive;
        if(!bothReady && !roomActive) btnLabel = "⏳ ЖДЁМ ВТОРОГО";
        html += `<button class="bracket-enter-btn" data-enter="${m.match_id}" ${dis?"disabled":""}>${btnLabel}</button>`;
      } else if(IS_ADMIN && !m.finished && m.p1 && m.p2){
        const roomActive = m.room_active;
        let btnLabel = roomActive ? "🎮 ОТКРЫТЬ КОМНАТУ" : "🎮 ВОЙТИ";
        let dis = !bothReady && !roomActive;
        html += `<button class="bracket-enter-btn admin-view" data-enter="${m.match_id}" ${dis?"disabled":""}>${btnLabel}</button>`;
      } else if(canShowSpectate){
        const isRunning = m.room_ready && m.room_ready.length >= 2 && !m.finished;
        const isFinished = m.finished;
        let label = "👁 СМОТРЕТЬ";
        if(isFinished) label = "👁 РЕЗУЛЬТАТ";
        else if(isRunning) label = "👁 СМОТРЕТЬ БОЙ";
        html += `<button class="bracket-enter-btn spectate" data-enter="${m.match_id}">${label}</button>`;
      }

      html += `</div>`;
    });
    html += `</div>`;
  });
  html += `</div></div>`;

  if(s.finished && s.winner){
    html += `<div class="waiting-box" style="padding:24px;">
      <div class="waiting-ico">🏆</div>
      <div class="waiting-txt">Победитель турнира: <b>${escapeHtml(s.winner.name)}</b></div>
    </div>`;
  }

  els.bracketContent.innerHTML = html;

  els.bracketContent.querySelectorAll(".bracket-check").forEach(btn => {
    btn.addEventListener("click", () => {
      const mid = parseInt(btn.dataset.mid, 10);
      if(!mid || btn.disabled) return;
      wsSend({type: "bracket_ready", match_id: mid});
    });
  });
  els.bracketContent.querySelectorAll(".bracket-enter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const mid = parseInt(btn.dataset.enter, 10);
      if(!mid || btn.disabled) return;
      openBracketRoom(mid);
    });
  });
}

function renderBracketPlayer(m, p, readyList, finished, winner, isMyMatch, wins){
  if(!p){
    return `<div class="bracket-player"><div class="bp-name" style="color:#64748b;">—</div></div>`;
  }
  const isReady = (readyList || []).includes(p.user_id);
  const isWinner = winner && winner.user_id === p.user_id;
  const isLoser = finished && winner && winner.user_id !== p.user_id;
  const isMe = p.user_id === MY_ID;
  let cls = "bracket-player";
  if(finished && isWinner) cls += " winner";
  else if(finished && isLoser) cls += " loser";

  let checkCls = "bracket-check";
  let checkText = "";
  let disabled = "disabled";
  if(isReady) { checkCls += " checked"; checkText = "✓"; }
  if(isMe && !finished && m.p1 && m.p2 && !isReady) disabled = "";
  if(isMe && isReady) disabled = "disabled";
  if(isMe) checkCls += " mine"; else checkCls += " notmine";

  let scoreText = "";
  if(m.series_target && m.series_target > 1){
    const myWins = (p.user_id === (m.p1 && m.p1.user_id)) ? (m.p1_wins||0) : (m.p2_wins||0);
    const otherWins = (p.user_id === (m.p1 && m.p1.user_id)) ? (m.p2_wins||0) : (m.p1_wins||0);
    if(myWins > 0 || otherWins > 0){
      scoreText = `<span class="bracket-score">${myWins}</span>`;
    }
  }

  return `<div class="${cls}">
    <div class="bp-name">${escapeHtml(p.name)}${isMe ? ' <span style="color:#fbbf24;">(вы)</span>' : ''}</div>
    ${scoreText}
    <button class="${checkCls}" data-mid="${m.match_id}" data-uid="${p.user_id}" ${disabled}>${checkText}</button>
  </div>`;
}

/* ============= BRACKET ROOM ============= */
function renderBracketRoom(s, match_id){
  const m = findMatch(s, match_id);
  if(!m){
    // матч исчез (удалён) — выходим
    BRACKET_ACTIVE_MATCH_ID = null;
    BRACKET_MATCH_VIEW_STATE[match_id] = null;
    if(ACTIVE_ROOM_TAB === "bracket") drawBracketUI(s);
    else drawBracketRoomsList(s);
    return;
  }

  const state = BRACKET_MATCH_VIEW_STATE[match_id];
  // Идёт анимация — не мешаем
  if(state === "spinning") return;
  // Показывается результат — таймер сам всё разрулит
  if(state === "showing_result") return;

  const lastShown = BRACKET_MATCH_LAST_SPIN_SHOWN[match_id] || 0;
  const hasNewSpin = m.last_spin && m.spin_count > lastShown;

  if(hasNewSpin){
    BRACKET_MATCH_LAST_SPIN_SHOWN[match_id] = m.spin_count;
    BRACKET_MATCH_VIEW_STATE[match_id] = "spinning";
    clearBracketTimer(match_id);
    animateBracketSpin(s, m, () => {
      // Дадим серверу 1 сек, чтобы он прислал финализированное состояние
      setTimeout(() => {
        if(BRACKET_ACTIVE_MATCH_ID !== match_id) return;
        showMatchResult(match_id);
      }, 1000);
    });
    return;
  }

  // Матч уже завершён, а мы только что вошли — показать финал
  if(m.finished){
    showMatchResult(match_id);
    return;
  }

  drawBracketRoomWaiting(s, m);
}

function clearBracketTimer(match_id){
  if(BRACKET_MATCH_VIEW_TIMER[match_id]){
    try{ clearTimeout(BRACKET_MATCH_VIEW_TIMER[match_id]); }catch(e){}
    BRACKET_MATCH_VIEW_TIMER[match_id] = null;
  }
}

/**
 * Показывает результат текущего спина. Читает свежий LAST_STATE,
 * потому что к этому моменту сервер уже отправил финализацию.
 */
function showMatchResult(match_id){
  const s = LAST_STATE;
  if(!s){ return; }
  const m = findMatch(s, match_id);
  if(!m){
    BRACKET_ACTIVE_MATCH_ID = null;
    BRACKET_MATCH_VIEW_STATE[match_id] = null;
    drawBracketUI(s);
    return;
  }

  BRACKET_MATCH_VIEW_STATE[match_id] = "showing_result";
  clearBracketTimer(match_id);

  if(m.finished){
    // Финал серии → 7 сек показать → перевести на вкладку «Сетка»
    drawBracketRoomFinalResult(m);
    BRACKET_MATCH_VIEW_TIMER[match_id] = setTimeout(() => {
      if(BRACKET_ACTIVE_MATCH_ID !== match_id) return;
      BRACKET_MATCH_VIEW_STATE[match_id] = null;
      BRACKET_ACTIVE_MATCH_ID = null;
      // переключаемся на вкладку «Сетка турнира»
      ACTIVE_ROOM_TAB = "bracket";
      document.querySelectorAll(".room-tab").forEach(x => x.classList.remove("active"));
      const bt = document.querySelector('.room-tab[data-rtab="bracket"]');
      if(bt) bt.classList.add("active");
      hide(els.roomContent); show(els.bracketContent);
      if(LAST_STATE) drawBracketUI(LAST_STATE);
    }, 7000);
  } else {
    // Промежуточная победа в серии → 3.5 сек → вернуться в комнату
    drawBracketRoomRoundResult(m);
    BRACKET_MATCH_VIEW_TIMER[match_id] = setTimeout(() => {
      if(BRACKET_ACTIVE_MATCH_ID !== match_id) return;
      BRACKET_MATCH_VIEW_STATE[match_id] = null;
      if(LAST_STATE) renderBracketRoom(LAST_STATE, match_id);
    }, 3500);
  }
}

  const p1 = m.p1, p2 = m.p2;
  const p1RoomReady = (m.room_ready || []).includes(p1?.user_id);
  const p2RoomReady = (m.room_ready || []).includes(p2?.user_id);
  const iAmPlayer = (p1 && p1.user_id === MY_ID) || (p2 && p2.user_id === MY_ID);
  const myRoomReady = m.room_ready && m.room_ready.includes(MY_ID);

  const roundIdx = m.round_num;
  const totalRounds = s.rounds.length;
  const roundNames = getRoundNames(totalRounds);
  const roundName = roundNames[roundIdx] || ("Раунд " + (roundIdx + 1));

  els.rmCounter.textContent = `🏆 ${roundName} · матч ${m.pos_in_round + 1}`;

  const p1w = m.p1_wins||0, p2w = m.p2_wins||0;
  const target = m.series_target || 3;

  let html = `<div class="duel-wrap">
    <div style="text-align:center;color:#94a3b8;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:800;">${escapeHtml(roundName)}</div>
    <div style="text-align:center;color:#fbbf24;font-size:13px;font-weight:800;">Серия до ${target} побед · Счёт <b>${p1w}:${p2w}</b></div>
    <div class="duel-vs">
      <div class="duel-side">
        <div class="ava">${p1?.user_id === MY_ID ? '🙋' : '👤'}</div>
        <div class="nm">${escapeHtml(p1?.name || '—')}</div>
        <div class="score-big">${p1w}</div>
        <div class="status-tag ${p1RoomReady ? 'ready' : 'notready'}">${p1RoomReady ? '✅ Готов' : '⏳ Не готов'}</div>
      </div>
      <div class="duel-vs-mid">VS</div>
      <div class="duel-side">
        <div class="ava">${p2?.user_id === MY_ID ? '🙋' : '👤'}</div>
        <div class="nm">${escapeHtml(p2?.name || '—')}</div>
        <div class="score-big">${p2w}</div>
        <div class="status-tag ${p2RoomReady ? 'ready' : 'notready'}">${p2RoomReady ? '✅ Готов' : '⏳ Не готов'}</div>
      </div>
    </div>
    <div class="wheel-stage"><div class="pointer"></div><canvas id="wheel" width="640" height="640"></canvas></div>`;

  if(iAmPlayer && !myRoomReady){
    html += `<div class="ready-btn"><button id="bracket-room-ready">🤝 ГОТОВ</button></div>`;
  } else if(iAmPlayer && myRoomReady){
    html += `<div class="ready-btn"><button class="pressed" disabled>✅ ВЫ ГОТОВЫ · ЖДЁМ СЛЕДУЮЩИЙ СПИН</button></div>`;
  } else if(!iAmPlayer){
    html += `<div class="waiting-info">👁 Вы наблюдаете за матчем.</div>`;
  }
  html += `<div class="waiting-info">${(!p1RoomReady || !p2RoomReady) ? 'Оба игрока должны нажать «Готов» — серия начнётся автоматически.' : '🎲 Колесо крутится…'}</div>`;
  html += `<div style="text-align:center;padding:10px;">
    <button class="btn" id="bracket-back" style="background:#334155;">${iAmPlayer ? '⬅️ К списку комнат' : '🚪 Покинуть комнату'}</button>
  </div>`;
  html += `</div>`;
  els.roomContent.innerHTML = html;

  const canvas = document.getElementById("wheel");
  drawBracketWheelStatic(canvas, p1, p2);

  const rr = document.getElementById("bracket-room-ready");
  if(rr) rr.addEventListener("click", () => {
    wsSend({type: "bracket_room_ready", match_id: m.match_id});
    rr.disabled = true; rr.textContent = "✅ ОТПРАВЛЕНО"; rr.classList.add("pressed");
  });
  const back = document.getElementById("bracket-back");
  if(back) back.addEventListener("click", () => {
    closeBracketRoom();

}

function drawBracketRoomRoundResult(m){
  const winName = m.last_spin && m.last_spin.winner_user_id === (m.p1 && m.p1.user_id)
    ? (m.p1 && m.p1.name) : (m.p2 && m.p2.name);
  const p1w = m.p1_wins||0, p2w = m.p2_wins||0;
  const target = m.series_target || 3;
  const roundsLeft = `До победы в серии: ${Math.max(0, target - Math.max(p1w, p2w))}`;

  els.roomContent.innerHTML = `<div class="waiting-box">
    <div class="waiting-ico">🎯</div>
    <div class="waiting-txt">Раунд выиграл: <b>${escapeHtml(winName || "—")}</b></div>
    <div style="color:#cbd5e1;font-size:15px;margin-top:8px;">Счёт серии: <b>${p1w}:${p2w}</b></div>
    <div style="color:#94a3b8;font-size:13px;margin-top:4px;">${roundsLeft}</div>
    <div style="color:#fbbf24;font-size:13px;margin-top:12px;">Следующий спин через <span id="br-next-cd">3</span>…</div>
  </div>`;
  let sec = 3;
  const tick = setInterval(() => {
    sec--;
    const el = document.getElementById("br-next-cd");
    if(el) el.textContent = Math.max(0, sec);
    if(sec <= 0) clearInterval(tick);
  }, 1000);
}

function drawBracketRoomFinalResult(m){
  const winName = m.winner ? m.winner.name : "—";
  const iWon = m.winner && m.winner.user_id === MY_ID;
  const iLost = m.loser && m.loser.user_id === MY_ID;
  const iAmPlayer = (m.p1 && m.p1.user_id === MY_ID) || (m.p2 && m.p2.user_id === MY_ID);
  const p1w = m.p1_wins||0, p2w = m.p2_wins||0;

  let icon = "🏆", title = "";
  if(iWon) title = "Вы прошли дальше!";
  else if(iLost) title = "Вы выбыли из турнира";
  else if(!iAmPlayer) title = `Победитель матча: ${escapeHtml(winName)}`;
  else title = `Победитель: ${escapeHtml(winName)}`;

  els.roomContent.innerHTML = `<div class="waiting-box">
    <div class="waiting-ico">${icon}</div>
    <div class="waiting-txt">${title}</div>
    <div style="color:#cbd5e1;font-size:15px;margin-top:8px;">Финальный счёт серии: <b>${p1w}:${p2w}</b></div>
    <div style="color:#94a3b8;font-size:13px;margin-top:8px;">Серия завершена.</div>
    <div style="color:#fbbf24;font-size:13px;margin-top:12px;">Возврат к сетке через <span id="br-exit-cd">7</span>…</div>
  </div>`;
  let sec = 7;
  const tick = setInterval(() => {
    sec--;
    const el = document.getElementById("br-exit-cd");
    if(el) el.textContent = Math.max(0, sec);
    if(sec <= 0) clearInterval(tick);
  }, 1000);
}

function animateBracketSpin(s, m, onDone){
  let canvas = document.getElementById("wheel");
  if(!canvas){
    const wrap = document.createElement("div");
    wrap.className = "wheel-stage";
    wrap.innerHTML = `<div class="pointer"></div><canvas id="wheel" width="640" height="640"></canvas>`;
    els.roomContent.innerHTML = "";
    els.roomContent.appendChild(wrap);
    canvas = document.getElementById("wheel");
  }
  const players = [m.p1, m.p2].filter(Boolean);
  const n = players.length;
  const winnerIdx = m.last_spin.winner_index;
  const offsetRatio = m.last_spin.final_offset_ratio || 0;
  const duration = m.last_spin.duration || 20000;
  const serverStart = m.last_spin.started_at || nowServer();

  const span = Math.PI * 2 / n;
  const center = -(winnerIdx + 0.5) * span;
  const target = center + offsetRatio * span + 8 * Math.PI * 2;
  const startAngle = target - Math.PI * 2 * 12;

  const el = nowServer() - serverStart;
  const initialK = Math.min(1, Math.max(0, el / duration));
  WHEEL_ANGLE = startAngle + (target - startAngle) * (1 - Math.pow(1 - initialK, 4));
  drawBracketWheelDynamic(canvas, players);

  if(initialK >= 1){
    WHEEL_ANGLE = target;
    drawBracketWheelDynamic(canvas, players);
    if(onDone) onDone();
    return;
  }

  const mid = m.match_id;
  function frame(){
    if(BRACKET_ACTIVE_MATCH_ID !== mid){
      // вышли из комнаты — прерываем анимацию
      return;
    }
    const elapsed = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, elapsed / duration));
    const eased = 1 - Math.pow(1 - k, 4);
    WHEEL_ANGLE = startAngle + (target - startAngle) * eased;
    drawBracketWheelDynamic(canvas, players);
    if(k < 1){
      BRACKET_MATCH_VIEW_ANIM[mid] = requestAnimationFrame(frame);
    } else {
      WHEEL_ANGLE = target;
      drawBracketWheelDynamic(canvas, players);
      if(onDone) onDone();
    }
  }
  BRACKET_MATCH_VIEW_ANIM[mid] = requestAnimationFrame(frame);
}

function drawBracketWheelStatic(canvas, p1, p2){
  if(!canvas) return;
  drawBracketWheelDynamic(canvas, [p1, p2].filter(Boolean));
}
function drawBracketWheelDynamic(canvas, players){
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, r = Math.min(W,H)/2 - 30;
  ctx.clearRect(0,0,W,H);
  const haloGrad = ctx.createRadialGradient(cx, cy, r*0.6, cx, cy, r+30);
  haloGrad.addColorStop(0, "rgba(219,39,119,0)");
  haloGrad.addColorStop(0.7, "rgba(219,39,119,0.15)");
  haloGrad.addColorStop(1, "rgba(219,39,119,0)");
  ctx.fillStyle = haloGrad;
  ctx.beginPath(); ctx.arc(cx, cy, r+30, 0, Math.PI*2); ctx.fill();
  const n = Math.max(players.length, 1);
  const palette = [
    {fill:["#ff1e56","#a41035"], glow:"#ff1e56"},
    {fill:["#00c9ff","#005b8f"], glow:"#00c9ff"},
  ];
  for(let i = 0; i < n; i++){
    const a0 = (i/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const a1 = ((i+1)/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const col = palette[i % palette.length];
    const grad = ctx.createRadialGradient(cx, cy, r*0.2, cx, cy, r);
    grad.addColorStop(0, col.fill[0]); grad.addColorStop(1, col.fill[1]);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a0, a1); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.save();
    ctx.strokeStyle = col.glow; ctx.lineWidth = 3;
    ctx.shadowColor = col.glow; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r*Math.cos(a0), cy + r*Math.sin(a0));
    ctx.stroke(); ctx.restore();
    const mid2 = (a0 + a1) / 2;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(mid2);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px 'Segoe UI',sans-serif";
    const label = players[i] ? players[i].name : "";
    const txt = label.length > 18 ? label.slice(0,18)+"…" : label;
    ctx.fillText(txt, r - 18, 0);
    ctx.restore();
  }
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = "#a78bfa"; ctx.lineWidth = 6;
  ctx.shadowColor = "#a78bfa"; ctx.shadowBlur = 25; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r-4, 0, Math.PI*2);
  ctx.strokeStyle = "#db2777"; ctx.lineWidth = 2;
  ctx.shadowColor = "#db2777"; ctx.shadowBlur = 15; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI*2);

  ctx.fillStyle = hubGrad; ctx.shadowColor = "#7c3aed"; ctx.shadowBlur = 30; ctx.fill();

function start1v1Animation(s){
  WHEEL_LOCK = true;
  WHEEL_LAST_SPIN_SHOWN = s.spin_count;
  const players = s.players || [];
  let html = `<div class="wheel-stage"><div class="pointer"></div><canvas id="wheel" width="640" height="640"></canvas></div>
    <div class="participants"><h3>👥 Участники</h3><div class="p-list">`;
  players.forEach(p => { html += `<div class="p-row"><span>${escapeHtml(p.name)}</span></div>`; });
  html += `</div></div>`;
  els.roomContent.innerHTML = html;
  const realCanvas = document.getElementById("wheel");
  const n = players.length;
  const winnerIdx = s.last_spin.winner_index;
  const offsetRatio = s.last_spin.final_offset_ratio || 0;
  const duration = s.last_spin.duration || 8000;
  const serverStart = s.last_spin.started_at || nowServer();

  const span = Math.PI * 2 / n;
  const center = -(winnerIdx + 0.5) * span;
  const target = center + offsetRatio * span + 8 * Math.PI * 2;
  const startAngle = target - Math.PI * 2 * 12;

  function setPhase(){
    const el = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, el / duration));
    const eased = 1 - Math.pow(1 - k, 4);
    WHEEL_ANGLE = startAngle + (target - startAngle) * eased;
    return k;
  }
  setPhase(); draw1v1Wheel(realCanvas, players);
  function frame(){
    const k = setPhase();
    draw1v1Wheel(realCanvas, players);
    if(k < 1) requestAnimationFrame(frame);
    else {
      WHEEL_ANGLE = target;
      draw1v1Wheel(realCanvas, players);
      WHEEL_LOCK = false;
      if(PENDING_ENDED){ const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(()=>_showEndedModal(e), 600); }
    }
  }
  requestAnimationFrame(frame);
}

function draw1v1Wheel(canvas, players){
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, r = Math.min(W,H)/2 - 30;
  ctx.clearRect(0,0,W,H);
  const haloGrad = ctx.createRadialGradient(cx, cy, r*0.6, cx, cy, r+30);
  haloGrad.addColorStop(0, "rgba(219,39,119,0)");
  haloGrad.addColorStop(0.7, "rgba(219,39,119,0.15)");
  haloGrad.addColorStop(1, "rgba(219,39,119,0)");
  ctx.fillStyle = haloGrad;
  ctx.beginPath(); ctx.arc(cx, cy, r+30, 0, Math.PI*2); ctx.fill();
  const n = Math.max(players.length, 1);
  const palette = [
    {fill:["#ff1e56","#a41035"], glow:"#ff1e56"},
    {fill:["#00c9ff","#005b8f"], glow:"#00c9ff"},
  ];
  for(let i = 0; i < n; i++){
    const a0 = (i/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const a1 = ((i+1)/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const col = palette[i % palette.length];
    const grad = ctx.createRadialGradient(cx, cy, r*0.2, cx, cy, r);
    grad.addColorStop(0, col.fill[0]); grad.addColorStop(1, col.fill[1]);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a0, a1); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.save();
    ctx.strokeStyle = col.glow; ctx.lineWidth = 3;
    ctx.shadowColor = col.glow; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r*Math.cos(a0), cy + r*Math.sin(a0));
    ctx.stroke(); ctx.restore();
    const mid = (a0 + a1) / 2;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(mid);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px 'Segoe UI',sans-serif";
    const label = players[i] ? players[i].name : "";
    const txt = label.length > 18 ? label.slice(0,18)+"…" : label;
    ctx.fillText(txt, r - 18, 0);
    ctx.restore();
  }
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = "#a78bfa"; ctx.lineWidth = 6;
  ctx.shadowColor = "#a78bfa"; ctx.shadowBlur = 25; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r-4, 0, Math.PI*2);
  ctx.strokeStyle = "#db2777"; ctx.lineWidth = 2;
  ctx.shadowColor = "#db2777"; ctx.shadowBlur = 15; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI*2);
  const hubGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 58);
  hubGrad.addColorStop(0, "#1e293b"); hubGrad.addColorStop(1, "#0a0e1a");
  ctx.fillStyle = hubGrad; ctx.shadowColor = "#7c3aed"; ctx.shadowBlur = 30; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI*2);
  ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 4;
  ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 20; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "36px sans-serif"; ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 20;
  ctx.fillText("⚔️", cx, cy); ctx.restore();
}

  if(s.turn_deadline && myTurn && tfill){
    const total2 = s.turn_time||20;
    const rem = Math.max(0, s.turn_deadline - Date.now()/1000);
    tfill.style.width = Math.min(100,(rem/total2)*100)+"%";
  }
}

  ctx.strokeStyle = "#a78bfa"; ctx.lineWidth = 6;
  ctx.shadowColor = "#a78bfa"; ctx.shadowBlur = 25; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r-4, 0, Math.PI*2);
  ctx.strokeStyle = "#db2777"; ctx.lineWidth = 2;
  ctx.shadowColor = "#db2777"; ctx.shadowBlur = 15; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 78, 0, Math.PI*2);
  ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 3;
  ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 20; ctx.stroke(); ctx.restore();
  drawHub(ctx, cx, cy);
}

function drawHub(ctx, cx, cy){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI*2);
  const hubGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 58);
  hubGrad.addColorStop(0, "#1e293b"); hubGrad.addColorStop(1, "#0a0e1a");
  ctx.fillStyle = hubGrad; ctx.shadowColor = "#7c3aed"; ctx.shadowBlur = 30; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI*2);
  ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 4;
  ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 20; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "36px sans-serif"; ctx.shadowColor = "#fbbf24"; ctx.shadowBlur = 20;
  ctx.fillText("🎡", cx, cy); ctx.restore();
}

function startSpinAnimation(s){
  WHEEL_LOCK = true;
  WHEEL_LAST_SPIN_SHOWN = s.spin_count;
  let activeWithElim;
  if(s.last_spin.before_active){
    activeWithElim = s.last_spin.before_active.map(p => ({...p}));
  } else {
    activeWithElim = s.active.slice();
    activeWithElim.splice(s.last_spin.sector_index, 0, s.last_spin.eliminated);
  }
  const canvas = document.getElementById("wheel");
  if(!canvas){ WHEEL_LOCK = false; return; }
  const n = activeWithElim.length;
  const idx = s.last_spin.sector_index;
  const offsetRatio = s.last_spin.final_offset_ratio || 0;
  const span = Math.PI * 2 / n;
  const center = -(idx + 0.5) * span;
  const target = center + offsetRatio * span + 8 * Math.PI * 2;
  const startAngle = target - Math.PI * 2 * 12;
  const duration = s.last_spin.duration || 8000;
  const serverStart = s.last_spin.started_at || nowServer();

  function setPhase(force){
    const el = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, el / duration));
    const eased = 1 - Math.pow(1 - k, 4);
    WHEEL_ANGLE = startAngle + (target - startAngle) * eased;
    if(force){ const c = document.getElementById("wheel"); if(c) drawWheel(c, activeWithElim); }
    return k;
  }
  let k = setPhase(true);
  if(k >= 1){
    WHEEL_ANGLE = target;
    const c = document.getElementById("wheel"); if(c) drawWheel(c, activeWithElim);
    setTimeout(() => {
      hide(els.modal); WHEEL_LOCK = false;
      const finalState = WHEEL_NEXT || s;
      WHEEL_NEXT = null;
      updateWheelDOMOnly(finalState);
      if(PENDING_ENDED){ const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(() => _showEndedModal(e), 500); return; }
      if(finalState.finished){ stopAutoSpin(); return; }
      if(AUTO_SPIN && (finalState.active||[]).length >= 2 && ACTIVE_TID && WS && WS.readyState === 1){
        AUTO_TIMER = setTimeout(() => { if(AUTO_SPIN && WS.readyState === 1) wsSend({type:"spin"}); }, 7000);
      } else stopAutoSpin();
    }, 100);
    return;
  }
  function frame(){
    const kk = setPhase(false);
    const c = document.getElementById("wheel"); if(c) drawWheel(c, activeWithElim);
    if(kk < 1){ requestAnimationFrame(frame); }
    else {
      WHEEL_ANGLE = target;
      const c2 = document.getElementById("wheel"); if(c2) drawWheel(c2, activeWithElim);
      showModal("❌ Выбывает", `<b>${escapeHtml(s.last_spin.eliminated.name)}</b><br>покидает турнир!`, []);
      setTimeout(() => {
        hide(els.modal); WHEEL_LOCK = false;
        const finalState = WHEEL_NEXT || s;
        WHEEL_NEXT = null;
        updateWheelDOMOnly(finalState);
        if(PENDING_ENDED){ const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(() => _showEndedModal(e), 500); return; }
        if(finalState.finished){ stopAutoSpin(); return; }
        if(AUTO_SPIN && (finalState.active||[]).length >= 2 && ACTIVE_TID && WS && WS.readyState === 1){
          AUTO_TIMER = setTimeout(() => { if(AUTO_SPIN && WS.readyState === 1) wsSend({type:"spin"}); }, 7000);
        } else stopAutoSpin();
      }, 2500);
    }
  }
  requestAnimationFrame(frame);
}

function getKickablePlayers(){
  const s = LAST_STATE;
  if(!s) return [];
  let players = [];
  if(GAME_TYPE === "poker"){
    players = (s.players || []).map(p => ({user_id: p.user_id, name: p.name || ("Игрок " + p.user_id)}));
  } else if(GAME_TYPE === "wheel_1v1"){
    players = (s.players || []).map(p => ({user_id: p.user_id, name: p.name || ("Игрок " + p.user_id)}));
  } else if(GAME_TYPE === "wheel"){
    players = [
      ...(s.active || []).map(p => ({user_id: p.user_id, name: p.name || ("Игрок " + p.user_id)})),
      ...(s.eliminated || []).map(p => ({user_id: p.user_id, name: p.name || ("Игрок " + p.user_id)})),
    ];
  } else if(GAME_TYPE === "bracket"){
    const seen = new Set();
    for(const rnd of (s.rounds || [])){
      for(const m of rnd){
        if(m.p1 && !seen.has(m.p1.user_id)){ seen.add(m.p1.user_id); players.push(m.p1); }
        if(m.p2 && !seen.has(m.p2.user_id)){ seen.add(m.p2.user_id); players.push(m.p2); }
      }
    }
  }
  return players.filter(p => p.user_id !== MY_ID);
}

els.adKick.addEventListener("click", () => {
  const list = getKickablePlayers();
  if(!list.length){
    showModal("🚫 Кик игрока", "<div style='color:#94a3b8;'>Нет доступных участников для кика.</div>", []);
    return;
  }
  const rows = list.map(p =>
    `<div class="kick-row">
       <span class="kick-name">${escapeHtml(p.name)}</span>
       <button class="kick-x" data-uid="${p.user_id}" data-name="${escapeHtml(p.name)}">❌</button>
     </div>`).join("");
  showModal("🚫 Удалить игрока", `<div class="kick-list">${rows}</div>`, []);
  document.querySelectorAll("#modal-body .kick-x").forEach(b => {
    b.addEventListener("click", () => {
      const uid = parseInt(b.dataset.uid, 10);
      const name = b.dataset.name || "Игрок";
      hide(els.modal);
      showConfirm("🚫 Удалить игрока?",
        `Игрок <b>${escapeHtml(name)}</b> будет исключён из турнира.`,
        () => { wsSend({type:"admin_kick_player", user_id: uid}); });
    });
  });
});

function showModal(title, body, buttons){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body;
  if(!buttons || !buttons.length){
    els.modalBtns.innerHTML = '<button class="btn" id="mc">Закрыть</button>';
    document.getElementById("mc").onclick = () => hide(els.modal);
  } else {
    els.modalBtns.innerHTML = "";
    buttons.forEach(b => {
      const btn = document.createElement("button");
      btn.className = "btn"; btn.style.background = b.color||"#334155"; btn.textContent = b.text;
      btn.onclick = b.onClick; els.modalBtns.appendChild(btn);
    });
  }
  show(els.modal);
}
function showConfirm(title, body, onYes){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body;
  els.modalBtns.innerHTML = `
    <button class="btn" style="background:#b91c1c;" id="cy">Да, удалить</button>
    <button class="btn" style="background:#334155;" id="cn">Отмена</button>`;
  document.getElementById("cy").onclick = () => { hide(els.modal); onYes(); };
  document.getElementById("cn").onclick = () => hide(els.modal);
  show(els.modal);
}

function fireConfetti(){
  const canvas = els.confetti;
  show(canvas);
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  const pieces = Array.from({length:160},()=>({
    x:Math.random()*canvas.width, y:-20-Math.random()*200,
    vy:2+Math.random()*3, vx:-1+Math.random()*2,
    r:4+Math.random()*5, color:`hsl(${Math.random()*360},90%,60%)`,
    rot:Math.random()*Math.PI, vr:-0.1+Math.random()*0.2,
  }));
  let f = 0;
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r,-p.r,p.r*2,p.r*0.6); ctx.restore();
    });
    f++; if(f<400) requestAnimationFrame(loop); else hide(canvas);
  }
  loop();
}
