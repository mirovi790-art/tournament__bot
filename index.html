els.leaveBtn.addEventListener("click", () => {
  showConfirm("🚪 Покинуть турнир?","Вы выйдете досрочно. Подтвердить?", () => {
    wsSend({type:"leave_tournament"});
  });
});

els.adEnd.addEventListener("click", () => {
  showConfirm("🏁 Закончить турнир?","Турнир будет остановлен. Победитель НЕ засчитается.", () => {
    wsSend({type:"admin_end_tournament"});
  });
});

function getKickablePlayers(){
  const s = LAST_STATE;
  if(!s) return [];
  let players = [];
  if(GAME_TYPE === "poker") players = (s.players || []).map(p => ({user_id: p.user_id, name: p.name || ("Игрок " + p.user_id)}));
  else if(GAME_TYPE === "wheel_1v1") players = (s.players || []).map(p => ({user_id: p.user_id, name: p.name || ("Игрок " + p.user_id)}));
  else if(GAME_TYPE === "wheel") players = [
    ...(s.active || []).map(p => ({user_id: p.user_id, name: p.name || ("Игрок " + p.user_id)})),
    ...(s.eliminated || []).map(p => ({user_id: p.user_id, name: p.name || ("Игрок " + p.user_id)})),
  ];
  else if(GAME_TYPE === "bracket"){
    const seen = new Set();
    for(const rnd of (s.rounds || [])){
      for(const m of rnd){
        if(m.p1 && !seen.has(m.p1.user_id)){ seen.add(m.p1.user_id); players.push(m.p1); }
        if(m.p2 && !seen.has(m.p2.user_id)){ seen.add(m.p2.user_id); players.push(m.p2); }
      }
    }
  }
  return players.filter(p => p.user_id !== MY_ID);
}

els.adKick.addEventListener("click", () => {
  const list = getKickablePlayers();
  if(!list.length){ showModal("🚫 Кик игрока", "<div style='color:var(--warm-text-dim);'>Нет доступных.</div>", []); return; }
  const rows = list.map(p =>
    `<div class="kick-row"><span class="kick-name">${escapeHtml(p.name)}</span><button class="kick-x" data-uid="${p.user_id}" data-name="${escapeHtml(p.name)}">❌</button></div>`).join("");
  showModal("🚫 Удалить игрока", `<div class="kick-list">${rows}</div>`, []);
  document.querySelectorAll("#modal-body .kick-x").forEach(b => {
    b.addEventListener("click", () => {
      const uid = parseInt(b.dataset.uid, 10);
      const name = b.dataset.name || "Игрок";
      hide(els.modal);
      showConfirm("🚫 Удалить игрока?", `Игрок <b>${escapeHtml(name)}</b> будет исключён.`, () => { wsSend({type:"admin_kick_player", user_id: uid}); });
    });
  });
});

function showModal(title, body, buttons){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body;
  if(!buttons || !buttons.length){
    els.modalBtns.innerHTML = '<button class="btn" id="mc">Закрыть</button>';
    document.getElementById("mc").onclick = () => hide(els.modal);
  } else {
    els.modalBtns.innerHTML = "";
    buttons.forEach(b => {
      const btn = document.createElement("button");
      btn.className = "btn"; btn.style.background = b.color||"#3a2a1a"; btn.textContent = b.text;
      btn.onclick = b.onClick; els.modalBtns.appendChild(btn);
    });
  }
  show(els.modal);
}
function showConfirm(title, body, onYes){
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body;
  els.modalBtns.innerHTML = `
    <button class="btn" style="background:linear-gradient(135deg,#8b0000,#dc143c);" id="cy">Да, удалить</button>
    <button class="btn" style="background:#3a2a1a;" id="cn">Отмена</button>`;
  document.getElementById("cy").onclick = () => { hide(els.modal); onYes(); };
  document.getElementById("cn").onclick = () => hide(els.modal);
  show(els.modal);
}

function fireConfetti(){
  const canvas = els.confetti;
  show(canvas);
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  const colors = ["#ffcc00","#ff9500","#ff6b00","#dc143c","#e91e63"];
  const pieces = Array.from({length:160},()=>({
    x:Math.random()*canvas.width, y:-20-Math.random()*200,
    vy:2+Math.random()*3, vx:-1+Math.random()*2,
    r:4+Math.random()*5, color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*Math.PI, vr:-0.1+Math.random()*0.2,
  }));
  let f = 0;
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r,-p.r,p.r*2,p.r*0.6); ctx.restore();
    });
    f++; if(f<400) requestAnimationFrame(loop); else hide(canvas);
  }
  loop();
}
