<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Турнир · Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --warm-1:#ffcc00;      /* жёлтый */
  --warm-2:#ff9500;      /* оранжевый */
  --warm-3:#ff6b00;      /* насыщенный оранж */
  --warm-4:#dc143c;      /* малиновый */
  --warm-5:#8b0000;      /* тёмно-красный */
  --warm-bg:#140a06;     /* глубокий коричневый фон */
  --warm-panel:#1c1108;  /* панель */
  --warm-frame:linear-gradient(135deg,#ffcc00 0%,#ff6b00 45%,#dc143c 100%);
  --warm-frame-soft:linear-gradient(135deg,rgba(255,204,0,.6),rgba(255,107,0,.6),rgba(220,20,60,.6));
  --warm-text:#f7e6d3;
  --warm-text-dim:#c9a98b;
  --warm-green:#2d7a4f;
  --warm-green-2:#1e5233;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--warm-bg);color:var(--warm-text);min-height:100vh;user-select:none;overflow-x:hidden;}
#app{display:flex;flex-direction:column;min-height:100vh;}

/* ============ ЖЁЛТАЯ ЗОНА (topbar) ============ */
#topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;
  background:linear-gradient(135deg,#8b3a00 0%,#c94a00 50%,#8b0000 100%);
  border-bottom:3px solid;
  border-image:var(--warm-frame) 1;
  position:sticky;top:0;z-index:20;gap:6px;flex-wrap:wrap;
  box-shadow:0 4px 18px rgba(255,107,0,.35);
}
#title{font-weight:900;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ffe9c7;text-shadow:0 0 8px rgba(255,149,0,.7);}
.status{font-size:10px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.35);color:#ffe9c7;border:1px solid rgba(255,204,0,.5);font-weight:800;}
.status.ok{background:linear-gradient(135deg,#2d7a4f,#1e5233);border-color:#4ade80;color:#d9ffe7;}
.status.err{background:linear-gradient(135deg,#8b0000,#dc143c);border-color:#ff6b6b;color:#ffd9d9;}
.btn-leave{background:linear-gradient(135deg,#8b0000,#dc143c);color:#fff;border:1px solid rgba(255,204,0,.4);padding:7px 12px;border-radius:10px;font-size:11px;font-weight:900;cursor:pointer;box-shadow:0 2px 8px rgba(220,20,60,.5);}
.btn-room-exit{background:linear-gradient(135deg,#ff6b00,#dc143c);color:#fff;border:1px solid rgba(255,204,0,.5);padding:7px 14px;border-radius:10px;font-size:11px;font-weight:900;cursor:pointer;letter-spacing:.4px;box-shadow:0 2px 10px rgba(255,107,0,.6);}
.btn-admin{background:linear-gradient(135deg,#ffcc00,#ff9500);color:#3a1400;border:1px solid rgba(255,255,255,.3);padding:7px 10px;border-radius:10px;font-size:11px;font-weight:900;cursor:pointer;margin-right:3px;box-shadow:0 2px 8px rgba(255,204,0,.5);}

.view{flex:1;display:flex;flex-direction:column;}
.hidden{display:none!important;}

/* ============ Общие табы ============ */
.tabs{display:flex;background:#1c1108;border-bottom:2px solid rgba(255,107,0,.35);}
.tab{flex:1;padding:14px;text-align:center;font-weight:800;font-size:14px;color:var(--warm-text-dim);cursor:pointer;transition:.2s;}
.tab.active{color:var(--warm-1);border-bottom:3px solid var(--warm-2);background:linear-gradient(180deg,#241608,#140a06);text-shadow:0 0 10px rgba(255,204,0,.6);}
.room-tabs{display:flex;background:#140a06;border-bottom:1px solid rgba(255,107,0,.3);}
.room-tab{flex:1;padding:12px;text-align:center;font-weight:800;font-size:13px;color:var(--warm-text-dim);cursor:pointer;}
.room-tab.active{color:var(--warm-1);border-bottom:2px solid var(--warm-2);background:#1c1108;text-shadow:0 0 8px rgba(255,204,0,.6);}

/* ============ Профиль / турниры ============ */
.pf-wrap{padding:16px;}
.pf-card{
  background:var(--warm-frame);padding:3px;border-radius:22px;
  box-shadow:0 8px 28px rgba(255,107,0,.4),0 0 40px rgba(220,20,60,.25);
}
.pf-card-inner{
  background:linear-gradient(135deg,#241608,#140a06);
  border-radius:19px;padding:24px;text-align:center;
}
.pf-card .av{font-size:64px;margin-bottom:6px;filter:drop-shadow(0 0 12px rgba(255,204,0,.6));}
.pf-card .nm{font-size:20px;font-weight:900;color:#ffe9c7;}
.pf-card .un{font-size:13px;color:var(--warm-text-dim);margin-bottom:8px;}
.pf-card .rl{display:inline-block;background:linear-gradient(135deg,#8b3a00,#dc143c);padding:7px 18px;border-radius:999px;font-size:13px;font-weight:900;color:#fff;border:1px solid rgba(255,204,0,.4);}
.pf-stat{margin-top:14px;background:var(--warm-frame);padding:2px;border-radius:16px;}
.pf-stat-inner{background:#1c1108;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;}
.pf-stat .v{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--warm-1),var(--warm-3));-webkit-background-clip:text;background-clip:text;color:transparent;}

.tr-list{padding:14px;display:flex;flex-direction:column;gap:14px;}
.tr-card{
  background:var(--warm-frame-soft);padding:2px;border-radius:18px;
  box-shadow:0 4px 16px rgba(255,107,0,.25);
}
.tr-card-inner{
  background:linear-gradient(135deg,#241608,#140a06);
  border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;
}
.tr-card .hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.tr-card .name{font-size:16px;font-weight:900;color:#ffe9c7;}
.tr-card .emoji{font-size:28px;}
.tr-card .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--warm-text-dim);}
.tr-card .meta b{color:var(--warm-1);}
.tr-card .btn-start{padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#ff9500,#dc143c);color:#fff;font-weight:900;font-size:15px;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 14px rgba(255,107,0,.5);}
.tr-card .btn-start:disabled{background:#3a2a1a;color:#7a5c3a;box-shadow:none;}
.empty{padding:40px 20px;text-align:center;color:var(--warm-text-dim);}

/* ============ КОМНАТА ============ */
.room-head{padding:12px 14px 8px;text-align:center;}
.room-title{
  font-family:Georgia,serif;font-size:24px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,var(--warm-1),var(--warm-3),var(--warm-4));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:8px;text-shadow:0 0 30px rgba(255,149,0,.6);
}
.room-prize{
  display:inline-block;padding:8px 22px;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,204,0,.15),rgba(255,107,0,.08));
  color:var(--warm-1);font-weight:900;font-size:14px;
  border:2px solid var(--warm-2);
  box-shadow:0 0 22px rgba(255,149,0,.45),inset 0 0 18px rgba(255,204,0,.08);
}
.counter-badge{display:inline-block;padding:6px 14px;background:#2a1a0e;border-radius:999px;font-size:12px;margin-top:8px;color:var(--warm-text-dim);font-weight:800;border:1px solid rgba(255,149,0,.3);}

/* ============ КОРИЧНЕВАЯ ЗОНА: счёт + аватарки ============ */
.score-panel{
  margin:14px auto 0;max-width:640px;
  background:var(--warm-frame);padding:3px;border-radius:20px;
  box-shadow:0 6px 22px rgba(139,0,0,.5),0 0 32px rgba(255,107,0,.25);
}
.score-panel-inner{
  background:linear-gradient(135deg,#3d2412 0%,#1c1108 100%);
  border-radius:17px;padding:14px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.score-player{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
.score-player .ava{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#4a2c1a,#241608);
  border:2px solid var(--warm-2);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 0 14px rgba(255,149,0,.5),inset 0 0 8px rgba(0,0,0,.6);
}
.score-player .nm{font-size:13px;font-weight:900;color:#ffe9c7;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
.score-player .score-num{font-size:30px;font-weight:900;line-height:1;text-shadow:0 0 14px rgba(255,204,0,.7);background:linear-gradient(135deg,var(--warm-1),var(--warm-3));-webkit-background-clip:text;background-clip:text;color:transparent;}
.score-player .tag{font-size:10px;font-weight:900;padding:3px 8px;border-radius:999px;letter-spacing:.3px;}
.score-player .tag.notready{background:#3a0a0a;color:#ff9c9c;border:1px solid #7a1010;}
.score-player .tag.ready{background:#0e3a1e;color:#a8f5c3;border:1px solid #2d7a4f;}
.score-vs{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 6px;
}
.score-vs .vs-label{font-size:11px;font-weight:900;color:var(--warm-text-dim);letter-spacing:2px;}
.score-vs .target{font-size:10px;font-weight:800;color:var(--warm-3);}
.score-round{font-size:11px;font-weight:900;color:var(--warm-2);text-transform:uppercase;letter-spacing:1px;}

/* ============ СИНЯЯ ЗОНА: колесо в квадратике ============ */
.wheel-arena{
  margin:14px auto;max-width:640px;width:100%;
  padding:0 14px;
}
.wheel-frame{
  position:relative;
  background:var(--warm-frame);padding:3px;border-radius:24px;
  box-shadow:0 8px 30px rgba(30,58,95,.6),0 0 40px rgba(255,107,0,.3);
}
.wheel-frame-inner{
  background:
    radial-gradient(circle at 50% 45%,rgba(30,58,95,.6) 0%,rgba(14,20,30,.95) 70%),
    linear-gradient(135deg,#0d1824,#050a10);
  border-radius:21px;padding:14px;
  position:relative;overflow:hidden;
  aspect-ratio:1/1;width:100%;
  display:flex;align-items:center;justify-content:center;
}
.wheel-frame-inner::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 50% 45%,rgba(220,20,60,.15) 0%,transparent 55%),
    radial-gradient(circle at 50% 45%,rgba(30,90,160,.2) 0%,transparent 70%);
}
#wheel{position:relative;z-index:2;width:100%;height:100%;max-width:520px;display:block;}
.pointer{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  z-index:5;font-size:0;
  filter:drop-shadow(0 0 10px var(--warm-1)) drop-shadow(0 0 20px rgba(255,204,0,.8));
}
.pointer::before{content:'';display:block;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid var(--warm-1);filter:drop-shadow(0 3px 6px rgba(0,0,0,.9));}
.pointer::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--warm-1) 60%,var(--warm-2) 100%);box-shadow:0 0 12px var(--warm-1),0 0 24px var(--warm-2);}

/* ============ ЗЕЛЁНАЯ ЗОНА: нижняя панель ============ */
.bottom-panel{
  margin:6px auto 20px;max-width:640px;width:100%;padding:0 14px;
}
.bottom-frame{
  background:linear-gradient(135deg,rgba(45,122,79,.5),rgba(255,149,0,.5),rgba(220,20,60,.5));
  padding:3px;border-radius:20px;
  box-shadow:0 6px 22px rgba(30,82,51,.5),0 0 30px rgba(255,107,0,.2);
}
.bottom-frame-inner{
  background:linear-gradient(135deg,#0f2a1c 0%,#140a06 100%);
  border-radius:17px;padding:14px;
  display:flex;flex-direction:column;gap:10px;
}
.bottom-title{font-size:11px;font-weight:900;color:#a8f5c3;letter-spacing:1.5px;text-transform:uppercase;text-align:center;}
.ready-btn{
  display:flex;justify-content:center;
}
.ready-btn button{
  padding:16px 42px;border-radius:14px;border:2px solid rgba(255,204,0,.4);
  background:linear-gradient(135deg,#2d7a4f,#1e5233);
  color:#fff;font-weight:900;font-size:16px;letter-spacing:1.5px;cursor:pointer;
  box-shadow:0 0 24px rgba(45,122,79,.7),0 6px 20px rgba(0,0,0,.5);
  transition:transform .15s;
}
.ready-btn button:hover:not(:disabled){transform:translateY(-2px);}
.ready-btn button:disabled{background:#2a1a0e;border-color:#4a2c1a;color:#7a5c3a;box-shadow:none;}
.ready-btn button.pressed{background:linear-gradient(135deg,#1e5233,#0d2a19);cursor:default;}
.bottom-info{text-align:center;color:#a8f5c3;font-size:13px;font-weight:800;}
.bottom-info.muted{color:var(--warm-text-dim);}
.admin-panel{display:flex;flex-direction:column;gap:8px;}

/* ============ POKER ============ */
.table-wrap{padding:8px;display:flex;justify-content:center;align-items:center;}
.table-felt{position:relative;width:100%;max-width:520px;aspect-ratio:4/5;border-radius:50%/40%;background:radial-gradient(ellipse at center,#2d7a4f 0%,#1e5233 100%);border:10px solid #b45309;box-shadow:inset 0 0 80px rgba(0,0,0,.3),0 0 40px rgba(255,149,0,.4);display:flex;align-items:center;justify-content:center;}
.pot{position:absolute;top:6%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--warm-1),var(--warm-3));padding:8px 20px;border-radius:999px;font-weight:900;color:#3a1400;font-size:15px;box-shadow:0 4px 14px rgba(255,107,0,.6);}
.community{display:flex;gap:6px;justify-content:center;align-items:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.card{width:46px;height:64px;background:#fff;color:#111;border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px;font-weight:800;font-size:16px;box-shadow:0 4px 8px rgba(0,0,0,.5);animation:dealCard .35s ease-out;}
.card.red{color:#dc143c;}
.card.back{background:repeating-linear-gradient(45deg,#8b3a00,#8b3a00 8px,#dc143c 8px,#dc143c 16px);color:transparent;}
@keyframes dealCard{from{transform:translateY(-60px) rotate(-25deg);opacity:0;}to{transform:translateY(0) rotate(0);opacity:1;}}
#players-ring{position:absolute;inset:0;}
.player{position:absolute;width:92px;transform:translate(-50%,-50%);background:linear-gradient(135deg,#3d2412,#1c1108);border:3px solid #4a2c1a;border-radius:14px;padding:8px 5px 5px;text-align:center;font-size:12px;transition:all .25s;}
.player.turn{border-color:var(--warm-1);box-shadow:0 0 24px var(--warm-1),0 0 12px var(--warm-2);}
.player.folded{opacity:.35;filter:grayscale(1);}
.player .name{font-weight:800;font-size:12px;color:#ffe9c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player .chips{color:var(--warm-1);font-weight:800;font-size:13px;}
.player .bet{color:#22d3ee;font-size:11px;font-weight:700;}
.player .cards{display:flex;gap:2px;justify-content:center;margin-top:3px;}
.player .cards .mini{width:18px;height:26px;border-radius:3px;background:#fff;color:#111;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.player .cards .mini.red{color:#dc143c;}
.player .cards .mini.back{background:#8b3a00;color:transparent;}
.log-box{margin:6px 10px;padding:8px 12px;background:#140a06;border:1px solid rgba(255,149,0,.3);border-radius:10px;font-size:11px;color:var(--warm-text-dim);max-height:60px;overflow-y:auto;white-space:pre-line;}
.actions-frame{margin:8px 12px;padding:12px;border:2px solid var(--warm-2);border-radius:18px;background:linear-gradient(135deg,rgba(255,149,0,.1),rgba(220,20,60,.08));}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.btn{border:none;border-radius:12px;padding:14px 10px;color:#fff;font-weight:800;font-size:14px;cursor:pointer;background:#3a2a1a;box-shadow:0 3px 8px rgba(0,0,0,.3);}
.btn:active{transform:scale(.95);}
.btn:disabled{opacity:.35;}
.btn-fold{background:linear-gradient(135deg,#8b0000,#dc143c);}
.btn-check{background:linear-gradient(135deg,#8b3a00,#ff9500);}
.btn-call{background:linear-gradient(135deg,#1e5233,#2d7a4f);}
.btn-raise{background:linear-gradient(135deg,#ff6b00,#ffcc00);color:#3a1400;}
.btn-allin{background:linear-gradient(135deg,#8b0000,#ff6b00);}
.raise-row{display:flex;align-items:center;gap:12px;padding:8px 14px 4px;}
.raise-row input{flex:1;}
#raise-amount{font-weight:800;color:var(--warm-1);min-width:60px;text-align:right;}
.timer-bar{height:8px;background:#1c1108;overflow:hidden;border-radius:4px;margin:8px 14px;}
#timer-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--warm-1),var(--warm-3),var(--warm-4));transition:width .3s linear;}

/* ============ WAITING ============ */
.waiting-box{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 20px;gap:16px;text-align:center;}
.waiting-ico{font-size:80px;animation:pulse 1.6s infinite ease-in-out;filter:drop-shadow(0 0 24px rgba(255,149,0,.6));}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(1.08);}}
.waiting-txt{font-size:17px;color:var(--warm-text-dim);font-weight:800;}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;background:rgba(20,10,6,.9);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-card{background:var(--warm-frame);padding:3px;border-radius:22px;max-width:380px;width:100%;animation:pop .3s ease-out;max-height:90vh;}
.modal-card-inner{background:linear-gradient(135deg,#241608,#140a06);border-radius:19px;padding:26px 22px;text-align:center;overflow-y:auto;max-height:88vh;}
@keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
#modal-title{font-size:22px;font-weight:900;margin-bottom:14px;background:linear-gradient(135deg,var(--warm-1),var(--warm-4));-webkit-background-clip:text;background-clip:text;color:transparent;}
#modal-body{font-size:14px;color:#f7e6d3;margin-bottom:16px;line-height:1.6;}
.modal-btns{display:flex;gap:8px;flex-wrap:wrap;}
.modal-btns .btn{flex:1;min-width:120px;}
.kick-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:50vh;overflow-y:auto;}
.kick-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#1c1108;border-radius:10px;border-left:3px solid var(--warm-3);font-size:14px;}
.kick-row .kick-name{flex:1;text-align:left;font-weight:800;color:#ffe9c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kick-row .kick-x{flex-shrink:0;background:linear-gradient(135deg,#8b0000,#dc143c);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:15px;font-weight:900;cursor:pointer;}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;}
.countdown-text{color:var(--warm-1);font-size:14px;font-weight:900;margin-top:8px;}

/* ============ BRACKET ============ */
.bracket-wrap{padding:14px;display:flex;flex-direction:column;gap:16px;overflow-x:hidden;}
.bracket-columns{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
.bracket-col{display:flex;flex-direction:column;gap:12px;min-width:180px;}
.bracket-col-title{text-align:center;font-size:12px;font-weight:900;color:var(--warm-1);background:linear-gradient(135deg,#241608,#140a06);padding:7px 10px;border-radius:10px;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(255,149,0,.4);}
.bracket-match{
  background:var(--warm-frame-soft);padding:2px;border-radius:14px;
  transition:all .3s;
}
.bracket-match-inner{
  background:linear-gradient(135deg,#241608,#140a06);
  border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;
}
.bracket-match.finished{background:linear-gradient(135deg,var(--warm-1),var(--warm-3));box-shadow:0 0 18px rgba(255,204,0,.6);}
.bracket-match.active{background:linear-gradient(135deg,#4ade80,#2d7a4f);box-shadow:0 0 22px rgba(74,222,128,.6);}
.bracket-player{display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(20,10,6,.7);border-radius:8px;font-size:12px;}
.bracket-player .bp-name{flex:1;font-weight:800;color:#f7e6d3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bracket-player.winner{background:linear-gradient(90deg,rgba(255,204,0,.25),rgba(20,10,6,.7));border:1px solid var(--warm-1);}
.bracket-player.winner .bp-name{color:var(--warm-1);font-weight:900;}
.bracket-player.loser .bp-name{color:#8a6a4a;text-decoration:line-through;opacity:.6;}
.bracket-score{font-size:11px;color:var(--warm-1);font-weight:900;margin-left:4px;background:rgba(255,204,0,.15);padding:1px 6px;border-radius:6px;}
.bracket-check{flex-shrink:0;width:26px;height:26px;border-radius:6px;border:2px solid #4a2c1a;background:#1c1108;color:#7a5c3a;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;transition:all .2s;}
.bracket-check:disabled{cursor:default;opacity:.7;}
.bracket-check.checked{background:linear-gradient(135deg,#2d7a4f,#4ade80);border-color:#4ade80;color:#fff;box-shadow:0 0 12px rgba(74,222,128,.7);}
.bracket-check.notmine{cursor:default;}
.bracket-enter-btn{margin-top:4px;padding:9px;border-radius:9px;border:none;background:linear-gradient(135deg,#ff6b00,#dc143c);color:#fff;font-weight:900;font-size:12px;cursor:pointer;letter-spacing:1px;}
.bracket-enter-btn:disabled{background:#3a2a1a;color:#7a5c3a;cursor:not-allowed;}
.bracket-enter-btn.admin-view{background:linear-gradient(135deg,#ff9500,#ffcc00);color:#3a1400;}
.bracket-enter-btn.spectate{background:linear-gradient(135deg,#3d2412,#4a2c1a);}
.bracket-vs{text-align:center;font-size:10px;color:#7a5c3a;font-weight:900;letter-spacing:1px;margin:-2px 0;}

/* ============ LIST OF ROOMS ============ */
.rooms-list{padding:14px;display:flex;flex-direction:column;gap:12px;}
.room-card{
  background:var(--warm-frame-soft);padding:2px;border-radius:16px;
}
.room-card-inner{
  background:linear-gradient(135deg,#241608,#140a06);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:10px;
}

/* ============ PARTICIPANTS (для колеса) ============ */
.participants{margin:0 14px 14px;background:var(--warm-frame-soft);padding:2px;border-radius:16px;}
.participants-inner{background:linear-gradient(135deg,#241608,#140a06);border-radius:14px;padding:14px;}
.participants h3{margin:0 0 10px;font-size:14px;font-weight:900;color:var(--warm-1);letter-spacing:1px;}
.p-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.p-row{display:flex;justify-content:space-between;padding:10px 14px;background:rgba(20,10,6,.7);border-radius:8px;font-size:13px;border-left:3px solid #2d7a4f;transition:all .2s;color:#f7e6d3;}
.p-row.elim{color:#8a4a4a;opacity:.6;border-left-color:#8b0000;text-decoration:line-through;}
.p-row.win{color:var(--warm-1);font-weight:900;border-left-color:var(--warm-1);background:linear-gradient(90deg,rgba(255,204,0,.2),rgba(20,10,6,.7));}
.p-row.ready{border-left-color:#4ade80;background:linear-gradient(90deg,rgba(74,222,128,.15),rgba(20,10,6,.7));}
.p-row .ready-mark{color:#4ade80;font-weight:900;margin-left:6px;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="title">🏆 Турнир</div>
    <div id="admin-toolbar" class="hidden">
      <button id="ad-kick" class="btn-admin">🚫 Кик</button>
      <button id="ad-end" class="btn-admin">🏁 Закончить</button>
    </div>
    <button id="room-exit-btn" class="btn-room-exit hidden">🚪 Покинуть</button>
    <button id="leave-btn" class="btn-leave hidden">🚪 Выйти</button>
    <div id="status" class="status">Подключение…</div>
  </header>

  <div id="tabs" class="tabs">
    <div class="tab active" data-tab="profile">👤 Профиль</div>
    <div class="tab" data-tab="tournaments">🏆 Турниры</div>
  </div>

  <div id="room-tabs" class="room-tabs hidden">
    <div class="room-tab active" data-rtab="bracket">🏆 Сетка</div>
    <div class="room-tab" data-rtab="main">🎮 Комната</div>
  </div>

  <main id="profile-view" class="view">
    <div class="pf-wrap">
      <div class="pf-card">
        <div class="pf-card-inner">
          <div class="av">👤</div>
          <div class="nm" id="pf-name">—</div>
          <div class="un" id="pf-uname"></div>
          <div class="rl" id="pf-role">🎮 Игрок</div>
        </div>
      </div>
      <div class="pf-stat">
        <div class="pf-stat-inner"><span>🏆 Побед</span><span class="v" id="pf-wins">0</span></div>
      </div>
    </div>
  </main>

  <main id="tournaments-view" class="view hidden">
    <div class="tr-list" id="tr-list"><div class="empty">Загрузка…</div></div>
  </main>

  <main id="room-view" class="view hidden">
    <div class="room-head">
      <div class="room-title" id="rm-title">—</div>
      <div class="room-prize" id="rm-prize">🏆 Приз</div>
      <div class="counter-badge" id="rm-counter">👥 Игроков: 0</div>
    </div>
    <div id="room-content"></div>
    <div id="bracket-content" class="hidden"></div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-card-inner">
        <div id="modal-title"></div>
        <div id="modal-body"></div>
        <div class="modal-btns" id="modal-btns"></div>
      </div>
    </div>
  </div>
  <canvas id="confetti" class="confetti hidden"></canvas>
</div>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand?.();
const INIT_DATA = tg?.initData || "";
const els = {
  title: document.getElementById("title"), status: document.getElementById("status"),
  tabs: document.getElementById("tabs"),
  roomTabs: document.getElementById("room-tabs"),
  profileView: document.getElementById("profile-view"),
  tournamentsView: document.getElementById("tournaments-view"),
  roomView: document.getElementById("room-view"),
  roomContent: document.getElementById("room-content"),
  bracketContent: document.getElementById("bracket-content"),
  trList: document.getElementById("tr-list"),
  pfName: document.getElementById("pf-name"), pfUname: document.getElementById("pf-uname"),
  pfRole: document.getElementById("pf-role"), pfWins: document.getElementById("pf-wins"),
  rmTitle: document.getElementById("rm-title"), rmPrize: document.getElementById("rm-prize"),
  rmCounter: document.getElementById("rm-counter"),
  leaveBtn: document.getElementById("leave-btn"),
  roomExitBtn: document.getElementById("room-exit-btn"),
  adminToolbar: document.getElementById("admin-toolbar"),
  adKick: document.getElementById("ad-kick"),
  adEnd: document.getElementById("ad-end"),
  modal: document.getElementById("modal"), modalTitle: document.getElementById("modal-title"),
  modalBody: document.getElementById("modal-body"), modalBtns: document.getElementById("modal-btns"),
  confetti: document.getElementById("confetti"),
};
let MY_ID = null, IS_ADMIN = false, WS = null, ACTIVE_TID = null;
let GAME_TYPE = null, LAST_STATE = null;
let IS_CREATOR = false, IS_PARTICIPANT = false, MY_STATUS = null, IS_EXCLUDED = false;
let WHEEL_ANGLE = 0;
let WHEEL_LOCK = false;
let WHEEL_NEXT = null;
let WHEEL_LAST_SPIN_SHOWN = 0;
let WHEEL_INITIAL_DONE = false;
let AUTO_SPIN = false, AUTO_TIMER = null, EXIT_TIMER = null;
let PENDING_ENDED = null;
let SERVER_OFFSET = 0;
let MY_READY = false;
let ACTIVE_ROOM_TAB = "bracket";
let BRACKET_ACTIVE_MATCH_ID = null;
let BRACKET_MY_MATCH_ID = null;
let BRACKET_MATCH_VIEW_STATE = {};
let BRACKET_MATCH_VIEW_TIMER = {};
let BRACKET_MATCH_VIEW_ANIM = {};
let BRACKET_MATCH_LAST_SPIN_SHOWN = {};
/* Кеши колеса: 3 offscreen canvas-слоя */
let WCACHE = { key: "", halo: null, sectors: null, hub: null, size: 0 };

function show(el){el.classList.remove("hidden");}
function hide(el){el.classList.add("hidden");}
function setStatus(t,c){els.status.textContent=t; els.status.className="status "+(c||"");}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function stopAutoSpin(){ AUTO_SPIN = false; if(AUTO_TIMER){ clearTimeout(AUTO_TIMER); AUTO_TIMER = null; } }
function clearExitTimer(){ if(EXIT_TIMER){ clearTimeout(EXIT_TIMER); EXIT_TIMER = null; } }
function syncServerTime(s){ if(s && s.server_now){ SERVER_OFFSET = s.server_now - Date.now(); } }
function nowServer(){ return Date.now() + SERVER_OFFSET; }

/* ===== 10 → 6 паттернов, все по часовой, одна кривая ===== */
const SPIN_TURNS_MIN = 9;
const SPIN_TURNS_MAX = 13;
const SPIN_EASING = k => 1 - Math.pow(1 - k, 4);
function pickSpinTurns(){ return SPIN_TURNS_MIN + Math.floor(Math.random()*(SPIN_TURNS_MAX-SPIN_TURNS_MIN+1)); }

document.querySelectorAll("#tabs .tab").forEach(t => {
  t.addEventListener("click", () => {
    if(ACTIVE_TID) return;
    document.querySelectorAll("#tabs .tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    hide(els.profileView); hide(els.tournamentsView);
    if(t.dataset.tab === "profile") show(els.profileView);
    else { show(els.tournamentsView); loadTournaments(); }
  });
});

document.querySelectorAll(".room-tab").forEach(t => {
  t.addEventListener("click", () => {
    ACTIVE_ROOM_TAB = t.dataset.rtab;
    document.querySelectorAll(".room-tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    if(ACTIVE_ROOM_TAB === "bracket"){
      hide(els.roomContent); show(els.bracketContent);
      if(LAST_STATE && LAST_STATE.type === "bracket_state") drawBracketUI(LAST_STATE);
    } else {
      hide(els.bracketContent); show(els.roomContent);
      if(LAST_STATE && LAST_STATE.type === "bracket_state"){
        if(BRACKET_ACTIVE_MATCH_ID) renderBracketRoom(LAST_STATE, BRACKET_ACTIVE_MATCH_ID);
        else drawBracketRoomsList(LAST_STATE);
      }
    }
  });
});

(async function boot(){
  if(!INIT_DATA){setStatus("Нет данных","err");return;}
  await loadProfile();
  setStatus("🟢 Онлайн","ok");
})();

async function loadProfile(){
  try{
    const r = await fetch(`/api/profile?initData=${encodeURIComponent(INIT_DATA)}`);
    if(!r.ok) throw new Error(await r.text());
    const p = await r.json();
    MY_ID = p.user_id;
    IS_ADMIN = p.is_admin;
    els.pfName.textContent = p.first_name || "Игрок";
    els.pfUname.textContent = p.username ? "@"+p.username : "";
    els.pfWins.textContent = p.wins || 0;
    els.pfRole.textContent = IS_ADMIN ? "🛠 Администратор" : "🎮 Игрок";
  }catch(e){ console.error(e); }
}

async function loadTournaments(){
  els.trList.innerHTML = '<div class="empty">Загрузка…</div>';
  try{
    const r = await fetch(`/api/profile?initData=${encodeURIComponent(INIT_DATA)}`);
    const p = await r.json();
    const tours = p.tournaments || [];
    if(!tours.length){
      els.trList.innerHTML = '<div class="empty">📭 Нет активных турниров</div>';
      return;
    }
    els.trList.innerHTML = "";
    tours.forEach(t => {
      const emoji = t.game_type === "poker" ? "🃏" : (t.game_type === "wheel_1v1" ? "⚔️" : (t.game_type === "bracket" ? "🏆" : "🎡"));
      let gameName = "Колесо Фортуны";
      if(t.game_type === "poker") gameName = "Покер";
      else if(t.game_type === "wheel_1v1") gameName = "Колесо 1×1";
      else if(t.game_type === "bracket") gameName = "Турнир с сеткой";
      let canStart = t.status === "running" || t.status === "paused";
      let btnLabel = canStart ? "🎮 НАЧАТЬ" : (t.status === "registration" ? "⏳ Ожидание" : "🏁 Завершён");
      let disabled = !canStart;
      if(t.game_type === "wheel_1v1"){
        if(t.my_status === "pending"){ btnLabel = "⏳ Ждём подтверждения"; disabled = true; }
        else if(t.status === "registration"){ btnLabel = "⏳ Ждём игрока"; disabled = true; }
      }
      if(t.game_type === "bracket"){
        if(t.my_status === "pending"){ btnLabel = "⏳ Ждём подтверждения"; disabled = true; }
        else if(t.status === "registration"){ btnLabel = "⏳ Ждём игроков"; disabled = true; }
        else if(t.my_status === "kicked" || t.my_status === "left"){ btnLabel = "👁 СМОТРЕТЬ"; disabled = false; canStart = true; }
      }
      let badge = "";
      if(t.my_status === "admin") badge = '<span style="color:#ffcc00;font-weight:900;font-size:11px;">👑 АДМИН</span>';
      else if(t.my_status === "creator") badge = '<span style="color:#ff6b00;font-weight:900;font-size:11px;">🎨 СОЗДАТЕЛЬ</span>';
      else if(t.my_status === "pending") badge = '<span style="color:#ff9500;font-weight:900;font-size:11px;">📩 ПРИГЛАШЕНИЕ</span>';
      else if(t.my_status === "kicked") badge = '<span style="color:#ff6b6b;font-weight:900;font-size:11px;">🚫 ИСКЛЮЧЁН</span>';
      else if(t.my_status === "left") badge = '<span style="color:#ff6b6b;font-weight:900;font-size:11px;">🚪 ВЫШЕЛ</span>';
      const card = document.createElement("div");
      card.className = "tr-card";
      card.innerHTML = `
        <div class="tr-card-inner">
          <div class="hdr">
            <div class="name">${escapeHtml(t.name)}</div>
            <div class="emoji">${emoji}</div>
          </div>
          <div class="meta">
            <span>Игра: <b>${gameName}</b></span>
            <span>Статус: <b>${t.display_status || t.status}</b></span>
            ${badge}
          </div>
          ${t.prize ? `<div class="meta">🎁 Приз: <b>${escapeHtml(t.prize)}</b></div>` : ""}
          <button class="btn-start" ${disabled?"disabled":""}>${btnLabel}</button>
        </div>
      `;
      card.querySelector(".btn-start").addEventListener("click", () => { if(canStart) openRoom(t.tid); });
      els.trList.appendChild(card);
    });
  }catch(e){ els.trList.innerHTML = '<div class="empty">Ошибка: '+escapeHtml(e.message)+'</div>'; }
}

async function openRoom(tid){
  try{
    const r = await fetch(`/api/tournament/${tid}?initData=${encodeURIComponent(INIT_DATA)}`);
    if(!r.ok){
      const e = await r.json().catch(()=>({detail:"Ошибка"}));
      showModal("⚠ Ошибка", e.detail || "Не удалось войти", []);
      return;
    }
    const info = await r.json();
    GAME_TYPE = info.game_type;
    ACTIVE_TID = tid;
    IS_ADMIN = info.is_admin;
    IS_PARTICIPANT = info.is_participant;
    IS_EXCLUDED = info.is_excluded;
    MY_STATUS = info.my_status;
    WHEEL_LOCK = false; WHEEL_NEXT = null; WHEEL_LAST_SPIN_SHOWN = 0;
    WHEEL_INITIAL_DONE = false; WHEEL_ANGLE = 0;
    PENDING_ENDED = null; MY_READY = false;
    BRACKET_ACTIVE_MATCH_ID = null; BRACKET_MY_MATCH_ID = null;
    BRACKET_MATCH_VIEW_STATE = {}; BRACKET_MATCH_VIEW_TIMER = {};
    BRACKET_MATCH_VIEW_ANIM = {}; BRACKET_MATCH_LAST_SPIN_SHOWN = {};
    WCACHE = { key: "", halo: null, sectors: null, hub: null, size: 0 };
    ACTIVE_ROOM_TAB = (info.game_type === "bracket") ? "bracket" : "main";
    hide(els.tabs); hide(els.profileView); hide(els.tournamentsView);
    show(els.roomView);
    els.title.textContent = `🏆 ${info.name}`;
    els.rmTitle.textContent = info.name;
    els.rmPrize.textContent = "🏆 " + (info.prize || "Приз");
    els.roomExitBtn.classList.add("hidden");
    show(els.leaveBtn);
    if(IS_ADMIN) show(els.adminToolbar); else hide(els.adminToolbar);
    if(GAME_TYPE === "bracket"){
      show(els.roomTabs);
      document.querySelectorAll(".room-tab").forEach(x => x.classList.remove("active"));
      document.querySelector('.room-tab[data-rtab="bracket"]').classList.add("active");
      hide(els.roomContent); show(els.bracketContent);
    } else {
      hide(els.roomTabs);
      show(els.roomContent); hide(els.bracketContent);
    }
    connectWS(tid);
  }catch(e){ showModal("⚠ Ошибка", e.message, []); }
}

function exitRoom(){
  stopAutoSpin(); clearExitTimer();
  for(const mid in BRACKET_MATCH_VIEW_TIMER){ try{ clearTimeout(BRACKET_MATCH_VIEW_TIMER[mid]); }catch(e){} }
  for(const mid in BRACKET_MATCH_VIEW_ANIM){ try{ cancelAnimationFrame(BRACKET_MATCH_VIEW_ANIM[mid]); }catch(e){} }
  BRACKET_MATCH_VIEW_TIMER = {}; BRACKET_MATCH_VIEW_ANIM = {}; BRACKET_MATCH_VIEW_STATE = {};
  BRACKET_MATCH_LAST_SPIN_SHOWN = {};
  WCACHE = { key: "", halo: null, sectors: null, hub: null, size: 0 };
  PENDING_ENDED = null; WHEEL_NEXT = null; WHEEL_LOCK = false;
  MY_READY = false; BRACKET_ACTIVE_MATCH_ID = null; BRACKET_MY_MATCH_ID = null;
  ACTIVE_ROOM_TAB = "bracket";
  if(WS) try{WS.close();}catch(e){}
  WS = null; ACTIVE_TID = null; GAME_TYPE = null; LAST_STATE = null;
  hide(els.roomView); hide(els.leaveBtn); hide(els.roomExitBtn); hide(els.adminToolbar); hide(els.roomTabs);
  hide(els.modal); hide(els.confetti);
  show(els.tabs);
  document.querySelectorAll("#tabs .tab").forEach(x => x.classList.remove("active"));
  document.querySelector('#tabs .tab[data-tab="tournaments"]').classList.add("active");
  show(els.tournamentsView);
  loadTournaments();
  loadProfile();
}

function connectWS(tid){
  if(WS) try{WS.close();}catch(e){}
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = `${proto}://${location.host}/ws/${tid}?initData=${encodeURIComponent(INIT_DATA)}`;
  WS = new WebSocket(url);
  WS.onopen = () => setStatus("🟢 Онлайн","ok");
  WS.onclose = () => {
    if(!ACTIVE_TID) return;
    setStatus("🔴 Оффлайн","err"); setTimeout(()=>{ if(ACTIVE_TID) connectWS(ACTIVE_TID); },2000);
  };
  WS.onerror = () => setStatus("⚠ Ошибка","err");
  WS.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if(msg.type === "poker_state"){ syncServerTime(msg); renderPoker(msg); }
    else if(msg.type === "wheel_state"){ syncServerTime(msg); renderWheel(msg); }
    else if(msg.type === "wheel_1v1_state"){ syncServerTime(msg); renderWheel1v1(msg); }
    else if(msg.type === "bracket_state"){ syncServerTime(msg); renderBracket(msg); }
    else if(msg.type === "wheel_1v1_ready"){ }
    else if(msg.type === "not_ready"){ showModal("⏳ Не готово","Оба игрока должны нажать «Готов».",[]); }
    else if(msg.type === "spin_denied"){ showModal("⛔ Нет доступа","Крутить может только администратор.",[]); }
    else if(msg.type === "left_tournament"){
      stopAutoSpin(); showModal("🚪 Вы вышли","Возврат в меню...",[]);
      clearExitTimer(); EXIT_TIMER = setTimeout(()=>exitRoom(), 3000);
    }
    else if(msg.type === "player_kicked" && msg.user_id === MY_ID){
      stopAutoSpin(); showModal("🚫 Исключение","Администратор удалил вас.",[]);
      if(GAME_TYPE !== "bracket"){ clearExitTimer(); EXIT_TIMER = setTimeout(()=>exitRoom(), 5000); }
    }
    else if(msg.type === "tournament_ended"){ handleTournamentEnded(msg); }
    else if(msg.type === "tournament_cancelled"){
      stopAutoSpin(); showModal("🛑 Отменён","Турнир отменён.",[]);
      clearExitTimer(); EXIT_TIMER = setTimeout(()=>exitRoom(), 5000);
    }
    else if(msg.type === "final_table"){
      showModal("🎯 ФИНАЛЬНЫЙ СТОЛ","Все игроки собраны за одним столом!",[]);
      setTimeout(()=>hide(els.modal), 3000);
    }
  };
}
function wsSend(o){ if(WS && WS.readyState===1) WS.send(JSON.stringify(o)); }

function handleTournamentEnded(msg){
  if((GAME_TYPE === 'wheel' || GAME_TYPE === 'wheel_1v1') && WHEEL_LOCK){ PENDING_ENDED = msg; return; }
  _showEndedModal(msg);
}

function _showEndedModal(msg){
  const manual = !!msg.manual;
  const winnerId = msg.winner_id;
  const winnerName = msg.winner_name;
  let title, body, countdown;
  if(manual){
    title = "🏁 Турнир завершён";
    body = "Администратор остановил турнир.<br>Победитель не определён.";
    countdown = 5;
  } else if(winnerId){
    if(winnerId === MY_ID){ title = "🏆 ПОБЕДА!"; body = `Вы победили!<br><b>${escapeHtml(winnerName || "")}</b>`; }
    else { title = "🏁 Турнир завершён"; body = `🥇 Победитель: <b>${escapeHtml(winnerName || "—")}</b>`; }
    countdown = 15; fireConfetti();
  } else {
    title = "🏁 Турнир завершён"; body = "Победитель не определён."; countdown = 5;
  }
  let remaining = countdown;
  els.modalTitle.textContent = title;
  els.modalBody.innerHTML = body + `<div class="countdown-text" id="cd">Возврат в меню через ${remaining}…</div>`;
  els.modalBtns.innerHTML = `<button class="btn" id="mc">Закрыть сейчас</button>`;
  document.getElementById("mc").onclick = () => { clearExitTimer(); exitRoom(); };
  show(els.modal);
  const tick = setInterval(() => {
    remaining--;
    const cdel = document.getElementById("cd");
    if(cdel) cdel.textContent = `Возврат в меню через ${remaining}…`;
    if(remaining <= 0){ clearInterval(tick); exitRoom(); }
  }, 1000);
  clearExitTimer();
  EXIT_TIMER = setTimeout(()=>{ clearInterval(tick); exitRoom(); }, countdown * 1000 + 200);
}

els.roomExitBtn.addEventListener("click", () => { closeBracketRoom(); });

// ================== BRACKET ==================
function renderBracket(s){
  LAST_STATE = s;
  if(BRACKET_ACTIVE_MATCH_ID){
    if(ACTIVE_ROOM_TAB === "bracket") drawBracketUI(s);
    else renderBracketRoom(s, BRACKET_ACTIVE_MATCH_ID);
  } else {
    if(ACTIVE_ROOM_TAB === "bracket") drawBracketUI(s);
    else drawBracketRoomsList(s);
  }
}

function findMatch(s, match_id){
  if(!s || !s.rounds) return null;
  for(const rnd of s.rounds) for(const m of rnd) if(m.match_id === match_id) return m;
  return null;
}
function findMyActiveMatch(s){
  if(!s || !s.rounds) return null;
  for(const rnd of s.rounds) for(const m of rnd){
    if(m.finished) continue;
    if(m.p1 && m.p1.user_id === MY_ID) return m;
    if(m.p2 && m.p2.user_id === MY_ID) return m;
  }
  return null;
}
function getRoundNames(total){
  if(total === 1) return ["ФИНАЛ"];
  if(total === 2) return ["1/2","ФИНАЛ"];
  if(total === 3) return ["1/4","1/2","ФИНАЛ"];
  if(total === 4) return ["1/8","1/4","1/2","ФИНАЛ"];
  if(total === 5) return ["1/16","1/8","1/4","1/2","ФИНАЛ"];
  if(total === 6) return ["1/32","1/16","1/8","1/4","1/2","ФИНАЛ"];
  return Array.from({length: total}, (_, i) => `Раунд ${i + 1}`);
}

/* ============ Коричневая зона: панель счёта ============ */

/* ============ Список активных комнат ============ */
function drawBracketRoomsList(s){
  els.rmCounter.textContent = `🎮 Комнаты · ${s.size} игроков`;
  els.roomExitBtn.classList.add("hidden");
  if(s.waiting || !s.rounds || !s.rounds.length){
    els.roomContent.innerHTML = `<div class="waiting-box"><div class="waiting-ico">🎮</div><div class="waiting-txt">Ожидание участников…</div></div>`;

    if(!bothReady && !m.room_active) return;
    active.push(m);
  }));
  if(!active.length){
    els.roomContent.innerHTML = `<div class="waiting-box"><div class="waiting-ico">🎮</div><div class="waiting-txt">Пока нет активных комнат</div><div style="color:var(--warm-text-dim);font-size:13px;">Комната появится, когда оба игрока отметятся ✓ в сетке.</div></div>`;

    const rn = roundNames[m.round_num] || ("Раунд " + (m.round_num+1));
    const isMine = (m.p1 && m.p1.user_id === MY_ID) || (m.p2 && m.p2.user_id === MY_ID);
    const roomReadyCount = (m.room_ready||[]).length;
    let statusBadge = "";
    if(roomReadyCount >= 2) statusBadge = '<span style="color:var(--warm-1);font-weight:900;font-size:11px;">🎲 ИДЁТ СЕРИЯ</span>';
    else if(roomReadyCount === 1) statusBadge = '<span style="color:#4ade80;font-weight:900;font-size:11px;">⏳ ЖДЁМ ВТОРОГО</span>';
    else statusBadge = '<span style="color:var(--warm-text-dim);font-weight:900;font-size:11px;">🕒 ОЖИДАНИЕ</span>';
    let btnLabel = isMine ? "🎮 ВОЙТИ" : "👁 НАБЛЮДАТЬ";
    html += `
      <div class="room-card">
        <div class="room-card-inner">
          <div class="hdr" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <div style="font-size:14px;font-weight:900;color:#ffe9c7;">${escapeHtml(rn)} · матч ${m.pos_in_round+1}</div>
            ${statusBadge}
          </div>
          <div style="display:flex;justify-content:space-between;gap:12px;">
            <div style="flex:1;">
              <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
                <span style="color:#f7e6d3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(m.p1?.name||'—')}</span>
                <b style="color:var(--warm-1);font-size:16px;">${m.p1_wins||0}</b>
              </div>
              <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
                <span style="color:#f7e6d3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(m.p2?.name||'—')}</span>
                <b style="color:var(--warm-1);font-size:16px;">${m.p2_wins||0}</b>
              </div>
            </div>
            <div style="font-size:11px;color:var(--warm-text-dim);text-align:right;">до ${m.series_target||3}<br>побед</div>
          </div>
          <button class="btn-start" data-enter-room="${m.match_id}" style="padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,#ff9500,#dc143c);color:#fff;font-weight:900;font-size:13px;cursor:pointer;letter-spacing:1px;">${btnLabel}</button>
        </div>
      </div>`;

    b.addEventListener("click", () => {

      if(!mid) return;

}

function openBracketRoom(mid){
  BRACKET_ACTIVE_MATCH_ID = mid;
  BRACKET_MATCH_VIEW_STATE[mid] = null;
  const mm = LAST_STATE ? findMatch(LAST_STATE, mid) : null;
  if(mm && mm.last_spin){
    const now = nowServer();
    const spinEndsAt = (mm.last_spin.started_at || 0) + (mm.last_spin.duration || 20000);
    if(now < spinEndsAt) BRACKET_MATCH_LAST_SPIN_SHOWN[mid] = (mm.spin_count || 1) - 1;
    else BRACKET_MATCH_LAST_SPIN_SHOWN[mid] = mm.spin_count || 0;
  } else BRACKET_MATCH_LAST_SPIN_SHOWN[mid] = 0;
  wsSend({type: "bracket_enter", match_id: mid});
  ACTIVE_ROOM_TAB = "main";
  document.querySelectorAll(".room-tab").forEach(x => x.classList.remove("active"));
  const mainTab = document.querySelector('.room-tab[data-rtab="main"]');
  if(mainTab) mainTab.classList.add("active");
  hide(els.bracketContent); show(els.roomContent);
  els.roomExitBtn.classList.remove("hidden");
  if(LAST_STATE) renderBracketRoom(LAST_STATE, mid);
}

function closeBracketRoom(){
  const oldMid = BRACKET_ACTIVE_MATCH_ID;
  if(oldMid && BRACKET_MATCH_VIEW_TIMER[oldMid]){ try{ clearTimeout(BRACKET_MATCH_VIEW_TIMER[oldMid]); }catch(e){} BRACKET_MATCH_VIEW_TIMER[oldMid] = null; }
  if(oldMid && BRACKET_MATCH_VIEW_ANIM[oldMid]){ try{ cancelAnimationFrame(BRACKET_MATCH_VIEW_ANIM[oldMid]); }catch(e){} BRACKET_MATCH_VIEW_ANIM[oldMid] = null; }
  BRACKET_ACTIVE_MATCH_ID = null;
  BRACKET_MATCH_VIEW_STATE = {};
  WCACHE = { key: "", halo: null, sectors: null, hub: null, size: 0 };
  els.roomExitBtn.classList.add("hidden");
  if(LAST_STATE) drawBracketRoomsList(LAST_STATE);
}

/* ============ Сетка ============ */
function drawBracketUI(s){
  els.rmCounter.textContent = `🏆 Сетка · ${s.size} игроков`;
  els.roomExitBtn.classList.add("hidden");
  if(s.waiting || !s.rounds || !s.rounds.length){
    els.bracketContent.innerHTML = `<div class="waiting-box"><div class="waiting-ico">🏆</div><div class="waiting-txt">Ожидание всех участников…</div></div>`;
    return;
  }
  const match = findMyActiveMatch(s);
  BRACKET_MY_MATCH_ID = match ? match.match_id : null;
  const roundNames = getRoundNames(s.rounds.length);
  let html = `<div class="bracket-wrap"><div class="bracket-columns">`;
  s.rounds.forEach((rnd, rIdx) => {
    html += `<div class="bracket-col"><div class="bracket-col-title">${roundNames[rIdx] || ('Раунд '+(rIdx+1))}</div>`;
    rnd.forEach(m => {
      const isMyMatch = (m.p1 && m.p1.user_id === MY_ID) || (m.p2 && m.p2.user_id === MY_ID);
      const bothReady = (m.ready || []).length >= 2;
      const cls = "bracket-match" + (m.finished ? " finished" : (isMyMatch ? " active" : ""));
      html += `<div class="${cls}"><div class="bracket-match-inner">`;
      html += renderBracketPlayer(m, m.p1, m.ready, m.finished, m.winner, isMyMatch);
      html += `<div class="bracket-vs">VS</div>`;
      html += renderBracketPlayer(m, m.p2, m.ready, m.finished, m.winner, isMyMatch);
      const canShowSpectate = !isMyMatch && m.p1 && m.p2;
      if(isMyMatch && !m.finished && m.p1 && m.p2){
        const roomActive = m.room_active;
        let btnLabel = roomActive ? "🎮 ОТКРЫТЬ" : "🎮 ВОЙТИ";
        let dis = !bothReady && !roomActive;
        if(!bothReady && !roomActive) btnLabel = "⏳ ЖДЁМ";
        html += `<button class="bracket-enter-btn" data-enter="${m.match_id}" ${dis?"disabled":""}>${btnLabel}</button>`;
      } else if(IS_ADMIN && !m.finished && m.p1 && m.p2){
        const roomActive = m.room_active;
        let btnLabel = roomActive ? "🎮 ОТКРЫТЬ" : "🎮 ВОЙТИ";
        let dis = !bothReady && !roomActive;
        html += `<button class="bracket-enter-btn admin-view" data-enter="${m.match_id}" ${dis?"disabled":""}>${btnLabel}</button>`;
      } else if(canShowSpectate){
        const isRunning = m.room_ready && m.room_ready.length >= 2 && !m.finished;
        let label = "👁 СМОТРЕТЬ";
        if(m.finished) label = "👁 РЕЗУЛЬТАТ";
        else if(isRunning) label = "👁 СМОТРЕТЬ";
        html += `<button class="bracket-enter-btn spectate" data-enter="${m.match_id}">${label}</button>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  html += `</div></div>`;
  if(s.finished && s.winner){
    html += `<div class="waiting-box" style="padding:24px;"><div class="waiting-ico">🏆</div><div class="waiting-txt">Победитель: <b>${escapeHtml(s.winner.name)}</b></div></div>`;
  }
  els.bracketContent.innerHTML = html;
  els.bracketContent.querySelectorAll(".bracket-check").forEach(btn => {
    btn.addEventListener("click", () => {
      const mid = parseInt(btn.dataset.mid, 10);
      if(!mid || btn.disabled) return;
      wsSend({type: "bracket_ready", match_id: mid});
    });
  });
  els.bracketContent.querySelectorAll(".bracket-enter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const mid = parseInt(btn.dataset.enter, 10);
      if(!mid || btn.disabled) return;
      openBracketRoom(mid);
    });
  });
}

function renderBracketPlayer(m, p, readyList, finished, winner, isMyMatch){
  if(!p) return `<div class="bracket-player"><div class="bp-name" style="color:#7a5c3a;">—</div></div>`;
  const isReady = (readyList || []).includes(p.user_id);
  const isWinner = winner && winner.user_id === p.user_id;
  const isLoser = finished && winner && winner.user_id !== p.user_id;
  const isMe = p.user_id === MY_ID;
  let cls = "bracket-player";
  if(finished && isWinner) cls += " winner";
  else if(finished && isLoser) cls += " loser";
  let checkCls = "bracket-check";
  let checkText = "";
  let disabled = "disabled";
  if(isReady){ checkCls += " checked"; checkText = "✓"; }
  if(isMe && !finished && m.p1 && m.p2 && !isReady) disabled = "";
  if(isMe && isReady) disabled = "disabled";
  if(isMe) checkCls += " mine"; else checkCls += " notmine";
  let scoreText = "";
  if(m.series_target && m.series_target > 1){
    const myWins = (p.user_id === (m.p1 && m.p1.user_id)) ? (m.p1_wins||0) : (m.p2_wins||0);
    const otherWins = (p.user_id === (m.p1 && m.p1.user_id)) ? (m.p2_wins||0) : (m.p1_wins||0);
    if(myWins > 0 || otherWins > 0) scoreText = `<span class="bracket-score">${myWins}</span>`;
  }
  return `<div class="${cls}">
    <div class="bp-name">${escapeHtml(p.name)}${isMe ? ' <span style="color:var(--warm-1);">(вы)</span>' : ''}</div>
    ${scoreText}
    <button class="${checkCls}" data-mid="${m.match_id}" data-uid="${p.user_id}" ${disabled}>${checkText}</button>
  </div>`;
}

/* ============= КОМНАТА МАТЧА ============= */
function renderBracketRoom(s, match_id){
  const m = findMatch(s, match_id);
  if(!m){
    BRACKET_ACTIVE_MATCH_ID = null;
    BRACKET_MATCH_VIEW_STATE[match_id] = null;
    els.roomExitBtn.classList.add("hidden");
    if(ACTIVE_ROOM_TAB === "bracket") drawBracketUI(s); else drawBracketRoomsList(s);
    return;
  }
  const state = BRACKET_MATCH_VIEW_STATE[match_id];
  if(state === "spinning") return;
  if(state === "showing_result") return;
  const lastShown = BRACKET_MATCH_LAST_SPIN_SHOWN[match_id] || 0;
  const hasNewSpin = m.last_spin && m.spin_count > lastShown;
  if(hasNewSpin){
    BRACKET_MATCH_LAST_SPIN_SHOWN[match_id] = m.spin_count;
    BRACKET_MATCH_VIEW_STATE[match_id] = "spinning";
    clearBracketTimer(match_id);
    animateBracketSpin(s, m, () => {
      setTimeout(() => {
        if(BRACKET_ACTIVE_MATCH_ID !== match_id) return;
        showMatchResult(match_id);
      }, 1000);
    });
    return;
  }
  if(m.finished){ showMatchResult(match_id); return; }
  drawBracketRoomWaiting(s, m);
}

function clearBracketTimer(match_id){
  if(BRACKET_MATCH_VIEW_TIMER[match_id]){ try{ clearTimeout(BRACKET_MATCH_VIEW_TIMER[match_id]); }catch(e){} BRACKET_MATCH_VIEW_TIMER[match_id] = null; }
}

function showMatchResult(match_id){
  const s = LAST_STATE;
  if(!s) return;
  const m = findMatch(s, match_id);
  if(!m){
    BRACKET_ACTIVE_MATCH_ID = null;
    BRACKET_MATCH_VIEW_STATE[match_id] = null;
    els.roomExitBtn.classList.add("hidden");
    drawBracketUI(s);
    return;
  }
  BRACKET_MATCH_VIEW_STATE[match_id] = "showing_result";
  clearBracketTimer(match_id);
  if(m.finished){
    drawBracketRoomFinalResult(m);
    BRACKET_MATCH_VIEW_TIMER[match_id] = setTimeout(() => {
      if(BRACKET_ACTIVE_MATCH_ID !== match_id) return;
      BRACKET_MATCH_VIEW_STATE[match_id] = null;
      BRACKET_ACTIVE_MATCH_ID = null;
      WCACHE = { key: "", halo: null, sectors: null, hub: null, size: 0 };
      ACTIVE_ROOM_TAB = "bracket";
      document.querySelectorAll(".room-tab").forEach(x => x.classList.remove("active"));
      const bt = document.querySelector('.room-tab[data-rtab="bracket"]');
      if(bt) bt.classList.add("active");
      hide(els.roomContent); show(els.bracketContent);
      els.roomExitBtn.classList.add("hidden");
      if(LAST_STATE) drawBracketUI(LAST_STATE);
    }, 7000);
  } else {
    drawBracketRoomRoundResult(m);
    BRACKET_MATCH_VIEW_TIMER[match_id] = setTimeout(() => {
      if(BRACKET_ACTIVE_MATCH_ID !== match_id) return;
      BRACKET_MATCH_VIEW_STATE[match_id] = null;
      if(LAST_STATE) renderBracketRoom(LAST_STATE, match_id);
    }, 3500);
  }
}

/* ===== Комната матча: 4 зоны ===== */
function drawBracketRoomWaiting(s, m){
  const p1 = m.p1, p2 = m.p2;
  const iAmPlayer = (p1 && p1.user_id === MY_ID) || (p2 && p2.user_id === MY_ID);
  const myRoomReady = m.room_ready && m.room_ready.includes(MY_ID);
  const p1RoomReady = (m.room_ready || []).includes(p1?.user_id);
  const p2RoomReady = (m.room_ready || []).includes(p2?.user_id);
  const bothReady = p1RoomReady && p2RoomReady;

  // 🟤 коричневая зона — счёт
  const scoreHtml = renderScorePanel(m);

  // 🔵 синяя зона — колесо
  const wheelHtml = `
    <div class="wheel-arena">
      <div class="wheel-frame">
        <div class="wheel-frame-inner">
          <div class="pointer"></div>
          <canvas id="wheel" width="640" height="640"></canvas>
        </div>
      </div>
    </div>`;

  // 🟢 зелёная зона — низ
  let bottomHtml = "";
  if(iAmPlayer){
    bottomHtml += `<div class="bottom-title">Управление</div>`;
    if(!myRoomReady){
      bottomHtml += `<div class="ready-btn"><button id="bracket-room-ready">🤝 ГОТОВ</button></div>`;
      bottomHtml += `<div class="bottom-info muted">${bothReady ? "Колесо крутится…" : "Оба игрока должны нажать «Готов»"}</div>`;
    } else {
      bottomHtml += `<div class="ready-btn"><button class="pressed" disabled>✅ ЖДЁМ СЛЕДУЮЩИЙ СПИН</button></div>`;
      bottomHtml += `<div class="bottom-info">${bothReady ? "🎲 Колесо крутится…" : "Ждём второго игрока"}</div>`;
    }
  } else {
    bottomHtml += `<div class="bottom-title">Наблюдение</div>`;
    bottomHtml += `<div class="bottom-info">👁 Вы наблюдаете за матчем</div>`;
    bottomHtml += `<div class="bottom-info muted">${bothReady ? "🎲 Колесо крутится…" : "Ждём готовности игроков"}</div>`;
  }

  els.roomContent.innerHTML = `
    ${scoreHtml}
    ${wheelHtml}
    <div class="bottom-panel">
      <div class="bottom-frame">
        <div class="bottom-frame-inner">
          ${bottomHtml}
        </div>
      </div>
    </div>
  `;

  const canvas = document.getElementById("wheel");
  drawBracketWheelStatic(canvas, p1, p2, m.match_id);

  const rr = document.getElementById("bracket-room-ready");
  if(rr) rr.addEventListener("click", () => {
    wsSend({type: "bracket_room_ready", match_id: m.match_id});
    rr.disabled = true; rr.textContent = "✅ ОТПРАВЛЕНО"; rr.classList.add("pressed");
  });
}

function drawBracketRoomRoundResult(m){
  const winName = m.last_spin && m.last_spin.winner_user_id === (m.p1 && m.p1.user_id)
    ? (m.p1 && m.p1.name) : (m.p2 && m.p2.name);
  const p1w = m.p1_wins||0, p2w = m.p2_wins||0;
  const target = m.series_target || 3;
  const roundsLeft = `До победы в серии: ${Math.max(0, target - Math.max(p1w, p2w))}`;
  const scoreHtml = renderScorePanel(m);
  els.roomContent.innerHTML = `
    ${scoreHtml}
    <div class="bottom-panel">
      <div class="bottom-frame">
        <div class="bottom-frame-inner">
          <div class="bottom-title">Раунд завершён</div>
          <div class="waiting-box" style="padding:10px 0;">
            <div class="waiting-ico">🎯</div>
            <div class="waiting-txt">Раунд выиграл: <b>${escapeHtml(winName || "—")}</b></div>
            <div style="color:#f7e6d3;font-size:15px;margin-top:8px;">Счёт серии: <b>${p1w}:${p2w}</b></div>
            <div style="color:var(--warm-text-dim);font-size:13px;margin-top:4px;">${roundsLeft}</div>
            <div style="color:var(--warm-1);font-size:13px;margin-top:12px;font-weight:900;">Следующий спин через <span id="br-next-cd">3</span>…</div>
          </div>
        </div>
      </div>
    </div>
  `;
  let sec = 3;
  const tick = setInterval(() => {
    sec--;
    const el = document.getElementById("br-next-cd");
    if(el) el.textContent = Math.max(0, sec);
    if(sec <= 0) clearInterval(tick);
  }, 1000);
}

function drawBracketRoomFinalResult(m){
  const winName = m.winner ? m.winner.name : "—";
  const iWon = m.winner && m.winner.user_id === MY_ID;
  const iLost = m.loser && m.loser.user_id === MY_ID;
  const iAmPlayer = (m.p1 && m.p1.user_id === MY_ID) || (m.p2 && m.p2.user_id === MY_ID);
  const p1w = m.p1_wins||0, p2w = m.p2_wins||0;
  const scoreHtml = renderScorePanel(m);
  let icon = "🏆", title = "";
  if(iWon) title = "Вы прошли дальше!";
  else if(iLost) title = "Вы выбыли из турнира";
  else if(!iAmPlayer) title = `Победитель матча: ${escapeHtml(winName)}`;
  else title = `Победитель: ${escapeHtml(winName)}`;
  els.roomContent.innerHTML = `
    ${scoreHtml}
    <div class="bottom-panel">
      <div class="bottom-frame">
        <div class="bottom-frame-inner">
          <div class="bottom-title">Серия завершена</div>
          <div class="waiting-box" style="padding:10px 0;">
            <div class="waiting-ico">${icon}</div>
            <div class="waiting-txt">${title}</div>
            <div style="color:#f7e6d3;font-size:15px;margin-top:8px;">Финальный счёт: <b>${p1w}:${p2w}</b></div>

}

/* ============================================================
   ОПТИМИЗАЦИЯ КОЛЕСА: 3 offscreen canvas-слоя → 3 drawImage/кадр
   ============================================================ */
function _buildWheelHalo(size){
  const cv = document.createElement("canvas"); cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d");
  const cx = size/2, cy = size/2, r = size/2 - 30;
  const grad = ctx.createRadialGradient(cx,cy,r*0.55,cx,cy,r+30);
  grad.addColorStop(0,"rgba(220,20,60,0)");
  grad.addColorStop(0.7,"rgba(255,107,0,0.18)");
  grad.addColorStop(1,"rgba(255,204,0,0)");
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx,cy,r+30,0,Math.PI*2); ctx.fill();
  return cv;
}

function _buildWheelSectors(players, size){
  const cv = document.createElement("canvas"); cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d");
  const cx = size/2, cy = size/2, r = size/2 - 30;
  const n = Math.max(players.length, 1);
  const palette = [
    {fill:["#ff1e56","#8b0000"], glow:"#ff1e56"},
    {fill:["#ff9500","#8b3a00"], glow:"#ff9500"},
    {fill:["#ffcc00","#a06a00"], glow:"#ffcc00"},
    {fill:["#dc143c","#5a0010"], glow:"#dc143c"},
    {fill:["#ff6b00","#8b3000"], glow:"#ff6b00"},
  ];
  for(let i = 0; i < n; i++){
    const a0 = (i/n)*Math.PI*2 - Math.PI/2;
    const a1 = ((i+1)/n)*Math.PI*2 - Math.PI/2;
    const col = palette[i % palette.length];
    const grad = ctx.createRadialGradient(cx, cy, r*0.2, cx, cy, r);
    grad.addColorStop(0, col.fill[0]); grad.addColorStop(1, col.fill[1]);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.save();
    ctx.strokeStyle = col.glow; ctx.lineWidth = 3;
    ctx.shadowColor = col.glow; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx + r*Math.cos(a0), cy + r*Math.sin(a0));
    ctx.stroke(); ctx.restore();
    const mid = (a0 + a1) / 2;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(mid);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px 'Segoe UI',sans-serif";
    const label = players[i] ? players[i].name : "";
    const txt = label.length > 18 ? label.slice(0,18)+"…" : label;
    ctx.fillText(txt, r - 18, 0);
    ctx.restore();
  }
  // внешние обводки колеса — статичны, тоже в слое
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 6;
  ctx.shadowColor = "#ffcc00"; ctx.shadowBlur = 25; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r-4,0,Math.PI*2);
  ctx.strokeStyle = "#dc143c"; ctx.lineWidth = 2;
  ctx.shadowColor = "#dc143c"; ctx.shadowBlur = 15; ctx.stroke(); ctx.restore();
  return cv;
}

function _buildWheelHub(size){
  const cv = document.createElement("canvas"); cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d");
  const cx = size/2, cy = size/2;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,58,0,Math.PI*2);
  const hubGrad = ctx.createRadialGradient(cx,cy,5,cx,cy,58);
  hubGrad.addColorStop(0,"#3d2412"); hubGrad.addColorStop(1,"#140a06");
  ctx.fillStyle = hubGrad; ctx.shadowColor = "#dc143c"; ctx.shadowBlur = 30; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,58,0,Math.PI*2);
  ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 4;
  ctx.shadowColor = "#ffcc00"; ctx.shadowBlur = 20; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "36px sans-serif"; ctx.shadowColor = "#ffcc00"; ctx.shadowBlur = 20;
  ctx.fillText("🏆", cx, cy); ctx.restore();
  return cv;
}

function _getWheelCache(players, key, size){
  if(WCACHE.key === key && WCACHE.size === size && WCACHE.sectors) return WCACHE;
  WCACHE = {
    key: key,
    size: size,
    halo: _buildWheelHalo(size),
    sectors: _buildWheelSectors(players, size),
    hub: _buildWheelHub(size),
  };
  return WCACHE;
}

function _drawBracketWheelFrame(canvas, players, match_id){
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const key = match_id + "|" + players.map(p => (p && p.user_id) || "_").join(",");
  const cache = _getWheelCache(players, key, W);
  ctx.clearRect(0,0,W,H);
  // 3 drawImage:
  ctx.drawImage(cache.halo, 0, 0);
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(WHEEL_ANGLE);
  ctx.drawImage(cache.sectors, -W/2, -H/2);
  ctx.restore();
  ctx.drawImage(cache.hub, 0, 0);
}

function drawBracketWheelStatic(canvas, p1, p2, match_id){
  if(!canvas) return;
  _drawBracketWheelFrame(canvas, [p1, p2].filter(Boolean), match_id || "static");
}

function animateBracketSpin(s, m, onDone){
  let canvas = document.getElementById("wheel");
  if(!canvas){
    const wrap = document.createElement("div");
    wrap.className = "wheel-arena";
    wrap.innerHTML = `<div class="wheel-frame"><div class="wheel-frame-inner"><div class="pointer"></div><canvas id="wheel" width="640" height="640"></canvas></div></div>`;
    els.roomContent.innerHTML = wrap.outerHTML;
    canvas = document.getElementById("wheel");
  }
  const players = [m.p1, m.p2].filter(Boolean);
  const n = players.length;
  const winnerIdx = m.last_spin.winner_index;
  const offsetRatio = m.last_spin.final_offset_ratio || 0;
  const duration = m.last_spin.duration || 20000;
  const serverStart = m.last_spin.started_at || nowServer();
  const turns = pickSpinTurns();
  const span = Math.PI * 2 / n;
  const center = -(winnerIdx + 0.5) * span;
  const turnsRad = turns * Math.PI * 2;
  const target = center + offsetRatio * span + turnsRad;
  const startAngle = target - turnsRad;
  const el = nowServer() - serverStart;
  const initialK = Math.min(1, Math.max(0, el / duration));
  WHEEL_ANGLE = startAngle + (target - startAngle) * SPIN_EASING(initialK);
  _drawBracketWheelFrame(canvas, players, m.match_id);
  if(initialK >= 1){
    WHEEL_ANGLE = target;
    _drawBracketWheelFrame(canvas, players, m.match_id);
    if(onDone) onDone();
    return;
  }
  const mid = m.match_id;
  function frame(){
    if(BRACKET_ACTIVE_MATCH_ID !== mid) return;
    const elapsed = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, elapsed / duration));
    WHEEL_ANGLE = startAngle + (target - startAngle) * SPIN_EASING(k);
    _drawBracketWheelFrame(canvas, players, m.match_id);
    if(k < 1) BRACKET_MATCH_VIEW_ANIM[mid] = requestAnimationFrame(frame);
    else {
      WHEEL_ANGLE = target;
      _drawBracketWheelFrame(canvas, players, m.match_id);
      if(onDone) onDone();
    }
  }
  BRACKET_MATCH_VIEW_ANIM[mid] = requestAnimationFrame(frame);
}

function start1v1Animation(s){
  WHEEL_LOCK = true;
  WHEEL_LAST_SPIN_SHOWN = s.spin_count;
  const players = s.players || [];
  els.roomContent.innerHTML = `
    <div class="wheel-arena">

        <div class="wheel-frame-inner">
          <div class="pointer"></div>
          <canvas id="wheel" width="640" height="640"></canvas>
        </div>
      </div>
    </div>`;
  const realCanvas = document.getElementById("wheel");
  const n = players.length;
  const winnerIdx = s.last_spin.winner_index;
  const offsetRatio = s.last_spin.final_offset_ratio || 0;
  const duration = s.last_spin.duration || 8000;
  const serverStart = s.last_spin.started_at || nowServer();
  const turns = pickSpinTurns();
  const span = Math.PI * 2 / n;
  const center = -(winnerIdx + 0.5) * span;
  const turnsRad = turns * Math.PI * 2;
  const target = center + offsetRatio * span + turnsRad;
  const startAngle = target - turnsRad;
  function setPhase(){
    const el = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, el / duration));
    WHEEL_ANGLE = startAngle + (target - startAngle) * SPIN_EASING(k);
    return k;
  }
  setPhase(); _drawBracketWheelFrame(realCanvas, players, "1v1spin_" + (s.tid||""));
  function frame(){
    const k = setPhase();
    _drawBracketWheelFrame(realCanvas, players, "1v1spin_" + (s.tid||""));
    if(k < 1) requestAnimationFrame(frame);
    else {
      WHEEL_ANGLE = target;
      _drawBracketWheelFrame(realCanvas, players, "1v1spin_" + (s.tid||""));
      WHEEL_LOCK = false;
      if(PENDING_ENDED){ const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(()=>_showEndedModal(e), 600); }

  }
  requestAnimationFrame(frame);
}

  [...document.querySelectorAll("#acts button")].forEach(b => b.disabled = !myTurn);

  const cb = document.querySelector('[data-act="check"]');
  const cl = document.querySelector('[data-act="call"]');

  if(s.turn_deadline && myTurn && tfill){

    const rem = Math.max(0, s.turn_deadline - Date.now()/1000);
    tfill.style.width = Math.min(100,(rem/total2)*100)+"%";
  }

          <div style="display:flex;justify-content:center;">${btnHTML}</div>
        </div>
      </div>
    </div>
    ${participantsHtml}
  `;
  const canvas = document.getElementById("wheel");
  drawWheel(canvas, activeArr);
  const spinBtn = document.getElementById("spin-btn");
  if(spinBtn) spinBtn.addEventListener("click", () => {
    if(!IS_ADMIN){ showModal("⛔ Нет доступа","Крутить может только администратор",[]); return; }
    if(WHEEL_LOCK) return;
    if(!AUTO_SPIN){ AUTO_SPIN = true; wsSend({type:"spin"}); }
  });
}

const NEON_PALETTE = [
  {fill:["#ff1e56","#8b0000"], glow:"#ff1e56"},
  {fill:["#ff9500","#8b3a00"], glow:"#ff9500"},
  {fill:["#ffcc00","#a06a00"], glow:"#ffcc00"},
  {fill:["#dc143c","#5a0010"], glow:"#dc143c"},
  {fill:["#ff6b00","#8b3000"], glow:"#ff6b00"},
  {fill:["#e91e63","#7a0a2e"], glow:"#e91e63"},
];

function drawWheel(canvas, active){
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, r = Math.min(W,H)/2 - 30;
  ctx.clearRect(0,0,W,H);
  const haloGrad = ctx.createRadialGradient(cx,cy,r*0.6,cx,cy,r+30);
  haloGrad.addColorStop(0,"rgba(220,20,60,0)");
  haloGrad.addColorStop(0.7,"rgba(255,107,0,0.18)");
  haloGrad.addColorStop(1,"rgba(255,204,0,0)");
  ctx.fillStyle = haloGrad;
  ctx.beginPath(); ctx.arc(cx,cy,r+30,0,Math.PI*2); ctx.fill();
  const n = Math.max(active.length, 1);
  if(active.length === 0){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    const emptyGrad = ctx.createRadialGradient(cx,cy,r*0.3,cx,cy,r);
    emptyGrad.addColorStop(0,"#241608"); emptyGrad.addColorStop(1,"#140a06");
    ctx.fillStyle = emptyGrad; ctx.fill();
    ctx.strokeStyle = "rgba(255,149,0,.6)"; ctx.lineWidth = 3;
    ctx.shadowColor = "#ff9500"; ctx.shadowBlur = 30; ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#7a5c3a"; ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Ожидание", cx, cy); drawHub(ctx, cx, cy); return;
  }
  for(let i = 0; i < n; i++){
    const a0 = (i/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const a1 = ((i+1)/n)*Math.PI*2 - Math.PI/2 + WHEEL_ANGLE;
    const col = NEON_PALETTE[i % NEON_PALETTE.length];
    const grad = ctx.createRadialGradient(cx,cy,r*0.2,cx,cy,r);
    grad.addColorStop(0, col.fill[0]); grad.addColorStop(1, col.fill[1]);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.save(); ctx.strokeStyle = col.glow; ctx.lineWidth = 3;
    ctx.shadowColor = col.glow; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx + r*Math.cos(a0), cy + r*Math.sin(a0));
    ctx.stroke(); ctx.restore();
    const mid = (a0 + a1) / 2;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(mid);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 20px 'Segoe UI',sans-serif";
    const label = active[i].name || "";
    const txt = label.length > 14 ? label.slice(0,14)+"…" : label;
    ctx.fillText(txt, r - 18, 0); ctx.restore();
  }
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 6;
  ctx.shadowColor = "#ffcc00"; ctx.shadowBlur = 25; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r-4,0,Math.PI*2);
  ctx.strokeStyle = "#dc143c"; ctx.lineWidth = 2;
  ctx.shadowColor = "#dc143c"; ctx.shadowBlur = 15; ctx.stroke(); ctx.restore();
  drawHub(ctx, cx, cy);
}

function drawHub(ctx, cx, cy){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,58,0,Math.PI*2);
  const hubGrad = ctx.createRadialGradient(cx,cy,5,cx,cy,58);
  hubGrad.addColorStop(0,"#3d2412"); hubGrad.addColorStop(1,"#140a06");
  ctx.fillStyle = hubGrad; ctx.shadowColor = "#dc143c"; ctx.shadowBlur = 30; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,58,0,Math.PI*2);
  ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 4;
  ctx.shadowColor = "#ffcc00"; ctx.shadowBlur = 20; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "36px sans-serif"; ctx.shadowColor = "#ffcc00"; ctx.shadowBlur = 20;
  ctx.fillText("🎡", cx, cy); ctx.restore();
}

function startSpinAnimation(s){
  WHEEL_LOCK = true;
  WHEEL_LAST_SPIN_SHOWN = s.spin_count;
  let activeWithElim;
  if(s.last_spin.before_active) activeWithElim = s.last_spin.before_active.map(p => ({...p}));
  else { activeWithElim = s.active.slice(); activeWithElim.splice(s.last_spin.sector_index, 0, s.last_spin.eliminated); }
  const canvas = document.getElementById("wheel");
  if(!canvas){ WHEEL_LOCK = false; return; }
  const n = activeWithElim.length;
  const idx = s.last_spin.sector_index;
  const offsetRatio = s.last_spin.final_offset_ratio || 0;
  const duration = s.last_spin.duration || 8000;
  const serverStart = s.last_spin.started_at || nowServer();
  const turns = pickSpinTurns();
  const span = Math.PI * 2 / n;
  const center = -(idx + 0.5) * span;
  const turnsRad = turns * Math.PI * 2;
  const target = center + offsetRatio * span + turnsRad;
  const startAngle = target - turnsRad;
  function setPhase(force){
    const el = nowServer() - serverStart;
    const k = Math.min(1, Math.max(0, el / duration));
    WHEEL_ANGLE = startAngle + (target - startAngle) * SPIN_EASING(k);
    if(force){ const c = document.getElementById("wheel"); if(c) drawWheel(c, activeWithElim); }
    return k;
  }
  let k = setPhase(true);
  if(k >= 1){
    WHEEL_ANGLE = target;
    const c = document.getElementById("wheel"); if(c) drawWheel(c, activeWithElim);
    setTimeout(() => {
      hide(els.modal); WHEEL_LOCK = false;
      const finalState = WHEEL_NEXT || s;
      WHEEL_NEXT = null;
      updateWheelDOMOnly(finalState);
      if(PENDING_ENDED){ const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(() => _showEndedModal(e), 500); return; }
      if(finalState.finished){ stopAutoSpin(); return; }
      if(AUTO_SPIN && (finalState.active||[]).length >= 2 && ACTIVE_TID && WS && WS.readyState === 1){
        AUTO_TIMER = setTimeout(() => { if(AUTO_SPIN && WS.readyState === 1) wsSend({type:"spin"}); }, 7000);
      } else stopAutoSpin();
    }, 100);
    return;
  }
  function frame(){
    const kk = setPhase(false);
    const c = document.getElementById("wheel"); if(c) drawWheel(c, activeWithElim);
    if(kk < 1){ requestAnimationFrame(frame); }
    else {
      WHEEL_ANGLE = target;
      const c2 = document.getElementById("wheel"); if(c2) drawWheel(c2, activeWithElim);
      showModal("❌ Выбывает", `<b>${escapeHtml(s.last_spin.eliminated.name)}</b><br>покидает турнир!`, []);
      setTimeout(() => {
        hide(els.modal); WHEEL_LOCK = false;
        const finalState = WHEEL_NEXT || s;
        WHEEL_NEXT = null;
        updateWheelDOMOnly(finalState);
        if(PENDING_ENDED){ const e = PENDING_ENDED; PENDING_ENDED = null; setTimeout(() => _showEndedModal(e), 500); return; }
        if(finalState.finished){ stopAutoSpin(); return; }
        if(AUTO_SPIN && (finalState.active||[]).length >= 2 && ACTIVE_TID && WS && WS.readyState === 1){
          AUTO_TIMER = setTimeout(() => { if(AUTO_SPIN && WS.readyState === 1) wsSend({type:"spin"}); }, 7000);
        } else stopAutoSpin();
      }, 2500);
    }
  }
  requestAnimationFrame(frame);
}

/* ===== CONTROLS ===== */
document.addEventListener("click", e => {
  const btn = e.target.closest("#acts button");
  if(!btn || btn.disabled) return;
  const act = btn.dataset.act;
